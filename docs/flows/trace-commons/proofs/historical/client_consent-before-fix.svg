t audit is recorded or The</tspan><tspan x="529" y="398.9">fresh grant is saved or The</tspan><tspan x="529" y="416.9">sharing choice requests the</tspan><tspan x="529" y="434.9">saved grant or You withdraw</tspan><tspan x="529" y="452.9">the grant or The sharing choice</tspan><tspan x="529" y="470.9">receives the saved grant</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state bugPath" data-id="s0" transform="translate(319.1,186)"><rect x="-71.58" y="-22" width="143.17" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">consent_choice</text></g><g class="pele-node pele-state mayBreak bugPath" data-id="s1" transform="translate(319.1,376)"><rect x="-74.7" y="-22" width="149.39" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)" style="fill:#fff3e6;stroke:#e8730c;stroke-width:2.5px;"/><text class="pele-label" style="fill:#b85a06;" x="0" y="5.6" text-anchor="middle">consent_internal</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(319.1,113)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state mayBreak" data-id="lg0" transform="translate(488.36,82)"><rect x="-106.26" y="-22" width="212.51" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)" style="fill:#fff3e6;stroke:#e8730c;stroke-width:2.5px;"/><text class="pele-label" style="fill:#b85a06;" x="0" y="5.6" text-anchor="middle">Breaks P1 in some cases</text></g><g class="pele-node pele-state bugPath" data-id="lg1" transform="translate(716.89,82)"><rect x="-82.27" y="-22" width="164.54" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Path to the P1 bug</text></g></g></g></svg>