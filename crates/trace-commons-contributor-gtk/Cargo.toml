# The Linux contributor shell.
#
# This is its own workspace, not a member of the repository root's. The root
# workspace builds on macOS, and every crate in it must keep doing so; this
# one links GTK 4 and libadwaita and cannot build there at all. Excluding it
# keeps `cargo check` at the root honest instead of newly broken, and keeps
# the GTK dependency tree out of every other crate's lockfile.
[workspace]

[package]
name = "trace-commons-contributor-gtk"
version = "0.4.7"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zmanian/trace-commons-server"
description = "GTK 4 contributor shell for Trace Commons (Linux)"

[[bin]]
name = "trace-commons-shell"
path = "src/main.rs"

[[bin]]
name = "trace-commons-shell-probe"
path = "src/bin/probe.rs"

[dependencies]
# The core is linked directly rather than through the C ABI: on Linux both
# sides are Rust, so the FFI layer would buy nothing and cost a marshalling
# boundary. macOS and Windows keep using the C ABI.
trace-commons-contributor = { path = "../trace-commons-contributor" }
# For `secret_leak_pattern_names`, so the "What gets removed?" list is
# generated from the detector table rather than transcribed into a sentence
# that stops being true. Already in the dependency tree via
# trace-commons-contributor; declaring it directly adds zero new packages.
trace-commons-protocol = { path = "../trace-commons-protocol" }
# Same commit stamp the server binaries carry, so a shell reported in a bug
# can be identified without asking which build the reporter installed.
trace-commons-build-info = { path = "../trace-commons-build-info" }
# The mark's geometry, palette and SVG emitters. This crate holds the one
# description; ui/mark.rs re-exports it and keeps only the cairo drawing.
# Dependency-free by construction, so it costs this build nothing.
trace-commons-mark = { path = "../trace-commons-mark" }

adw = { package = "libadwaita", version = "0.5", features = ["v1_2"] }
gtk = { package = "gtk4", version = "0.7" }
glib = "0.18"

anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
# Resolves the state directory the same way the core does (dirs::config_dir),
# and used again here to locate the systemd user unit and the XDG autostart
# directory -- both already `~/.config`-relative in the same sense. Already
# in the dependency tree via trace-commons-contributor; declaring it directly
# adds zero new packages.
dirs = "6"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
# The XDG Background portal (org.freedesktop.portal.Background) and the
# StatusNotifierItem tray are both raw D-Bus surfaces with no higher-level
# Rust binding already in the tree. zbus is already resolved transitively
# through notify-rust's own D-Bus use, at the same major version pinned
# here, so this adds zero new packages -- only a direct edge.
zbus = "5"
