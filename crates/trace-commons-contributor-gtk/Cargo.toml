# The Linux contributor shell.
#
# This is its own workspace, not a member of the repository root's. Excluding
# it keeps `cargo check` at the root from dragging in GTK, and keeps the GTK
# dependency tree out of every other crate's lockfile.
#
# It DOES build and test on macOS, contrary to what this comment claimed until
# 2026-09-08: verified there against Homebrew's gtk4 4.22.4 and libadwaita-1
# 1.9.3, `cargo test` green. The app itself is Linux-only -- the tray, the
# portal and autostart paths are -- but the crate compiles and its unit tests
# run anywhere the two libraries are installed, so a Linux-shell change can be
# checked locally rather than waited on. Being a separate workspace means a
# `--workspace` run at the root does NOT cover it: check it explicitly.
[workspace]

[package]
name = "trace-commons-contributor-gtk"
version = "1.0.8"
edition = "2024"
# Tracks the root workspace's floor by hand -- this crate is deliberately not
# a member of it, so `rust-version.workspace = true` is unavailable. Raised
# from 1.92 on 2026-09-06 with the root: this crate links
# trace-commons-contributor directly, so the ironwire_*/ironclaw_* crates and
# their rust-version = 1.96 are in this lockfile too. The flatpak manifest's
# pinned toolchain tarball must move with this value; ci.yml's MSRV floor job
# fails if it does not, and release-apps.yml's dispatch-only linux-flatpak job
# checks it again.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TraceCommons/trace-commons"
description = "GTK 4 contributor shell for Trace Commons (Linux)"

[[bin]]
name = "trace-commons-shell"
path = "src/main.rs"

[[bin]]
name = "trace-commons-shell-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "near-ai"
path = "src/bin/near-ai.rs"

[features]
# Spike S1/S2 of the 2026-11-16 window-and-map spec: translucency and KDE blur.
# OFF by default, so default builds, CI and the flatpak are unchanged. Turns on
# the Linux-only crates below and the `blur_spike` example. Not for merge; see
# docs/superpowers/plans/2026-11-16-linux-blur-spike.md.
blur-spike = [
  "dep:gdk4-wayland",
  "dep:gdk4-x11",
  "dep:wayland-client",
  "dep:wayland-protocols-plasma",
  "dep:x11rb",
]

[[example]]
name = "blur_spike"
required-features = ["blur-spike"]

[dependencies]
# The core is linked directly rather than through the C ABI: on Linux both
# sides are Rust, so the FFI layer would buy nothing and cost a marshalling
# boundary. macOS and Windows keep using the C ABI.
trace-commons-contributor = { path = "../trace-commons-contributor" }
# For `secret_leak_pattern_names`, so the "What gets removed?" list is
# generated from the detector table rather than transcribed into a sentence
# that stops being true. Already in the dependency tree via
# trace-commons-contributor; declaring it directly adds zero new packages.
trace-commons-protocol = { path = "../trace-commons-protocol" }
# Same commit stamp the server binaries carry, so a shell reported in a bug
# can be identified without asking which build the reporter installed.
trace-commons-build-info = { path = "../trace-commons-build-info" }
# The mark's geometry, palette and SVG emitters. This crate holds the one
# description; ui/mark.rs re-exports it and keeps only the cairo drawing.
# Dependency-free by construction, so it costs this build nothing.
trace-commons-mark = { path = "../trace-commons-mark" }

# Keep these on the same gtk-rs generation: glib >=0.20 fixes
# RUSTSEC-2024-0429 (VariantStrIter out-argument mutability).
adw = { package = "libadwaita", version = "0.7", features = ["v1_2"] }
gtk = { package = "gtk4", version = "0.9" }
glib = "0.20"

anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
# Resolves the state directory the same way the core does (dirs::config_dir),
# and used again here to locate the systemd user unit and the XDG autostart
# directory -- both already `~/.config`-relative in the same sense. Already
# in the dependency tree via trace-commons-contributor; declaring it directly
# adds zero new packages.
dirs = "6"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
# The XDG Background portal (org.freedesktop.portal.Background) and the
# StatusNotifierItem tray are both raw D-Bus surfaces with no higher-level
# Rust binding already in the tree. zbus is already resolved transitively
# through notify-rust's own D-Bus use, at the same major version pinned
# here, so this adds zero new packages -- only a direct edge.
zbus = "5"

# Spike-only (feature `blur-spike`), Linux-only. See the dependency write-up in
# docs/superpowers/plans/2026-11-16-linux-blur-spike.md before keeping any.
[target.'cfg(target_os = "linux")'.dependencies]
gdk4-wayland = { version = "0.9", features = ["wayland_crate"], optional = true }
gdk4-x11 = { version = "0.9", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.13", default-features = false, optional = true }

[lints.rust]
unsafe_code = "forbid"
