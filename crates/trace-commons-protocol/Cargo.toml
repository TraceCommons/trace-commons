[package]
name = "trace-commons-protocol"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The integration tests are listed as [[test]] targets at the end of this file.
autotests = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Pure-Rust backend only. The local credit estimate's deflate ratio must match
# between the daemon and the server, and a zlib backend compresses differently.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = { version = "0.3", optional = true }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls-native-roots"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", optional = true }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tiktoken-rs = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "time"] }
wiremock = "0.6"

[features]
# `dep:tiktoken-rs` is no longer used by this backend (it windows by request
# body), but stays in the feature so the separate GTK and Tauri lockfiles,
# which reach this crate only through the contributor, do not change. Drop it
# together with a refresh of those lockfiles and the flatpak vendor manifest.
near-ai-privacy-filter = ["dep:reqwest", "dep:futures", "dep:tracing", "dep:tiktoken-rs"]
# Loopback classifier backend. No tokenizer and no concurrent streams: the
# local model has a real 128k context, so a field goes up in one request.
self-hosted-privacy-filter = ["dep:reqwest", "dep:tracing", "dep:tiktoken-rs", "dep:futures"]

# Integration tests. `it` holds every tests/*.rs file not listed below as a
# module, so the dependency graph links once rather than once per file; see
# tests/it.rs.
[[test]]
name = "it"
path = "tests/it.rs"
