[package]
name = "trace-commons-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
# The integration tests are listed as [[test]] targets at the end of this file.
autotests = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
bytes = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
# bech32/k256/ripemd together implement the Cosmos half of the self-serve
# invite claims: ADR-036 secp256k1 signature verification and the
# `bech32(hrp, ripemd160(sha256(pubkey)))` address derivation that binds a
# signing key to the address it controls. `cosmrs` would have been one crate
# instead of three, but drags in tendermint-rs, prost and tonic for what is
# one signature check and one digest pipeline.
bech32 = "0.11"
borsh = { version = "1", features = ["derive"] }
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
# Quote verification itself moved to `trace-commons-attestation`, which is
# where this dependency is now declared. It stays here too because
# `near_attestation::client` names `dcap_qvl::collateral::CollateralClient`
# directly, and that collateral fetch is server-side and stays AGPL. Same
# version and same feature set, so cargo unifies them into one build of the
# crate; the reasoning for the feature set is repeated there.
# `danger-allow-tcb-override` must stay off -- it does exactly what its name
# says.
dcap-qvl = { version = "0.6", default-features = false, features = [
    "std",
    "ring",
    "default-x509",
] }
dotenvy = "0.15"
hex = "0.4"
hkdf = "0.12"
jsonwebtoken = "9"
k256 = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
ripemd = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# keccak256, for recovering the EIP-191 signer of a NEAR AI inference receipt.
# 0.10 deliberately, to share the digest 0.10 tree that sha2 above already
# pulls in rather than adding a second one.
sha3 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
zstd = "0.14.3"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
# `receipt`: this crate recovers EIP-191 signers, both for NEAR AI inference
# receipts and for redaction-witness certificates. The feature is off by
# default in that crate so a permissive client can take quote verification
# without `k256` and `sha3`.
trace-commons-attestation = { path = "../trace-commons-attestation", features = [
    "receipt",
] }
trace-commons-build-info = { path = "../trace-commons-build-info" }
trace-commons-gate-api = { path = "../trace-commons-gate-api" }
trace-commons-gate-enclave = { path = "../trace-commons-gate-enclave" }
trace-commons-operator-client = { path = "../trace-commons-operator-client" }
trace-commons-protocol = { path = "../trace-commons-protocol", features = [
    "near-ai-privacy-filter",
    "self-hosted-privacy-filter",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
google-cloud-storage = { version = "0.24", optional = true }
google-cloud-kms = { version = "0.6", optional = true }
hf-hub = { version = "0.4.3", default-features = false, features = ["tokio", "rustls-tls"] }

[features]
default = []
# Compile the production GCS client wrapping the `google-cloud-storage` crate
# (uses Application Default Credentials). Off by default so hermetic CI builds
# don't pull the GCS dependency tree.
gcs-client = ["dep:google-cloud-storage"]
# Compile the production GCP Cloud KMS client for the CloudKmsKeyWrapper adapter.
# Off by default so hermetic CI builds don't pull the KMS dependency tree.
gcp-kms = ["dep:google-cloud-kms"]
# Pulls in the candle-backed `CandlePerplexityScorer` in `trace-commons-gate-enclave`
# and enables the `enclave_local_gpu` arm of `TRACE_COMMONS_GATE_SERVICE` in the
# `trace-commons-ingest` binary. Off by default so hermetic CI builds and dev hosts
# without candle / tokenizers / hf-hub installed continue to compile cleanly.
# Phase A2 wires this with a `CandlePerplexityScorer` + `MockEmbedder` +
# `MockVectorIndex`; A3 / A4 swap the latter two for real implementations.
local-gpu-models = ["trace-commons-gate-enclave/local-gpu-models"]
# Add-on that forwards to `trace-commons-gate-enclave/local-gpu-models-cuda`, which
# pulls in the candle CUDA backend. Implies `local-gpu-models`. Only useful on
# hosts with the CUDA toolchain installed; CI builds keep this off.
local-gpu-models-cuda = ["local-gpu-models", "trace-commons-gate-enclave/local-gpu-models-cuda"]
# Forwards to `trace-commons-gate-enclave/near-ai-scorer`. Enables the NEAR AI
# Cloud-backed perplexity + token-rarity scorer in the bake-off binary's
# `--scorer-backend=near-ai` arm. Independent of `local-gpu-models` so a
# TEE-hosted scoring host compiles without the mistralrs/candle/CUDA stack.
near-ai-scorer = ["trace-commons-gate-enclave/near-ai-scorer"]
# Compile the Intel DCAP collateral client used by the NEAR AI attestation
# drill (`POST /v1/admin/near-attestation-drill`). Forwards to `dcap-qvl`'s
# `report` feature, which is that crate's collateral client and which pulls a
# second async HTTP stack (reqwest 0.13) plus `futures` into the build --
# nothing else in this workspace compiles reqwest 0.13 by default. Off by
# default for that reason. With it off the drill still exists and still runs;
# its collateral step refuses with the missing control
# `near_ai_attestation_collateral_client`, so the gap is a red drill with a
# named cause rather than an absent route. Fetching the PCS endpoints by hand
# is not the alternative: FMSPC extraction and CRL handling are exactly what
# `dcap-qvl` gets right.
near-attestation-collateral = ["trace-commons-attestation/collateral-client"]
# Switch the compiled-in NEAR AI API base (`src/near_ai_api.rs`) to NEAR AI
# staging, for login introspection and the NEAR AI payout rail together.
# Readiness reports it. Never enabled in a release workflow or a shipped
# manifest: scripts/ci/check-release-staging-feature.sh refuses one that does.
# One line, so that script can permit this exact definition. It also
# compiles the attestation crate's signed pin-set format, which the staging
# pin re-sign tool (`trace-commons-staging-pins`) signs and checks.
near-ai-staging = ["trace-commons-attestation/near-ai-staging"]

[[bin]]
name = "trace-commons-gate-calibrate"
path = "src/bin/trace-commons-gate-calibrate.rs"
# Binary is buildable without features so the `bake-off` subcommand (which
# uses the deterministic mock scorer) is exercisable in hermetic CI. The
# env-driven `calibrate` subcommand still requires `local-gpu-models` at
# runtime and bails with a clear error when invoked without it.

[[bin]]
name = "trace-commons-vector-replay"
path = "src/bin/trace-commons-vector-replay.rs"
required-features = ["local-gpu-models"]

[[bin]]
name = "trace-commons-pilot-bootstrap"
path = "src/bin/trace-commons-pilot-bootstrap.rs"

[[bin]]
name = "trace-commons-review"
path = "src/bin/trace-commons-review.rs"

[[bin]]
name = "trace-commons-repair-upload-ownership"
path = "src/bin/trace-commons-repair-upload-ownership.rs"

[[bin]]
name = "trace-commons-admin"
path = "src/bin/trace-commons-admin.rs"

[[bin]]
name = "trace-commons-worker"
path = "src/bin/trace-commons-worker.rs"

[[bin]]
name = "trace-commons-tenant"
path = "src/bin/trace-commons-tenant.rs"

[[bin]]
name = "trace-commons-smoke-envelope"
path = "src/bin/trace-commons-smoke-envelope.rs"

[[bin]]
name = "trace-commons-witness"
path = "src/bin/trace-commons-witness.rs"

# Build, sign (through Google Cloud KMS) and verify the signed witness
# accepted-measurements list that ingest serves at
# /v1/public/witness-accepted-list. Runbook:
# docs/operator/witness-accepted-list.md.
[[bin]]
name = "trace-commons-witness-list"
path = "src/bin/trace-commons-witness-list.rs"

# The staging NEAR AI pin re-sign tool: observes NEAR AI staging's enclave
# measurements and signs the pin set a staging app trusts. Operators run it;
# nothing ships it. `observe` also needs `near-attestation-collateral` to
# fetch Intel collateral, and refuses with that control's name without it.
[[bin]]
name = "trace-commons-staging-pins"
path = "src/bin/trace-commons-staging-pins.rs"
required-features = ["near-ai-staging"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# The contributor crate, for `tests/witness_certificate_cross_implementation.rs`
# ONLY: that test drives this crate's witness router and requires the CLIENT's
# own certificate verifier to accept what it produced. The two sides encode the
# signing preimage twice, and nothing else compares them.
#
# This is the legal direction across the licence boundary -- AGPL may depend on
# MIT OR Apache-2.0, never the reverse -- which is why the test lives here and
# not in the contributor crate. It is a [dev-dependencies] entry and MUST NOT be
# promoted to a normal dependency.
trace-commons-contributor = { path = "../trace-commons-contributor" }
wiremock = "0.6"

# Integration tests. `it` holds every tests/*.rs file not listed below as a
# module, so the dependency graph links once rather than once per file; see
# tests/it.rs.
[[test]]
name = "it"
path = "tests/it.rs"

# Its own binary: it installs a process-wide tracing subscriber at TRACE
# level and asserts on what it captures, which would then hold every other
# test's logs.
[[test]]
name = "near_ai_rail_mock"
path = "tests/near_ai_rail_mock.rs"

# Its own binary: the `staging channel tests` CI step builds it with the
# near-ai-staging feature. As a module of `it`, that step would build every
# other test file under the feature too.
[[test]]
name = "staging_pins_tool"
path = "tests/staging_pins_tool.rs"

# Every PostgreSQL suite is its own binary, as before. Suites that point at
# the same database must not run at the same time: their fixtures migrate and
# count table-wide, and each suite's lock or once-cell covers only itself.
