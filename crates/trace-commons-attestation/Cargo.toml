[package]
name = "trace-commons-attestation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Intel DCAP quote verification, for NEAR AI's TDX attestation reports.
# Not the default feature set: `report` pulls a second async HTTP stack for
# fetching collateral, and `rustcrypto` a second crypto backend, where `ring`
# is already a dependency here. `danger-allow-tcb-override` must stay off --
# it does exactly what its name says.
#
# One consequence of it living in a permissive crate now: `dcap-qvl`'s
# mandatory `std` feature turns on `serde_json/preserve_order`, so any crate
# that comes to depend on this one inherits an insertion-ordered
# `serde_json::Map` in its own standalone build graph. That is fine and is
# already true of the server, but see `trace_commons_protocol::canonical_json`
# before wiring this crate into a contributor crate -- canonical JSON must not
# be sensitive to it.
dcap-qvl = { version = "0.6", default-features = false, features = [
    "std",
    "ring",
    "default-x509",
] }
# `hex` and `thiserror` are used through fully-qualified paths and a derive
# attribute, so they do not appear in any `use` line but are required all the
# same. Every version here matches what the server and protocol crates already
# pin, so the trees stay unified.
hex = "0.4"
k256 = { version = "0.13", optional = true }
serde_json = "1"
sha2 = "0.10"
sha3 = { version = "0.10", optional = true }
thiserror = "2"

[features]
default = []
# NEAR AI receipt verification and EIP-191 signer recovery. Off by default
# because `k256` and `sha3` are the only dependencies here that quote
# verification does not need, and measured against
# `cargo tree -p trace-commons-contributor` they bring nineteen packages new to
# that crate. Quote verification -- the thing a contributor does before it
# hands an enclave a raw session -- needs none of them.
#
# Enabling this is what a caller does when it must recover a signer, which
# includes verifying a redaction-witness certificate as well as a NEAR AI
# receipt. `address::decode_address` stays outside the feature: comparing a
# pinned address against the one a quote's report data names is hex, not a
# curve.
receipt = ["dep:k256", "dep:sha3"]
# `dcap-qvl`'s collateral client, which the hosted server's attestation drill
# reaches through `trace-commons-server/near-attestation-collateral`. Nothing
# in this crate uses it; it exists only so the server can turn the feature on
# now that `dcap-qvl` is declared here rather than there. It pulls a second
# async HTTP stack (reqwest 0.13) plus `futures` into the build, which is why
# it is off by default.
collateral-client = ["dcap-qvl/report"]
