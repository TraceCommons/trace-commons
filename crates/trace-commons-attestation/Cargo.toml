[package]
name = "trace-commons-attestation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The brief listed only k256/sha2/sha3. `hex` and `thiserror` are used through
# fully-qualified paths and a derive attribute, so they do not appear in the
# file's `use` lines but are required all the same. Versions match the ones
# the server and protocol crates already pin, so the trees stay unified.
hex = "0.4"
k256 = "0.13"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
