[package]
name = "trace-commons-contributor-ffi"
version = "0.20.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# The macOS app runs its daemon in this dylib, so this is where the app turns
# on the contributor's `subscription-usage` (PR #1608, first slice: Codex
# usage on Refresh, behind a settings switch that is off by default). A
# default feature rather than a channel file entry, so both channels'
# `make-app-bundle.sh` builds carry it with no script change;
# `--no-default-features` builds a dylib without the surface.
default = ["subscription-usage"]
subscription-usage = ["trace-commons-contributor/subscription-usage"]

[dependencies]
trace-commons-contributor = { path = "../trace-commons-contributor" }
# For `secret_leak_pattern_names`, so `tc_scrub_detector_names` reports what
# the scrubber actually looks for rather than a list a shell transcribed.
# Already in the tree via trace-commons-contributor; adds no new packages.
trace-commons-protocol = { path = "../trace-commons-protocol" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
