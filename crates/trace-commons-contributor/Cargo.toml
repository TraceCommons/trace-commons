[package]
name = "trace-commons-contributor"
version = "1.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The integration tests are listed as [[test]] targets at the end of this file.
autotests = false

[features]
# TEST-ONLY. Routes both OS credential stores (device key, account session,
# Cloud credentials) to a plaintext file store inside the config directory,
# and makes `OsSecretBackend::new` refuse. Integration tests link this crate
# without `cfg(test)`, so without it every test that generated a device
# identity wrote a real login-keychain item and left it there. It also
# exposes `ManagedRoute::start_against`, which starts a managed route against
# a local fixture instead of NEAR AI, for `tests/managed_statusline.rs`, the
# native-auth wire primitives for the separate client/server contract suite,
# and `ConfigStore::lower_envelope_limit_for_tests` with
# `envelope::TEST_ENVELOPE_LIMIT_BYTES`, which lower one test state
# directory's envelope limit so `tests/daemon_ipc_contract.rs` need not build
# a 256 MiB session.
#
# Enabled ONLY by test dev-dependencies: the self dependency below and the
# unpublished trace-commons-client-server-tests package. Never enable it for
# `cargo build`/`--release` of a shipped binary.
# `tests/credential_store_isolation.rs` fails if the wiring is lost.
#
# Also forwarded to the sources crate, where it points the conventional-root
# home fallback at an empty folder, so a test that forgets to declare its
# sources never reads the developer's real ~/.claude or ~/.codex.
#
# Forwarded to the Insights and platform crates, which now hold the digest-key
# custody and the OS credential store. Under it the platform store refuses to
# open from every build but that crate's own unit tests, so this crate's unit
# tests no longer get the `cfg(test)` exemption they had while the store lived
# here.
# One line, so scripts/ci/check-release-credential-store.sh can permit this
# exact definition.
test-credential-store = ["trace-commons-contributor-insights/test-credential-store", "trace-commons-contributor-platform/test-credential-store", "trace-commons-contributor-sources/test-credential-store"]

# The staging channel (`src/channel.rs`): NEAR AI staging, the staging
# server, staging identity values, and NEAR AI measurement pins taken only
# from the signed staging pin set, whose verifier the attestation crate's
# feature compiles. Never enabled in a release workflow or a shipped
# manifest: scripts/ci/check-release-staging-feature.sh refuses one that
# does. One line, so that script can permit this exact definition.
near-ai-staging = ["trace-commons-attestation/near-ai-staging"]

[dependencies]
trace-commons-protocol = { path = "../trace-commons-protocol", features = ["near-ai-privacy-filter"] }
trace-commons-operator-client = { path = "../trace-commons-operator-client" }
trace-commons-build-info = { path = "../trace-commons-build-info" }
# The session parsers and routing overlay, split out so a daemon edit does
# not recompile them. Re-exported as `source` and `routing`. A workspace crate
# at this crate's version with no dependency this crate lacks, so it adds no
# third-party package.
trace-commons-contributor-sources = { path = "../trace-commons-contributor-sources" }
# Local Insights, split out so a client edit elsewhere does not recompile it,
# and the OS credential store and file primitives it shares with this crate.
# Re-exported as `insights` and at the old `daemon::credential_store`,
# `daemon::os_secret_store`, `config::write_atomic_0600`,
# `evidence_import::open_import_file` and
# `daemon::win_pipe::current_user_sid_string` paths. Workspace crates at this
# crate's version with no dependency this crate lacks, so they add no
# third-party package.
trace-commons-contributor-insights = { path = "../trace-commons-contributor-insights" }
trace-commons-contributor-platform = { path = "../trace-commons-contributor-platform" }
# DCAP quote verification and EIP-191 signer recovery, for the redaction
# witness: this client verifies an enclave's measurement BEFORE handing it a
# raw session, and verifies the certificate it gets back before forwarding it.
#
# Measured cost, `cargo tree -p trace-commons-contributor -e normal`:
# 162 packages before, 227 after. Approved at that figure.
# `receipt` is on because this crate now fetches and carries NEAR AI
# inference receipts to a witness. That feature's own comment used to say a
# contributor client does not enable it "because it makes no inference calls
# and holds no receipts" -- true until the attested-inference path existed,
# false now. It adds NO packages: `k256` and `sha3` are unconditional in that
# crate because EIP-191 recovery also verifies a redaction-witness
# certificate, which this crate already did.
trace-commons-attestation = { path = "../trace-commons-attestation", features = ["receipt"] }
anyhow = "1"
# Promoted from dev-dependencies: the witness transport is a trait object so
# a recording double can assert the verify-then-send ordering. Adds no
# packages -- it was already in this crate's dev graph.
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
# Approved for read-only OpenCode session discovery; already used by IronWire.
rusqlite = { version = "0.41", features = ["bundled", "hooks", "fallible_uint"] }
# OS credential stores approved by the operator on 2026-09-09.
keyring-core = "=1.0.0"
# IronWire's proxy, run in-process behind the private_inference switch, and
# two more of its crates used directly: `ironwire_agents` (pointing a coding
# tool's own config at the proxy without taking the file over) and
# `ironwire_catalog` (the `Catalog` type its API takes). The ironwire_* crates
# live in this repository since 2026-11-10, imported from nearai/ironwire at
# b234896; the pin history before that is in this file's git log.
ironwire_proxy = { path = "../ironwire_proxy" }
ironwire_agents = { path = "../ironwire_agents" }
ironwire_catalog = { path = "../ironwire_catalog" }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
# A direct dependency, not dev-only: the Antigravity import command (staged
# after this task) writes files to a scratch directory before upload, the
# same way the file-reading source it replaces used to.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "net", "sync", "signal", "process"] }
tracing = "0.1"
# Reads the Antigravity language server's command line to find its CSRF
# token. Pinned to 0.36 to match the version already in this workspace's
# lockfile via mistralrs-core, so it adds no package. (It was also once held
# here because 0.39.x needs Rust 1.95 and the floor was 1.92; the floor is
# 1.96 now, so only the lockfile-match reason still holds. Moving it is a
# dependency change and wants its own review.)
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Direct rather than reached through trace-commons-operator-client, because
# the witness transport parses a URL to run it past the same HostAllowlist
# `issuer_url` and `ingest_url` pass. Adds no packages -- it is already in
# this crate's graph through that client.
url = "2"

# Windows only. The daemon's transport there is a named pipe in the
# machine-wide namespace, whose DACL is the sole access control on it (the
# unix build relies on its 0700 state directory instead, and needs none of
# this). Building that descriptor requires Win32 directly: tokio exposes only
# `create_with_security_attributes_raw`, which takes a raw pointer.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain", "protected"] }
# `security-framework` moved to trace-commons-contributor-platform with
# `os_secret_store`, whose `storage_error` is its only user here.

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# Itself, for the test-only feature: see `test-credential-store` above.
trace-commons-contributor = { path = ".", features = ["test-credential-store"] }
# Test-only: compresses fixture rollouts the way Codex does. Production
# decoding lives in trace-commons-contributor-sources; same version, no new
# package.
zstd = "0.14.3"
axum = "0.8"
# Test-only: `daemon::notify`'s evening digest schedule is generic over
# `chrono::TimeZone` so production can pass `chrono::Local` (the real system
# timezone) while a test picks a fixed IANA zone with known DST transitions
# (`America/New_York`) instead of depending on the CI runner's own timezone.
# Already resolved in Cargo.lock via `ironclaw_common`'s dependency on it, so
# this adds no new lock entry, only a direct edge to one that existed.
chrono-tz = "0.10"
# Signing test certificates, so the certificate-verification tests exercise
# real secp256k1/EIP-191 rather than a fixture nobody can regenerate. Both are
# already in this crate's graph through trace-commons-attestation, so they add
# no packages.
k256 = "0.13"
sha3 = "0.10"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["net", "test-util"] }

# Cross-contract tests live in trace-commons-client-server-tests. Keep the
# server out of this crate's dev-dependencies too: otherwise even a filtered
# client unit-test run must compile the server and its dependency tree.

[[example]]
name = "compute-package"
test = true

# Integration tests. `it` holds every tests/*.rs file not listed below as a
# module, so the dependency graph links once rather than once per file; see
# tests/it.rs.
[[test]]
name = "it"
path = "tests/it.rs"

# Its own binary: it sets HOME, XDG_CONFIG_HOME and IRONWIRE_HOME for the
# whole process, which every other test in a shared process would then read.
[[test]]
name = "k2_sample_recorder"
path = "tests/k2_sample_recorder.rs"

# Its own binary: it sends SIGHUP and SIGTERM to its own process, which every
# other test in a shared process would receive too.
[[test]]
name = "managed_launcher_signals"
path = "tests/managed_launcher_signals.rs"

# Its own binary: the `staging channel tests` CI step builds it with the
# near-ai-staging feature. As a module of `it`, that step would build every
# other test file under the feature too.
[[test]]
name = "channel_hosts"
path = "tests/channel_hosts.rs"

# Its own binary: the `staging channel tests` CI step builds it with the
# near-ai-staging feature. As a module of `it`, that step would build every
# other test file under the feature too.
[[test]]
name = "credential_store_isolation"
path = "tests/credential_store_isolation.rs"

# Its own binary: the `staging channel tests` CI step builds it with the
# near-ai-staging feature. As a module of `it`, that step would build every
# other test file under the feature too.
[[test]]
name = "preflight"
path = "tests/preflight.rs"

# Its own binary: the `staging channel tests` CI step builds it with the
# near-ai-staging feature. As a module of `it`, that step would build every
# other test file under the feature too.
[[test]]
name = "version_channel"
path = "tests/version_channel.rs"
