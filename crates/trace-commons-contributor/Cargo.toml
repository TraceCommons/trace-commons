[package]
name = "trace-commons-contributor"
version = "0.21.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# TEST-ONLY. Routes both OS credential stores (device key, account session,
# Cloud credentials) to a plaintext file store inside the config directory,
# and makes `OsSecretBackend::new` refuse. Integration tests link this crate
# without `cfg(test)`, so without it every test that generated a device
# identity wrote a real login-keychain item and left it there. It also
# exposes `ManagedRoute::start_against`, which starts a managed route against
# a local fixture instead of NEAR AI, for `tests/managed_statusline.rs`, the
# native-auth wire primitives for the separate client/server contract suite,
# and `ConfigStore::lower_envelope_limit_for_tests` with
# `envelope::TEST_ENVELOPE_LIMIT_BYTES`, which lower one test state
# directory's envelope limit so `tests/daemon_ipc_contract.rs` need not build
# a 256 MiB session.
#
# Enabled ONLY by test dev-dependencies: the self dependency below and the
# unpublished trace-commons-client-server-tests package. Never enable it for
# `cargo build`/`--release` of a shipped binary.
# `tests/credential_store_isolation.rs` fails if the wiring is lost.
#
# Forwarded to the Insights and platform crates, which now hold the digest-key
# custody and the OS credential store. Under it the platform store refuses to
# open from every build but that crate's own unit tests, so this crate's unit
# tests no longer get the `cfg(test)` exemption they had while the store lived
# here.
# One line, so scripts/ci/check-release-credential-store.sh can permit this
# exact definition.
test-credential-store = ["trace-commons-contributor-insights/test-credential-store", "trace-commons-contributor-platform/test-credential-store"]

# The staging channel (`src/channel.rs`): NEAR AI staging, the staging
# server, staging identity values, and NEAR AI measurement pins taken only
# from the signed staging pin set, whose verifier the attestation crate's
# feature compiles. Never enabled in a release workflow or a shipped
# manifest: scripts/ci/check-release-staging-feature.sh refuses one that
# does. One line, so that script can permit this exact definition.
near-ai-staging = ["trace-commons-attestation/near-ai-staging"]

[dependencies]
trace-commons-protocol = { path = "../trace-commons-protocol", features = ["near-ai-privacy-filter"] }
trace-commons-operator-client = { path = "../trace-commons-operator-client" }
trace-commons-build-info = { path = "../trace-commons-build-info" }
# The session parsers and routing overlay, split out so a daemon edit does
# not recompile them. Re-exported as `source` and `routing`. A workspace crate
# at this crate's version with no dependency this crate lacks, so it adds no
# third-party package.
trace-commons-contributor-sources = { path = "../trace-commons-contributor-sources" }
# Local Insights, split out so a client edit elsewhere does not recompile it,
# and the OS credential store and file primitives it shares with this crate.
# Re-exported as `insights` and at the old `daemon::credential_store`,
# `daemon::os_secret_store`, `config::write_atomic_0600`,
# `evidence_import::open_import_file` and
# `daemon::win_pipe::current_user_sid_string` paths. Workspace crates at this
# crate's version with no dependency this crate lacks, so they add no
# third-party package.
trace-commons-contributor-insights = { path = "../trace-commons-contributor-insights" }
trace-commons-contributor-platform = { path = "../trace-commons-contributor-platform" }
# DCAP quote verification and EIP-191 signer recovery, for the redaction
# witness: this client verifies an enclave's measurement BEFORE handing it a
# raw session, and verifies the certificate it gets back before forwarding it.
#
# Measured cost, `cargo tree -p trace-commons-contributor -e normal`:
# 162 packages before, 227 after. Approved at that figure.
# `receipt` is on because this crate now fetches and carries NEAR AI
# inference receipts to a witness. That feature's own comment used to say a
# contributor client does not enable it "because it makes no inference calls
# and holds no receipts" -- true until the attested-inference path existed,
# false now. It adds NO packages: `k256` and `sha3` are unconditional in that
# crate because EIP-191 recovery also verifies a redaction-witness
# certificate, which this crate already did.
trace-commons-attestation = { path = "../trace-commons-attestation", features = ["receipt"] }
anyhow = "1"
# Promoted from dev-dependencies: the witness transport is a trait object so
# a recording double can assert the verify-then-send ordering. Adds no
# packages -- it was already in this crate's dev graph.
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
# Approved for read-only OpenCode session discovery; already used by IronWire.
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
# OS credential stores approved by the operator on 2026-09-09.
keyring-core = "=1.0.0"
# IronWire's proxy, run in-process behind the private_inference switch.
#
# Measured normal-dependency cost (deduplicated package names): 220 before,
# 303 after, exactly the approved 83 additions (223 upstream, 140 shared).
# This adds axum's HTTP-server path and rusqlite's ledger to the contributor's
# normal graph. Lock entries and target-only packages are separate counts.
# The former 91 figure included a newer IronClaw main resolution, not merely
# changes between IronWire revisions. Licenses remain compatible permissive
# terms; curve25519-dalek and ed25519-dalek specifically use BSD-3-Clause.
#
# Advancing to 90c9ff94 (upstream #29, legacy ownership probes) added no
# package: 577 workspace packages before and after, and this crate's normal
# graph stayed at 303 deduplicated names. Its only lock change was a new edge,
# ironwire_proxy -> rustix 1.1.4 (Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT) under cfg(unix), for a safe effective-UID lookup;
# rustix was already vendored here through tempfile.
#
# Pinned to a revision, not a branch: the embed API is the whole seam this
# crate depends on, it holds credentials, and a moving branch would let an
# upstream change reach a release without anyone choosing it.
#
# ---------------------------------------------------------------------------
# 924f8e3a (upstream #33, #34, #37, #39, #40, #42, #45), reviewed 2026-09-07.
#
# The claim the previous pin made -- "nothing this crate touches changed" -- is
# NOT the claim here, and copying it forward would have been false. Six of the
# seven changes land on the two modules this crate imports, and one of them
# broke the build. What was checked, and how:
#
# COST. `cargo metadata --locked` on both workspaces: 930 packages before and
# after in the root lock, 535 before and after in the GTK lock, and this
# crate's `cargo tree -e normal` still 303 deduplicated names. The entire lock
# delta is the eleven `ironwire_*` source strings plus one new edge,
# ironwire_agents -> sha2 0.10.9 (MIT OR Apache-2.0), for `Planned::digest`.
# sha2 was already a direct dependency of this crate and already in both locks
# and the Flatpak vendor set, so no crate entered the graph and no new license
# entered the audit. `cargo deny check licenses` passes on all four
# configurations (default, near-ai-scorer, local-gpu-models, --all-features).
#
# SURFACE. Every one of this crate's three imports was diffed rev-to-rev
# rather than assumed:
#   * `ironwire_proxy::embed` -- EmbedError, EmbeddedProxy, ExitError and
#     UpdatePolicy are unchanged. StartupReport GAINS `update_checks`; it is a
#     `#[non_exhaustive]`-free struct we only read, so a new field is additive.
#     `start`/`start_with`/`start_with_policy` all still exist and still
#     delegate to the new `start_with_options`, whose `EmbedOptions::default()`
#     is byte-for-byte the old behaviour (HostManaged, FromConfig, All).
#   * `ironwire_agents::tools` -- `Error::Edit(String)` is GONE, split into
#     `Unparseable`, `Jsonc` and `UnusableEntry`. That is the break: it is a
#     hard compile error rather than a silent behaviour change, which is the
#     good case, and `daemon::harness` now matches those variants instead of
#     the front of a sentence. `Planned` gains `digest()`, and `commit` gains
#     `commit_if_unchanged`; both are additive and both are used.
#   * `ironwire_catalog::schema` -- `AgentSetting` gains `style: UrlStyle` and
#     SCHEMA_VERSION goes 1 -> 2. `style` is `#[serde(default)]` and
#     `owned_agents()` is deliberately empty, so this crate constructs no
#     setting and the field cannot be wrong here. `AgentEntry`, `Catalog` and
#     `ConfigLocation` are otherwise unchanged, and the location rules
#     `config_location_is_allowed` restates are unchanged.
#
# BEHAVIOUR, not just types. Two changes alter what happens on a
# contributor's machine with no signature change to catch them:
#   * #33 makes Codex's `connect` REPORT a `model_provider` the contributor
#     chose instead of replacing it, and populates `Planned::occupied` for the
#     codex arm, which was hard-coded empty. The daemon's occupied-slot path
#     and the `HARNESS_SLOT_TAKEN` sentence were previously unreachable for
#     Codex; `harness::tests::codex_reports_a_provider_the_contributor_chose_
#     and_leaves_it_there` now exercises them end to end and asserts the
#     contributor's provider survives the commit.
#   * #40 and #45 make two requests declinable in code that were previously
#     only reachable through `$IRONWIRE_HOME/config.toml`. The workaround that
#     wrote that file is deleted; see `daemon::private_inference::embed_options`
#     for what is chosen and why, and for the `StartupProbes::Configured`
#     rather than `Off` decision.
#
# REACHED. #42 (`ConnectOptions`/`StatusLine`) is used: this daemon plans
# Claude Code edits through `plan_connect_with` and `StatusLine::Decline`,
# because the status line IronWire would install runs `<this executable>
# statusline` with no route home, and this program's `statusline` serves
# only a managed session's route, named by `--home`.
# #37 also renames the control API's `if_unchanged` request field to
# `as_previewed`; that is IronWire's HTTP surface, which nothing in this
# repository calls (checked by grep across crates/, macos/ and windows/), so
# the rename cannot reach us.
#
# Both workspace locks deliberately and temporarily roll IronClaw back to
# reviewed 6dccbfbcbddfdfb53c11d3876f94bf3e716b55f9 (and rig-core/open with
# it). `cargo update -p ironwire_proxy` advances both on either lock and was
# reverted by hand in this update, as in the last one. Upstream still names
# branch=main: use --locked. Re-advance only in a reviewed update that
# measures names/features/licenses, tests embedding and privacy behavior, and
# updates both locks plus Flatpak sources together.
#
# ---------------------------------------------------------------------------
# 4f58f5a1 (upstream #47), reviewed 2026-09-07.
#
# One commit in the range, verified with `git log --oneline 924f8e3a..4f58f5a1`.
# It adds `AgentSetting::requires`: a precondition that lets a catalog entry say
# "write this key only where the file already shows the tool using this
# provider". Nothing in this repository uses it yet, and the honest summary of
# this advance is that it costs nothing and is almost entirely dormant here.
# What made it worth taking now is that `requires` is the only mechanism by
# which a tool whose config uses per-provider blocks can be described at all:
# writing such a key is itself what promotes a provider, so an unconditional
# entry silently changes which model a contributor's tool selects. Without this
# field that class of tool cannot be added safely; with it, it can.
#
# COST. Zero, measured rather than assumed. `cargo metadata --locked` on both
# workspaces: 577 root packages and 930 root lock entries before and after, 535
# GTK packages and 535 GTK lock entries before and after, and this crate's
# `cargo tree -e normal` still 303 deduplicated names. The entire delta in both
# locks is the eleven `ironwire_*` source strings -- 22 changed lines each, all
# of them the rev. Unlike the previous advance, which pulled in a sha2 edge, no
# package entered the graph and no edge was added: upstream changed no
# `Cargo.toml` and no `Cargo.lock` in the range. `cargo deny check licenses`
# passes on all four configurations (default, near-ai-scorer, local-gpu-models,
# --all-features), necessarily, since no crate entered the audit.
#
# SURFACE. Each of this crate's three imports diffed rev-to-rev:
#   * `ironwire_proxy::embed` -- not one byte moved;
#     `git diff --stat 924f8e3a..4f58f5a1 -- crates/ironwire_proxy` is empty.
#     #47's `src/commands/connect.rs` hunk is the upstream CLI binary's own
#     `connect` command printing the new skipped rows, not the embed module.
#   * `ironwire_agents::tools` -- `Error` is UNCHANGED. That was this advance's
#     compile-break risk and it did not fire: the enum is not
#     `#[non_exhaustive]`, so a new variant would have broken the matches in
#     `daemon::harness`, and there is none. `Planned` gains a public `skipped`
#     field; `Planned` still has private fields, so no downstream struct literal
#     exists to break, and we only ever read one.
#   * `ironwire_catalog::schema` -- `AgentSetting` gains
#     `requires: Option<String>`, `#[serde(default)]`. Note that `AgentSetting`
#     is NOT `#[non_exhaustive]`: this IS a struct-literal break for anyone who
#     constructs one, and upstream had to patch six of its own literals. It is
#     not a break for us, and the reason is checked rather than remembered --
#     `owned_agents()` is `Vec::new()`, we construct no setting and no entry,
#     and the type is not even in scope in `daemon::harness`, whose import line
#     names only `AgentEntry`, `Catalog` and `ConfigLocation`. `AgentEntry`,
#     `Catalog` and `ConfigLocation` are otherwise unchanged, and the location
#     rules `config_location_is_allowed` restates did not move.
#
# SCHEMA_VERSION 2 -> 3, and this is the number that looks alarming and is not.
# The gate that reads it is `catalog.schema_version > SCHEMA_VERSION` in
# `ironwire_catalog::store` -- strictly greater-than -- so a build at 3 still
# accepts a document declaring 1 or 2. Nothing is stranded and no re-issue is
# forced. The bump exists to protect an OLD build from a NEW document, because
# a build predating `requires` would tolerate the unknown field, ignore the
# condition and write the key unconditionally, which is precisely the edit the
# field exists to prevent. Advancing the pin is therefore the safe direction of
# this bump; the dangerous direction belongs to contributors still on an older
# release, and it is a publishing decision, not one this pin makes.
#
# BEHAVIOUR, not just types. Three changes alter what happens on a
# contributor's machine with no signature change to catch them:
#   * `requires` is a PRESENCE check and nothing more -- the key exists,
#     whatever its value -- evaluated against the tool's own config file as
#     found, cloned before any edit, so one setting cannot satisfy a later
#     one's precondition and an entry does not depend on the order of its own
#     settings. `None`, which is what every entry written before #47 means,
#     short-circuits to "write it", so the default is a strict no-op. An
#     unsatisfied precondition SKIPS the write silently and raises no error,
#     reporting through `Planned::skipped`; a caller that does not read that
#     field will believe it wrote something it did not.
#   * `plan_disconnect` is deliberately NOT gated -- all three arms push an
#     empty `skipped`. Removal stays unconditional, which is what our "remove
#     only what we put there" rule needs: a condition that held when we wrote a
#     value may not hold when we remove it, and filtering there would strand
#     our value in exactly the case where stranding it does most damage.
#   * `catalog::is_wired` no longer answers vacuously true for the empty set.
#     Both arms gained an `!applicable.is_empty() &&` guard, so an entry with
#     no settings, or whose settings are all gated off, now reports NOT wired
#     where it previously reported wired. This one has nothing to do with
#     `requires` and is the easiest change in the commit to miss.
#
# NOT REACHED. All of the above is dormant here, checked and not inferred. Our
# compiled-in catalog is empty (`owned_agents()` is `Vec::new()`, and
# `catalog_present_follows_our_own_table` ties the wire field to that), so the
# loops that call the precondition never run, `Planned::skipped` is always
# empty on this daemon, and the `is_wired` empty-set change is unreachable --
# the Claude and Codex arms use `claude_settings::is_wired` and
# `codex_config::is_wired`, neither of which this commit touches. We load no
# signed catalog document at all: there is no `CatalogStore` in this crate, and
# the embedded proxy's own refresh is off, asserted by
# `the_daemon_declines_both_kinds_of_request_it_never_asked_for`. The single
# reachable consequence of this advance is that the in-memory
# `Catalog::default().schema_version` moves 2 -> 3, which nothing here reads.
#
# FLATPAK. `cargo-sources.json` was REGENERATED with flatpak-cargo-generator.py
# against the new GTK lock, not hand-edited, and the diff is why that matters:
# thirteen entries move, not the two that contain the full revision. Eleven are
# `shell` entries keyed on the SHORT hash (`flatpak-cargo/git/ironwire-924f8e3`
# -> `-4f58f5a`). Editing only the occurrences of the 40-character rev would
# leave eleven vendor paths pointing at a directory the build no longer creates,
# and nothing in PR CI would catch it -- the first failure would be the
# `linux-flatpak` job on an `app-v*` tag. The other 1060 entries are
# byte-identical, so there is no unrelated checksum churn in this update.
#
# The IronClaw note in the section above still applies: both locks continue to
# hold the reviewed IronClaw revision, upstream still names branch=main, and
# `cargo update -p ironwire_proxy` would advance it. This update did not need
# that command -- re-resolving the changed rev alone was enough -- and the lock
# diff was checked for non-ironwire movement, of which there was none.
#
# ---------------------------------------------------------------------------
# 6c5d6289 (upstream #50, #51), reviewed 2026-09-08.
#
# Two commits in the range, verified with `git log --oneline 4f58f5a1..6c5d6289`.
# #49 (tolerant JSONC read) had NOT landed at this pin -- it is still the
# unmerged branch `read-jsonc-tolerantly` upstream -- so it is not in this
# advance and a later one will have to review it.
#
# The range touches exactly three files upstream, and only one of them is code
# this crate links: `crates/ironwire_proxy/src/embed.rs`, its tests, and
# `docs/EMBEDDING.md`. `git diff --stat 4f58f5a1..6c5d6289 -- crates/ironwire_agents`
# and the same for `crates/ironwire_catalog` are both EMPTY, so two of this
# crate's three imports did not move at all and are not discussed further.
#
# The second commit is ours. #50 broke the embedding path, we found it here
# rather than upstream, and #51 is the one-line fix; see THE BREAK below.
#
# COST. Zero, measured on both workspaces before and after rather than assumed.
# `cargo metadata --locked`: 577 root packages and 930 root lock entries before
# and after, 535 GTK packages and 535 GTK lock entries before and after, and
# this crate's `cargo tree -e normal` still 303 deduplicated names. Upstream
# changed no `Cargo.toml` and no `Cargo.lock` in the range, so no package
# entered either graph and no license entered the audit. `cargo deny check
# licenses` passes on all four configurations (default, near-ai-scorer,
# local-gpu-models, --all-features).
#
# SURFACE. `ironwire_proxy::embed` is the only import that moved:
#   * `EmbedOptions` LOSES `Copy`, `PartialEq` and `Eq`, and its derived
#     `Debug` becomes a hand-written one that renders the new field as
#     "host-owned" or "discovered" and never a secret. The lost traits are the
#     advance's compile-break risk and they did not fire, for a reason that is
#     checked and not remembered: `embed_options()` builds a value and returns
#     it, and every assertion in `the_daemon_declines_both_kinds_of_request_it_
#     never_asked_for` compares a FIELD -- `update_checks`, `startup_probes`,
#     `update_policy` -- each of whose enums keeps `PartialEq`. Nothing here
#     compares or copies an `EmbedOptions` whole. `Clone` and `Default` remain,
#     which is all the builder form needs.
#   * `EmbedOptions` GAINS `credentials: Option<CredentialSource>` and a
#     `with_credentials` builder, plus the public `CredentialSource` alias and
#     a `HostSecret` re-export of `secrecy::SecretString`. All additive.
#   * `build_registry` takes a new `Credentials<'a>`, and `EnvLookup` now
#     yields `SecretString` rather than `String`. Neither reaches us: both are
#     PRIVATE to that module (`enum Credentials`, `type EnvLookup`, no `pub`),
#     and this crate calls `start_with_options`, never the registry builder.
#     `start`/`start_with`/`start_with_policy` all still exist.
#
# THE BREAK, and why a downstream repository was the only thing that could see
# it. #50 wrote `EnvLookup` as a bare `dyn Fn` with no `Send + Sync`.
# `Credentials::Discovered` wraps that alias and `start_with_options` holds a
# `Credentials` across an await, so the returned future stopped being `Send`
# and could no longer be `tokio::spawn`ed -- which is exactly what
# `daemon::private_inference` does at the `runtime.spawn` in `poll`. It failed
# as E0277 here while upstream CI stayed green, because upstream's own CLI
# (`src/commands/serve.rs`) and every test in #50 `.await` the start directly
# and so never demand `Send` of it. Note which path broke: the PUBLIC
# `CredentialSource` was correctly `Send + Sync` from the start, and it was the
# private discovered path -- the default, what a host that configures nothing
# gets -- that did not compile. #51 adds the bound. An embedder is the only
# thing that exercises this, so if a future advance ever fails this way again,
# the fix belongs upstream and not in a contortion of `poll`.
#
# HOST-OWNED CREDENTIALS ARE DORMANT HERE BY CHOICE, not by oversight, and the
# choice is the substance of this advance. #50 exists so an embedding host can
# supply every backend credential itself instead of leaking one through the
# process environment, which is a real improvement and one we should eventually
# take. We do NOT take it yet, because this daemon has no credential
# acquisition flow: there is nothing to answer `NEARAI_API_KEY` with. Supplying
# a source that answers nothing is NOT equivalent to supplying none --
# `Credentials` is one switch governing two things, whose answers count AND
# whether the credential files Claude Code and Codex write may be read at all
# (`discovers_files`). Adopting it today would therefore silently drop the
# Claude and Codex subscription backends for every contributor who has one.
#
# And the failure would not announce itself. It would NOT be
# `NoRoute::NoBackendsConfigured`: the NEAR AI backend is pushed
# UNCONDITIONALLY, registered whether or not a key was found, so the registry
# is never empty and `StartupReport::no_backends` never fires. The daemon would
# keep reporting `running` while quietly answering from fewer backends than the
# contributor has. That is a worse failure than a refusal, and it is the reason
# this stays on the discovered path until there is a flow to feed it.
#
# FLATPAK. `cargo-sources.json` was REGENERATED with flatpak-cargo-generator.py
# against the new GTK lock, not hand-edited, and this advance is a clean
# demonstration of why that rule exists. Thirteen entries move; TWO of them
# contain the 40-character revision (the git source's `commit`, and the
# vendored-sources `contents` string). The other TWELVE key on the SHORT hash
# -- one `dest` and eleven `cp --reflink` vendor lines, `flatpak-cargo/git/
# ironwire-4f58f5a` -> `-6c5d628`. Editing the occurrences of the full rev
# would leave twelve vendor paths pointing at a directory the build no longer
# creates, and nothing in PR CI would catch it: the first failure would be the
# `linux-flatpak` job on an `app-v*` tag. The file holds 1073 entries before
# and after and 1060 are byte-identical, so there is no unrelated churn.
#
# The IronClaw note above still applies and was re-checked rather than assumed:
# both locks still name 6dccbfbcbddfdfb53c11d3876f94bf3e716b55f9, upstream
# still names branch=main, and `cargo update -p ironwire_proxy` would advance
# it. This update did not need that command -- re-resolving the changed rev
# through `cargo metadata` alone was enough -- and the changed lines of both
# lock diffs were grepped for non-ironwire movement, of which there were zero.
#
# ---------------------------------------------------------------------------
# 06118ebd (upstream #49, #53, #54), reviewed 2026-09-08.
#
# Three commits in the range, verified with
# `git log --oneline 6c5d6289..06118ebd`. All three are ours, and two of them
# fix defects this repository is the only thing that could have found. Unlike
# the last two advances this one is NOT dormant: it changes what
# `embed_options` passes, and the reason is the substance of the update.
#
# The previous section closed by saying #49 "is still the unmerged branch
# `read-jsonc-tolerantly` upstream -- so it is not in this advance and a later
# one will have to review it". This is that later one; it is reviewed below.
#
# COST. Zero, measured on both workspaces before and after rather than assumed.
# `cargo metadata --locked`: 577 root packages and 930 root lock entries before
# and after, 535 GTK packages and 535 GTK lock entries before and after, and
# this crate's `cargo tree -e normal` still 303 deduplicated names. Upstream
# changed no `Cargo.toml` and no `Cargo.lock` in the range --
# `git diff --stat 6c5d6289..06118ebd -- Cargo.toml Cargo.lock '*/Cargo.toml'`
# is empty -- so no package entered either graph and no license entered the
# audit. `cargo deny check licenses` passes on all four configurations
# (default, near-ai-scorer, local-gpu-models, --all-features).
#
# SURFACE. Each of this crate's three imports diffed rev-to-rev:
#   * `ironwire_catalog::schema` -- not one byte moved;
#     `git diff --stat 6c5d6289..06118ebd -- crates/ironwire_catalog` is empty.
#   * `ironwire_agents` -- #49 rewrites 164 lines of `src/catalog.rs` and
#     changes NO public item: `git diff 6c5d6289..06118ebd --
#     crates/ironwire_agents/src/catalog.rs` has zero `pub` lines on either
#     side. `Error` is unchanged, so the matches in `daemon::harness` are not
#     at risk. The change is internal: `is_wired` reads through a new
#     `json_parse_tolerant`, while `json_connect` and `json_disconnect` keep
#     the strict `json_parse`. See BEHAVIOUR for why that asymmetry is right.
#   * `ironwire_proxy::embed` -- `EmbedOptions` GAINS a public
#     `credential_files: CredentialFiles` field and a `with_credential_files`
#     builder; the new `CredentialFiles` enum is `#[non_exhaustive]` and
#     derives `Clone, Copy, Debug, Default, PartialEq, Eq`. Everything else we
