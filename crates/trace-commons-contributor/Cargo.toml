[package]
name = "trace-commons-contributor"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
trace-commons-protocol = { path = "../trace-commons-protocol", features = ["near-ai-privacy-filter"] }
trace-commons-operator-client = { path = "../trace-commons-operator-client" }
trace-commons-build-info = { path = "../trace-commons-build-info" }
# DCAP quote verification and EIP-191 signer recovery, for the redaction
# witness: this client verifies an enclave's measurement BEFORE handing it a
# raw session, and verifies the certificate it gets back before forwarding it.
#
# Measured cost, `cargo tree -p trace-commons-contributor -e normal`:
# 162 packages before, 227 after. Approved at that figure.
# `receipt` is on because this crate now fetches and carries NEAR AI
# inference receipts to a witness. That feature's own comment used to say a
# contributor client does not enable it "because it makes no inference calls
# and holds no receipts" -- true until the attested-inference path existed,
# false now. It adds NO packages: `k256` and `sha3` are unconditional in that
# crate because EIP-191 recovery also verifies a redaction-witness
# certificate, which this crate already did.
trace-commons-attestation = { path = "../trace-commons-attestation", features = ["receipt"] }
anyhow = "1"
# Promoted from dev-dependencies: the witness transport is a trait object so
# a recording double can assert the verify-then-send ordering. Adds no
# packages -- it was already in this crate's dev graph.
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
# IronWire's proxy, run in-process behind the private_inference switch.
#
# Measured normal-dependency cost (deduplicated package names): 220 before,
# 303 after, exactly the approved 83 additions (223 upstream, 140 shared).
# This adds axum's HTTP-server path and rusqlite's ledger to the contributor's
# normal graph. Lock entries and target-only packages are separate counts.
# The former 91 figure included a newer IronClaw main resolution, not merely
# changes between IronWire revisions. Licenses remain compatible permissive
# terms; curve25519-dalek and ed25519-dalek specifically use BSD-3-Clause.
#
# Advancing to 90c9ff94 (upstream #29, legacy ownership probes) added no
# package: 577 workspace packages before and after, and this crate's normal
# graph stayed at 303 deduplicated names. Its only lock change was a new edge,
# ironwire_proxy -> rustix 1.1.4 (Apache-2.0 WITH LLVM-exception OR
# Apache-2.0 OR MIT) under cfg(unix), for a safe effective-UID lookup;
# rustix was already vendored here through tempfile.
#
# Pinned to a revision, not a branch: the embed API is the whole seam this
# crate depends on, it holds credentials, and a moving branch would let an
# upstream change reach a release without anyone choosing it.
#
# ---------------------------------------------------------------------------
# 924f8e3a (upstream #33, #34, #37, #39, #40, #42, #45), reviewed 2026-09-07.
#
# The claim the previous pin made -- "nothing this crate touches changed" -- is
# NOT the claim here, and copying it forward would have been false. Six of the
# seven changes land on the two modules this crate imports, and one of them
# broke the build. What was checked, and how:
#
# COST. `cargo metadata --locked` on both workspaces: 930 packages before and
# after in the root lock, 535 before and after in the GTK lock, and this
# crate's `cargo tree -e normal` still 303 deduplicated names. The entire lock
# delta is the eleven `ironwire_*` source strings plus one new edge,
# ironwire_agents -> sha2 0.10.9 (MIT OR Apache-2.0), for `Planned::digest`.
# sha2 was already a direct dependency of this crate and already in both locks
# and the Flatpak vendor set, so no crate entered the graph and no new license
# entered the audit. `cargo deny check licenses` passes on all four
# configurations (default, near-ai-scorer, local-gpu-models, --all-features).
#
# SURFACE. Every one of this crate's three imports was diffed rev-to-rev
# rather than assumed:
#   * `ironwire_proxy::embed` -- EmbedError, EmbeddedProxy, ExitError and
#     UpdatePolicy are unchanged. StartupReport GAINS `update_checks`; it is a
#     `#[non_exhaustive]`-free struct we only read, so a new field is additive.
#     `start`/`start_with`/`start_with_policy` all still exist and still
#     delegate to the new `start_with_options`, whose `EmbedOptions::default()`
#     is byte-for-byte the old behaviour (HostManaged, FromConfig, All).
#   * `ironwire_agents::tools` -- `Error::Edit(String)` is GONE, split into
#     `Unparseable`, `Jsonc` and `UnusableEntry`. That is the break: it is a
#     hard compile error rather than a silent behaviour change, which is the
#     good case, and `daemon::harness` now matches those variants instead of
#     the front of a sentence. `Planned` gains `digest()`, and `commit` gains
#     `commit_if_unchanged`; both are additive and both are used.
#   * `ironwire_catalog::schema` -- `AgentSetting` gains `style: UrlStyle` and
#     SCHEMA_VERSION goes 1 -> 2. `style` is `#[serde(default)]` and
#     `owned_agents()` is deliberately empty, so this crate constructs no
#     setting and the field cannot be wrong here. `AgentEntry`, `Catalog` and
#     `ConfigLocation` are otherwise unchanged, and the location rules
#     `config_location_is_allowed` restates are unchanged.
#
# BEHAVIOUR, not just types. Two changes alter what happens on a
# contributor's machine with no signature change to catch them:
#   * #33 makes Codex's `connect` REPORT a `model_provider` the contributor
#     chose instead of replacing it, and populates `Planned::occupied` for the
#     codex arm, which was hard-coded empty. The daemon's occupied-slot path
#     and the `HARNESS_SLOT_TAKEN` sentence were previously unreachable for
#     Codex; `harness::tests::codex_reports_a_provider_the_contributor_chose_
#     and_leaves_it_there` now exercises them end to end and asserts the
#     contributor's provider survives the commit.
#   * #40 and #45 make two requests declinable in code that were previously
#     only reachable through `$IRONWIRE_HOME/config.toml`. The workaround that
#     wrote that file is deleted; see `daemon::private_inference::embed_options`
#     for what is chosen and why, and for the `StartupProbes::Configured`
#     rather than `Off` decision.
#
# NOT REACHED. #42 (`ConnectOptions`/`StatusLine`) is available and left at
# `StatusLine::Offer`: this daemon plans Claude Code edits through
# `plan_connect`, and the status line it installs names the `ironwire` binary,
# not ours -- revisit if this crate ever becomes the executable in that slot.
# #37 also renames the control API's `if_unchanged` request field to
# `as_previewed`; that is IronWire's HTTP surface, which nothing in this
# repository calls (checked by grep across crates/, macos/ and windows/), so
# the rename cannot reach us.
#
# Both workspace locks deliberately and temporarily roll IronClaw back to
# reviewed 6dccbfbcbddfdfb53c11d3876f94bf3e716b55f9 (and rig-core/open with
# it). `cargo update -p ironwire_proxy` advances both on either lock and was
# reverted by hand in this update, as in the last one. Upstream still names
# branch=main: use --locked. Re-advance only in a reviewed update that
# measures names/features/licenses, tests embedding and privacy behavior, and
# updates both locks plus Flatpak sources together.
ironwire_proxy = { git = "https://github.com/nearai/ironwire", rev = "924f8e3a02ce5fb18e4ee2759cd0bb49fec318b1" }
# The same IronWire revision, two more of its crates, promoted from
# transitive to direct. `ironwire_agents` is the crate whose entire purpose is
# "which coding tools does this machine have, are they pointed at us, and how
# would we point one at us without taking its config file over"; and
# `ironwire_catalog` carries the `Catalog` type its API takes.
#
# BOTH ARE ALREADY IN THIS CRATE'S GRAPH -- `ironwire_proxy` depends on each
# of them at this same pinned revision -- so naming them here adds no package,
# no lock entry and no license to audit. Measured: `cargo tree -p
# trace-commons-contributor -e normal` is unchanged. What it buys is that this
# crate does not reimplement, in a second place, the three config-editing
# rules (never rewrite a file we cannot parse; fill an empty slot but report a
# full one; remove only what we put there) that crate exists to hold.
ironwire_agents = { git = "https://github.com/nearai/ironwire", rev = "924f8e3a02ce5fb18e4ee2759cd0bb49fec318b1" }
ironwire_catalog = { git = "https://github.com/nearai/ironwire", rev = "924f8e3a02ce5fb18e4ee2759cd0bb49fec318b1" }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# A direct dependency, not dev-only: the Antigravity import command (staged
# after this task) writes files to a scratch directory before upload, the
# same way the file-reading source it replaces used to.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "net", "sync", "signal", "process"] }
tracing = "0.1"
# Reads the Antigravity language server's command line to find its CSRF
# token. Pinned to 0.36 to match the version already in this workspace's
# lockfile via mistralrs-core, so it adds no package. (It was also once held
# here because 0.39.x needs Rust 1.95 and the floor was 1.92; the floor is
# 1.96 now, so only the lockfile-match reason still holds. Moving it is a
# dependency change and wants its own review.)
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# Direct rather than reached through trace-commons-operator-client, because
# the witness transport parses a URL to run it past the same HostAllowlist
# `issuer_url` and `ingest_url` pass. Adds no packages -- it is already in
# this crate's graph through that client.
url = "2"

# Windows only. The daemon's transport there is a named pipe in the
# machine-wide namespace, whose DACL is the sole access control on it (the
# unix build relies on its 0700 state directory instead, and needs none of
# this). Building that descriptor requires Win32 directly: tokio exposes only
# `create_with_security_attributes_raw`, which takes a raw pointer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
axum = "0.8"
# Signing test certificates, so the certificate-verification tests exercise
# real secp256k1/EIP-191 rather than a fixture nobody can regenerate. Both are
# already in this crate's graph through trace-commons-attestation, so they add
# no packages.
k256 = "0.13"
sha3 = "0.10"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["net"] }

# Not on Windows: trace-commons-server's dependency chain reaches openssl-sys
# via webauthn-rs -> webauthn-rs-core -> webauthn-attestation-ca -> openssl.
# The CI Windows runner has OpenSSL headers but not the link libraries, so
# `cargo test` (which builds dev-deps) panics there with "OpenSSL libdir ...
# does not contain the required files to either statically or dynamically
# link OpenSSL". This crate's own code never needs trace-commons-server; only
# three cross-check tests in account_auth.rs and the e2e_enroll_and_submit
# integration test use it, and both are gated `#[cfg(not(windows))]` /
# `#![cfg(not(windows))]` to match. Do not move this back into unconditional
# [dev-dependencies] without first fixing the openssl-sys link on Windows.
[target.'cfg(not(windows))'.dev-dependencies]
trace-commons-server = { path = "../trace-commons-server" }

[[example]]
name = "compute-package"
test = true
