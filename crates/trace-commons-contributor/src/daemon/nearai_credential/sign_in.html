<title>NEAR AI · Sign in</title>
<style>
:root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f2f2f4; background: #101119; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 32px 20px; background: radial-gradient(ellipse at 50% 0%, #0091fd14, transparent 65%); }
main { width: 100%; min-width: 0; max-width: 480px; }
.brand { display: block; width: 146px; height: auto; fill: currentColor; margin: 0 auto 40px; }
.card { padding: 40px; border-radius: 24px; background: #1b1d29; box-shadow: 0 24px 80px #00000026; text-align: center; }
.symbol { width: 56px; height: 56px; margin: 0 auto 24px; display: grid; place-items: center; border-radius: 50%; background: #0091fd18; color: #56b6ff; }
.spinner { width: 24px; height: 24px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: turn 1s linear infinite; }
.done, .error { display: none; width: 28px; height: 28px; }
[data-state="success"] .spinner, [data-state="error"] .spinner { display: none; }
[data-state="success"] .done, [data-state="error"] .error { display: block; }
[data-state="success"] .symbol { background: #60c76a18; color: #70d67a; }
[data-state="error"] .symbol { background: #f3ba5718; color: #f5c66e; }
h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.025em; font-weight: 650; margin: 0 0 16px; }
p { font-size: 16px; line-height: 1.6; color: #c4c6d1; margin: 0; }
.next { margin-top: 24px; font-size: 14px; color: #a5a8b8; }
noscript p { margin-top: 24px; }
@keyframes turn { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
@media (prefers-color-scheme: light) {
  :root { color: #191b25; background: #f5f6fa; }
  .card { background: #fff; box-shadow: 0 20px 64px #1825410c; }
  p { color: #555a6b; } .next { color: #656b7b; }
  .symbol { color: #0074cc; } [data-state="success"] .symbol { color: #237d36; } [data-state="error"] .symbol { color: #986000; }
}
@media (max-width: 400px) { .card { padding: 32px 24px; } h1 { font-size: 24px; } }
</style>
</head>

<h1 id="heading">Finishing sign-in</h1>
<p id="message">Connecting your NEAR AI account to __APP_NAME__ on this computer.</p>

<script>
var card = document.querySelector(".card");
var heading = document.getElementById("heading");
var message = document.getElementById("message");
var next = document.getElementById("next");
function complete(ok) {
  card.dataset.state = ok ? "success" : "error";
  heading.textContent = ok ? "You're signed in" : "Sign-in couldn't finish";
  message.textContent = ok
    ? "Your NEAR AI account is connected. Return to __APP_NAME__ to continue."
    : "Return to __APP_NAME__ and start sign-in again.";
  next.textContent = "You can close this tab.";
}
var h = location.hash.slice(1);
location.hash = "";
var u = encodeURIComponent(navigator.userAgent);
fetch("__DEPOSIT_PATH__", { method: "POST", body: "state=__STATE__&ua=" + u + "&" + h })
  .then(function (r) { complete(r.ok); })
  .catch(function () { complete(false); });
</script>
