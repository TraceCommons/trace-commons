[package]
name = "trace-commons-client-server-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Test-only client/server contracts, kept out of client build graphs"
autotests = false

[[test]]
name = "contracts"
path = "tests/contracts/main.rs"

# These suites were non-Windows before extraction and stay so. All
# dependencies are test-only; this package ships no library or binary.
[target.'cfg(not(windows))'.dev-dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
k256 = "0.13"
ring = "0.17"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
trace-commons-contributor = { path = "../trace-commons-contributor", features = ["test-credential-store"] }
trace-commons-protocol = { path = "../trace-commons-protocol" }
trace-commons-server = { path = "../trace-commons-server" }
uuid = { version = "1", features = ["v4", "serde"] }
