[package]
name = "tracedao-gate-enclave"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Optional inference stack — enabled by the `local-gpu-models` feature.
# Pulled in only when the gate-service binary is built for a GPU host with
# a staged base model. Hermetic CI builds (default features) do not see
# these deps.
#
# A2.3 dropped the direct candle git pins; mistralrs brings candle 0.10.2
# (crates.io) transitively. mistralrs is git-pinned to master SHA
# 2d4ba4f16f61e5e18be085d0dd137bc95cba038a (2026-04-15); Slice 0 PoC
# validated raw-logits perplexity on Lambda A100 against this SHA.
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git", rev = "2d4ba4f16f61e5e18be085d0dd137bc95cba038a", optional = true, default-features = false }
tokenizers = { version = "0.21.4", optional = true, default-features = false, features = ["onig"] }
hf-hub = { version = "0.4.3", optional = true }
# Used by mistralrs's tokenize API (`Either::Right(text)`).
either = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
# Phase A4: usearch HNSW vector index + lru-bounded per-tenant handle cache.
usearch = { version = "2.25.2", optional = true }
lru = { version = "0.18.0", optional = true }

# Optional fastembed stack — enabled by the `local-gpu-models` feature
# (shared with the candle perplexity scorer). Pulls in ONNX Runtime via
# `ort` for sentence-embedding inference. Default model is
# BAAI/bge-large-en-v1.5.
fastembed = { version = "5.13.4", optional = true }
# tokio is used by `FastEmbedTextEmbedder::try_new` to spawn the blocking
# ONNX model load off the async executor. The dev-dependency entry below
# keeps integration tests working without enabling the feature.
tokio = { version = "1", optional = true, features = ["rt"] }

# Optional NEAR AI Cloud scorer stack — enabled by the `near-ai-scorer`
# feature. Pulls in reqwest for the OpenAI-compatible HTTP client. Reuses
# the optional serde / serde_json / tokio entries above. Independent of
# `local-gpu-models`: a host can compile the NEAR AI scorer without the
# mistralrs/candle/CUDA stack.
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls-native-roots"] }

[features]
default = []
# Compile the candle-backed `CandlePerplexityScorer`. Off by default; turning
# this on pulls in the candle + tokenizers + hf-hub dependency stack. Use the
# `local-gpu-models-cuda` add-on feature to compile with CUDA support on hosts
# that have a CUDA toolchain installed. Without it, the build still compiles
# cleanly but CUDA forward passes are unavailable at runtime.
local-gpu-models = [
    "dep:mistralrs",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:either",
    "dep:serde",
    "dep:serde_json",
    "dep:fastembed",
    "dep:tokio",
    "dep:usearch",
    "dep:lru",
]
local-gpu-models-cuda = [
    "local-gpu-models",
    "mistralrs/cuda",
]
# Compile the NEAR AI Cloud-backed `NearAiPerplexityScorer`. Off by default;
# turning this on pulls in reqwest + a current-thread tokio runtime. Independent
# of `local-gpu-models` — a TEE-hosted scoring deployment compiles this without
# the CUDA stack.
near-ai-scorer = [
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
]

[dev-dependencies]
# Only used by the `#[ignore]`d candle integration test under the
# `local-gpu-models` feature. Default-feature builds don't pull tokio.
tokio = { version = "1", features = ["rt", "macros"] }
# Used by the `UsearchVectorIndex` unit tests (under `local-gpu-models`) to
# provision a real on-disk root directory per test.
tempfile = "3"
