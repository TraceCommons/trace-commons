# Log rotation for the pilot host's service logs.
#
# Install on tc-pilot-host as /etc/logrotate.d/tracecommons:
#   sudo install -o root -g root -m 0644 \
#     deploy/pilot-gcp/logrotate-tracecommons.conf /etc/logrotate.d/tracecommons
#   sudo logrotate --debug /etc/logrotate.d/tracecommons   # dry run, no changes
#
# Why this is needed: the systemd units send application output to files rather
# than the journal --
#   StandardOutput=append:/var/log/tracecommons/ingest.log
#   StandardError=append:/var/log/tracecommons/ingest.err
# -- and nothing rotated them. By 2026-08-18 ingest.log had reached ~174MB with
# no rotation since 2026-05-19, on a host with no headroom to spare.
#
# `copytruncate` is deliberate. systemd's `append:` holds an open file
# descriptor at a fixed offset; renaming the file out from under it would leave
# the service writing into an unlinked inode, and its logs would vanish until
# the next restart. Truncating in place keeps the same descriptor valid. The
# cost is a small race window where lines written during the copy can be lost,
# which is the right trade for operational logs.
/var/log/tracecommons/*.log
/var/log/tracecommons/*.err
{
    daily
    rotate 14
    size 64M
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    su root root
    create 0640 root root
}
