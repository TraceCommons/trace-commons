# The redaction witness, as a dstack application.
#
# THIS FILE IS MEASURED. dstack hashes app-compose.json -- which embeds this
# file verbatim -- into MRCONFIGID. Every value below, including the redaction
# mode and the body bound, is therefore part of the enclave's identity: an
# operator cannot change one without changing the measurement, and a client
# pinning the measurement will refuse the changed deployment until it is
# re-allowlisted. That is the intended property, not a side effect.
#
# After editing, regenerate app-compose.json:
#
#     ./build-app-compose.sh
#
# A change here that is not carried into app-compose.json deploys the OLD
# configuration. The script is how the two are kept from drifting.

services:
  # TLS terminates inside this CVM. Cloudflare provides DNS only.
  # tls-alpn-01 renews without a DNS API credential in the guest.
  ingress:
    image: ghcr.io/dstack-tee/dstack-ingress:2.8@sha256:60e682449534715a2f2e5b72326ca4229209c8e26c931c6f34d27e02200ac086
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      CHALLENGE_TYPE: "tls-alpn-01"
      DOMAIN: "witness.tracecommons.ai"
      TARGET_ENDPOINT: "witness:8088"
      GATEWAY_DOMAIN: "gateway.dstack-pha-prod9.phala.network"
      DNS_SETUP_MODE: "wait"
      SET_CAA: "false" # Operator creates the printed account-bound CAA.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /var/run/tappd.sock:/var/run/tappd.sock
      - witness-cert-data:/etc/letsencrypt
      - witness-tls-evidences:/evidences

  witness:
    # By digest, never a tag: a tag is a moving target and a measurement
    # pinned over one is pinning nothing.
    #
    # Built by the `witness-image` workflow from commit 631c77b -- natively
    # amd64, because TDX is Intel, and in CI rather than on a developer
    # machine because this image is not reproducibly buildable. A measurement
    # therefore pins a specific artifact only its builder can produce, which
    # makes who built it part of what an auditor is trusting; a public run log
    # answers that better than a laptop.
    #
    # Replacing this means rebuilding and re-pinning the measurement
    # everywhere it is named -- in ingest and in every client.
    image: ghcr.io/tracecommons/trace-commons-witness@sha256:df907f04b4ae87edd4feb1dcb718d16679e6d55b9af727ee6eb112b4e4246340

    # A restart re-derives the same signing key: dstack's KMS derives the app
    # key from the app id, which does not move. So a restart is invisible to a
    # client that has pinned the signing address. Jobs in progress are lost on
    # a restart (the client resubmits); finished results survive it, sealed
    # on the volume below.
    restart: always

    # The root filesystem stays read-only: a writable one would be a place for
    # a raw transcript to land. The only writable place is the results volume,
    # and only sealed results go there -- raw sessions are held in memory.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # The guest agent's unix socket. This is the only mount, and it is what
    # GetKey and GetQuote are reached through. It is not network-reachable;
    # the witness proxies GetQuote on /v1/attestation precisely because a
    # contributor cannot call it directly.
    #
    # `witness-results` holds finished job results, AES-256-GCM sealed under a
    # key derived from GetKey and this image's measurement, so another image
    # cannot open them. Each is deleted on its first fetch or after 24 hours.
    # The volume lives on the CVM's encrypted data disk.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - witness-results:/var/lib/trace-commons-witness/results

    environment:
      # 0.0.0.0, not the binary's 127.0.0.1 default. The default is correct for
      # a host where something else terminates TLS in the same netns; inside a
      # container it makes the witness unreachable from dstack-gateway, and the
      # symptom is a healthy-looking process that no request ever arrives at.
      TRACE_COMMONS_WITNESS_BIND: "0.0.0.0:8088"

      # `deterministic-only` or `full-pipeline`, and the binary refuses to start
      # if it is neither -- there is no default in either direction.
      #
      # This deployment runs `full-pipeline`: the deterministic pass, then the
      # prose-PII classifier over its output, which is the same two stages in
      # the same order that ingest applies. A `deterministic-only` certificate
      # carries the deterministic policy alias, and the server's policy
      # allowlist is what keeps such a certificate from admitting a trace no
      # classifier ever read -- so the mode here decides whether these
      # certificates can lift the PII backstop hold at all.
      TRACE_COMMONS_WITNESS_REDACTION: "full-pipeline"

      # Receipt signing-key pins, per model. DELIBERATELY UNSET HERE.
      #
      # This replaces TRACE_COMMONS_WITNESS_GATEWAY_KEY_PIN, which this file
      # set on 2026-09-06 to the gateway's ed25519 key. A live run that same
      # day established that hosted-model receipts are not signed by the
      # gateway key at all: they carry `signature_kind: provider_tee` and a
      # PER-MODEL ed25519 key, published in the attestation report's
      # `model_attestations` when the report is fetched with
      # `signing_algo=ed25519`. One pinned key therefore cannot be correct for
      # more than one model, and the gateway key is correct for none -- with it
      # set, every real receipt was refused. See
      # docs/superpowers/reports/2026-09-06-attested-inference-first-run.md.
      #
      # The per-model verification that report called for has since landed, and
      # the old variable is NO LONGER READ -- the witness refuses to start if
      # it is still set, rather than starting unpinned while an operator
      # believes it pins.
      #
      # Unset is the dormant state -- an offered receipt still has to verify,
      # against the key it names -- so this file ships without pins rather
      # than with a guess at which models this deployment routes to. Pinning a
      # model that is not served costs nothing; failing to pin one that is
      # served silently refuses its receipts under the same folded label as
      # every other receipt failure, which is hard to debug from outside.
      #
      # To pin, derive each model's key set from a nonce-bound report and set
      # `model=key[,model=key...]`. `signing_algo=ed25519` is NOT optional --
      # without it the endpoint answers with ECDSA attestations, whose keys
      # sign nothing verified here:
      #
      #   NONCE=$(openssl rand -hex 32)
      #   curl -s "https://cloud-api.near.ai/v1/attestation/report\
      #?model=<MODEL>&signing_algo=ed25519&nonce=$NONCE" \
      #     | jq -r --arg n "$NONCE" --arg m "<MODEL>" \
      #       '.model_attestations[] | select(.model_name==$m)
      #        | select(.signing_algo=="ed25519")
      #        | (.intel_quote | ascii_downcase) as $q
      #        | select($q[0:4]=="0400" and $q[8:16]=="81000000")
      #        | select($q[1136:1264] == (.signing_address + $n))
      #        | .signing_address'
      #
      # A model attestation has NO report_data field -- only the gateway does.
      # The binding is inside intel_quote at the TDX report_data position,
      # byte 568 for 64 bytes, which is hex characters [1136:1264]. The header
      # gate (v4, TEE type 0x81 = TDX) is the same one the code enforces: at
      # any other version or TEE those bytes are a different field, and a pin
      # derived without the gate is one the witness would refuse.
      #
      # The values are public keys, so they belong here rather than in a
      # deploy-time secret -- which also puts them inside the measurement.
      # Rotation upstream, or a new model, means re-deriving and moving these
      # deliberately, and re-allowlisting the measurement everywhere.
      #
      # TRACE_COMMONS_WITNESS_MODEL_KEY_PINS: "Qwen/Qwen3.6-35B-A3B-FP8=<key>"

      # Gateway receipt signing-key pins. ALSO DELIBERATELY UNSET HERE.
      #
      # The per-model correction above was right about chat-completions
      # receipts and wrong to stop there. A later live run established that
      # NEAR AI issues TWO legitimate kinds of receipt for the SAME hosted
      # model, and the PROTOCOL decides which:
      #
      #   POST /v1/chat/completions -> signature_kind: provider_tee
      #                                signer: the model's key, above
      #   POST /v1/responses        -> signature_kind: gateway
      #                                signer: gateway_attestation.signing_address
      #
      # The Codex CLI speaks the Responses API exclusively -- it dropped
      # `wire_api = "chat"` -- so a deployment whose contributors use Codex
      # produces only gateway-signed receipts, and the model pins alone refuse
      # every one of them.
      #
      # This is NOT the retired TRACE_COMMONS_WITNESS_GATEWAY_KEY_PIN, and the
      # name is different on purpose: that one applied the gateway key to
      # every receipt, and the witness still refuses to start if it is set.
      # These keys are consulted for gateway-kind receipts and nothing else.
      #
      # Bare keys, `key[,key...]`, 64 hex characters each -- no `0x` and no
      # `model=`. Derive from the SAME report fetch as the model pins; one
      # response carries both:
      #
      #   NONCE=$(openssl rand -hex 32)
      #   curl -s "https://cloud-api.near.ai/v1/attestation/report\
      #?model=<MODEL>&signing_algo=ed25519&nonce=$NONCE" \
      #     | jq -r --arg n "$NONCE" \
      #       '.gateway_attestation
      #        | select(.signing_algo=="ed25519")
      #        | (.intel_quote | ascii_downcase) as $q
      #        | select($q[0:4]=="0400" and $q[8:16]=="81000000")
      #        | select($q[1136:1264] == (.signing_address + $n))
      #        | .signing_address'
      #
      # Unset while the model pins are set means gateway receipts are REFUSED,
      # not admitted unchecked -- pinning one kind is not agreement to accept
      # the other from any signer. Unset with nothing else pinned is dormant.
      #
      # TRACE_COMMONS_WITNESS_GATEWAY_RECEIPT_KEY_PINS: "<gateway key>"

      # The classifier, resolved at startup: a witness told to run
      # `full-pipeline` with no usable backend does not bind, and a backend
      # that fails mid-request refuses rather than degrading to the
      # deterministic result.
      #
      # THIS IS A TRUST-BOUNDARY DECISION, taken deliberately. `near-ai` is an
      # endpoint OUTSIDE this enclave, so partially-redacted text leaves the
      # CVM. The deterministic pass has already run, so credentials and local
      # paths are masked in what goes out -- that ordering is why it is this
      # way round -- but prose PII is still present in it. Choosing this backend
      # places the classifier's operator inside the trust boundary of every
      # transcript this witness sees. The alternative, a sibling classifier
      # container inside the CVM, leaks nothing and costs a multi-gigabyte
      # model on CVM vCPUs at roughly 58 characters per second.
      TRACE_PRIVACY_FILTER_BACKEND: "near-ai"

      # Pinned rather than left to the binary's defaults. Both are MEASURED
      # here, so a contributor who has verified the measurement knows which
      # endpoint and which model this enclave sends prose to, without
      # disassembling the image to read a compiled-in default.
      TRACE_NEAR_AI_PRIVACY_BASE_URL: "https://cloud-api.near.ai/v1"
      TRACE_NEAR_AI_PRIVACY_MODEL: "openai/privacy-filter"

      # Most privacy/classify requests a minute, retries included, spaced
      # evenly; a 429 holds every caller for its Retry-After. NEAR AI
      # allowed this key 30 a minute on 2026-11-12. Injected encrypted at
      # deploy time, like the key below, and declared in `allowed_envs`, so
      # it can follow NEAR AI's limit without a new measurement (owner,
      # 2026-11-12). The NAME is measured; the VALUE is not. It changes only
      # how fast traces are reviewed -- never what is redacted, where the
      # text goes, or which model reads it, which all stay measured above.
      # Required: a deploy that forgets it fails to start rather than
      # running unpaced.
      TRACE_NEAR_AI_PRIVACY_MAX_REQUESTS_PER_MINUTE: ${TRACE_NEAR_AI_PRIVACY_MAX_REQUESTS_PER_MINUTE:?set at deploy time}

      # Injected encrypted at deploy time and declared in app-compose.json's
      # `allowed_envs`. The NAME is measured; the VALUE is not, and must never
      # be written into this file -- app-compose.json embeds this compose
      # verbatim and is uploaded to the deployer.
      TRACE_NEAR_AI_PRIVACY_API_KEY: ${TRACE_NEAR_AI_PRIVACY_API_KEY:?set at deploy time}

      # The largest request body, in bytes. Injected encrypted at deploy time
      # and declared in `allowed_envs`, like the pace above (owner,
      # 2026-11-13): the NAME is measured, the VALUE is not, so the bound can
      # follow real trace sizes without a new measurement. Set to 16 MiB
      # (16777216) on 2026-11-13: 1 MiB refused traces with a 4 MiB median,
      # and 16 MiB roughly matches what one review can classify (the up-front
      # too-large-to-review refusal covers the rest). Sixteen slots at 16 MiB
      # are on the order of 256 MiB of request bodies. Required: a deploy
      # that forgets it fails to start.
      TRACE_COMMONS_WITNESS_MAX_REQUEST_BYTES: ${TRACE_COMMONS_WITNESS_MAX_REQUEST_BYTES:?set at deploy time}

      # THE BOUND ON UNAUTHENTICATED WORK. The routes are unauthenticated, so
      # anyone who can reach `POST /v1/witness/jobs` can spend this CVM's cores and,
      # in `full-pipeline`, the NEAR AI capacity billed to the key above. The
      # body cap above is per request; it says nothing about how many arrive
      # at once. These two say that.
      #
      # Both are MEASURED: a contributor who has pinned this measurement can
      # verify how many requests run at once and for how long. The per-request
      # body cap above is a sealed deploy-time value since 2026-11-13, so its
      # VALUE is not part of the measurement (only that one is required).
      #
      # Sixteen at once (owner decision 2026-11-05; was four). Classifier
      # calls are bounded separately, process-wide, at two
      # (TRACE_COMMONS_WITNESS_MAX_CLASSIFY_IN_FLIGHT, binary default), and
      # admitted requests take turns at them in arrival order, so a slot is a
      # place in line, not more load on the key. Past sixteen, or when the
      # requests ahead would outlast the request timeout at the recent pace,
      # the answer is an immediate busy.
      TRACE_COMMONS_WITNESS_MAX_CONCURRENT_REQUESTS: "16"

      # Nine minutes. The owner asked for about ten (2026-11-05); the
      # dstack gateway closes a connection after 10 minutes with no data, and
      # the witness sends nothing until it answers, so the budget sits a
      # minute under that. The classifier was measured at ~3 s + 0.4 s/KiB on
      # 2026-11-05, and the witness passes this deadline to it, so no retry
      # starts that could not finish inside it.
      #
      # A bound with no deadline is not a bound: one request whose classifier
      # call never returns would hold its slot for the life of the process, and
      # four of those would wedge the witness at full occupancy with nothing
      # running. A timed-out request is refused with 504 and its slot is
      # released.
      TRACE_COMMONS_WITNESS_REQUEST_TIMEOUT_SECS: "540"

      # Submit-then-poll (docs/superpowers/specs/2026-11-05-witness-submit-then-poll.md).
      # POST /v1/witness is retired: a job is accepted at once and polled, so
      # no connection is held for the length of a review. Finished results
      # are sealed here, at most 256 of them. A full store answers busy.
      #
      # The largest sealed result, in bytes: a sealed deploy-time value like
      # the request cap (owner, 2026-11-13), kept above it so a redacted
      # result of a maximal request still fits. Set to 20 MiB (20971520) on
      # 2026-11-13: 256 results at that size is 5 GiB worst case on the
      # CVM's encrypted data disk. Required: a deploy that forgets it fails
      # to start.
      TRACE_COMMONS_WITNESS_RESULTS_DIR: "/var/lib/trace-commons-witness/results"
      TRACE_COMMONS_WITNESS_MAX_STORED_RESULTS: "256"
      TRACE_COMMONS_WITNESS_MAX_RESULT_BYTES: ${TRACE_COMMONS_WITNESS_MAX_RESULT_BYTES:?set at deploy time}

      # Path prefixes the deterministic pass treats as known, so they are not
      # reported as findings. Empty reports more, never less.
      TRACE_COMMONS_WITNESS_KNOWN_PATH_PREFIXES: ""

      # `info` is what the witness logs at, and what it logs is two lines at
      # boot: the signing address and the measurement. Both are public values
      # an operator pins. Do not raise this to `debug` on a deployment that
      # sees real transcripts.
      RUST_LOG: "info"

    ports:
      - "8088:8088"

volumes:
  witness-results:
  witness-cert-data:
  witness-tls-evidences:
