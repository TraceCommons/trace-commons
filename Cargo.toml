[workspace]
members = [
    "crates/trace-commons-attestation",
    "crates/trace-commons-build-info",
    "crates/trace-commons-contributor",
    "crates/trace-commons-contributor-ffi",
    "crates/trace-commons-gate-api",
    "crates/trace-commons-gate-enclave",
    "crates/trace-commons-mark",
    "crates/trace-commons-operator-client",
    "crates/trace-commons-protocol",
    "crates/trace-commons-server",
]
# The Linux contributor shell is its own workspace. Excluding it keeps the
# GTK dependency tree out of this lockfile, and keeps a `cargo check` here
# from depending on GTK 4 and libadwaita being installed.
#
# It does NOT mean the shell cannot be built on macOS: with Homebrew's gtk4
# and libadwaita present it builds and its whole test suite runs there. The
# comment here used to say it could not, which is worth correcting rather
# than deleting -- believing it meant the crate went unbuilt and unchecked
# by anyone developing on a Mac, and it drifted accordingly.
#
# Being outside this workspace also puts it outside `cargo fmt --all` and the
# root clippy job, so ci.yml runs both against its own manifest explicitly.
# Build it with scripts/linux-build.sh.
exclude = ["crates/trace-commons-contributor-gtk"]
resolver = "2"

[workspace.package]
edition = "2024"
# Raised from 1.92 on 2026-09-06. trace-commons-contributor takes an
# unconditional (not optional, not feature-gated) git dependency on
# ironwire_proxy, and the ironwire_*/ironclaw_* crates it pulls in declare
# rust-version = 1.96. There is no way to build the contributor CLI below
# this floor while that dependency exists.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TraceCommons/trace-commons"

# Third-party crates only: no debug info. The workspace's own crates keep the
# default dev profile, so their backtraces and debugger symbols are
# unchanged; a third-party frame still names its function but loses its
# file and line. Measured on 2026-10-15, a clean
# `cargo test -p trace-commons-contributor --lib --no-run` target/ went from
# 6.7-6.8 GB to 5.9 GB, which every worktree and CI cache carries.
[profile.dev.package."*"]
debug = false
