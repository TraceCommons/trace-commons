# Fast release build of trace-commons-ingest for the pilot host.
#
# The pilot host (tc-pilot-host) is Ubuntu 24.04 (glibc 2.39, OpenSSL 3). This
# builds on a matching ubuntu:24.04 image on a high-CPU machine and pushes the
# binary to GCS for the host to pull (deploy/pilot-gcp/pull-and-install.sh).
#
# The ONNX runtime (ort/fastembed) is statically linked (ort downloads
# libonnxruntime.a at build time), so the only runtime deps are standard
# Ubuntu 24.04 system libs that the host already has.
#
# Run:
#   gcloud builds submit --config cloudbuild.yaml \
#     --project tracecommons-pilot-2026 \
#     --substitutions _TAG=$(git rev-parse --short HEAD)
#
# (a .gcloudignore keeps target/ and .git out of the source upload.)

substitutions:
  _TAG: 'manual'            # short SHA or tag; defaults to BUILD_ID below if 'manual'
  _BUCKET: 'tc-pilot-artifacts-20260518'

steps:
  - name: 'ubuntu:24.04'
    id: build
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential pkg-config libssl-dev curl ca-certificates git clang cmake
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable --profile minimal
        . "$$HOME/.cargo/env"
        cargo build --release --bin trace-commons-ingest \
          --features gcs-client,gcp-kms,near-ai-scorer
        mkdir -p /workspace/out
        cp target/release/trace-commons-ingest /workspace/out/trace-commons-ingest
        ( cd /workspace/out && sha256sum trace-commons-ingest > trace-commons-ingest.sha256 )

  - name: 'gcr.io/cloud-builders/gcloud'
    id: publish
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        TAG="${_TAG}"; [ "$$TAG" = "manual" ] && TAG="${BUILD_ID}"
        DEST="gs://${_BUCKET}/binaries/trace-commons-ingest/$$TAG"
        gcloud storage cp /workspace/out/trace-commons-ingest        "$$DEST/trace-commons-ingest"
        gcloud storage cp /workspace/out/trace-commons-ingest.sha256 "$$DEST/trace-commons-ingest.sha256"
        # latest pointer the host's pull script reads
        printf '%s' "$$DEST/trace-commons-ingest" \
          | gcloud storage cp - "gs://${_BUCKET}/binaries/trace-commons-ingest/latest.txt"
        echo "published: $$DEST/trace-commons-ingest"

options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 120
timeout: '3000s'
