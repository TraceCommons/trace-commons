name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows-token-spool:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Protect a custom state directory
        shell: pwsh
        run: |
          $source = Get-Content crates/ironwire_ledger/src/token_spool.rs -Raw
          $script = [regex]::Match($source, 'const SCRIPT: &str = r#"(.*?)"#;', 'Singleline').Groups[1].Value
          if (!$script) { throw "ACL script unavailable" }
          $env:IRONWIRE_PRIVATE_PATH = Join-Path $env:RUNNER_TEMP "ironwire-acl-fixture"
          New-Item -ItemType Directory -Path $env:IRONWIRE_PRIVATE_PATH -Force | Out-Null
          & powershell.exe -NoProfile -NonInteractive -Command $script
          if ($LASTEXITCODE -ne 0) { throw "ACL fixture failed" }
      - run: cargo test -p ironwire_ledger --test token_spool
      - name: A second local user cannot read raw capture files
        shell: pwsh
        run: |
          $name = "iw" + [Guid]::NewGuid().ToString("N").Substring(0, 12)
          $password = ConvertTo-SecureString ([Guid]::NewGuid().ToString("N") + "!aA7") -AsPlainText -Force
          $fixture = Join-Path $env:PUBLIC ($name + ".raw")
          try {
            New-LocalUser -Name $name -Password $password -AccountNeverExpires | Out-Null
            [IO.File]::WriteAllText($fixture, "synthetic-private-capture")
            $source = Get-Content crates/ironwire_ledger/src/token_spool.rs -Raw
            $script = [regex]::Match($source, 'const SCRIPT: &str = r#"(.*?)"#;', 'Singleline').Groups[1].Value
            $env:IRONWIRE_PRIVATE_PATH = $fixture
            & powershell.exe -NoProfile -NonInteractive -Command $script
            if ($LASTEXITCODE -ne 0) { throw "Private ACL installation failed" }
            $probe = "try { [IO.File]::ReadAllBytes('$fixture') | Out-Null; exit 21 } catch [UnauthorizedAccessException] { exit 0 } catch { exit 22 }"
            $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($probe))
            $credential = [PSCredential]::new("$env:COMPUTERNAME\$name", $password)
            $process = Start-Process powershell.exe -Credential $credential -WorkingDirectory $env:PUBLIC -ArgumentList @("-NoProfile", "-NonInteractive", "-EncodedCommand", $encoded) -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "Second-user raw capture access was not refused: $($process.ExitCode)" }
          } finally {
            Remove-Item -LiteralPath $fixture -Force -ErrorAction SilentlyContinue
            Remove-LocalUser -Name $name -ErrorAction SilentlyContinue
          }


  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features
      # The privacy filter's cost budget is only meaningful optimised; in debug
      # it is ~25x slower and the assertion would measure the optimiser. An
      # ignored test nobody runs is a deleted test, so it runs here.
      - run: cargo test --release -p ironwire_privacy --test cost -- --include-ignored

      # The menu bar app (macos/), on the macOS leg only: Linux runners cannot
      # build Swift, and a red matrix on every push would be worse than no
      # coverage. The alternative is finding a Swift compile break during a tag
      # build, after the tag is pushed — which is the failure this whole job
      # exists to avoid.
      #
      # `app` as well as `test`, because the bundle assembly and the Info.plist
      # are what the release job runs, and a typo there is only otherwise
      # discovered by a release.
      - name: Menu bar app
        if: matrix.os == 'macos-latest'
        run: make -C macos test app

  # The packaging scripts only otherwise run inside a tag build, which is the
  # worst place to find a typo: the tag is already pushed and a fix needs
  # another one. So they run here, against fake release artifacts.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      # The runner image preinstalls apt sources for software this job never
      # touches -- Google Chrome and Microsoft today, whatever the next image
      # adds tomorrow. `apt-get update` consults all of them, so when one of
      # them publishes a bad index the whole command exits 100 and every step
      # below is skipped: a red lint job that linted nothing. That is not
      # hypothetical, it is this repo on 2026-09-09:
      #
      #   Err:24 https://dl.google.com/linux/chrome-stable/deb stable/main
      #     Hash Sum mismatch
      #   E: Some index files failed to download.
      #
      # shellcheck, dash and zip all come from the Ubuntu archive, so the fix
      # is to stop consulting sources we never install from. Sources are
      # selected by what they point at rather than by filename, because the
      # filenames are the image's business and change without notice.
      #
      # Deliberately not `|| true`: that turns a broken index into a silent
      # install off a stale cache, and the job goes green having installed
      # something other than what it asked for. Deliberately not
      # `Acquire::Retries`: a hash-sum mismatch is a corrupt index, not a flaky
      # socket, so a retry re-fetches the same bad file. If `apt-get update`
      # still fails after this, it is the Ubuntu archive itself and this job
      # should say so loudly.
      - name: Install from the Ubuntu archive alone
        run: |
          set -euo pipefail
          shopt -s nullglob
          removed=0
          for source in /etc/apt/sources.list.d/*.list \
                        /etc/apt/sources.list.d/*.sources; do
            if grep -qE 'ubuntu\.com|apt-mirrors\.txt' "$source"; then
              echo "keeping   $source"
              continue
            fi
            echo "disabling $source"
            sudo rm -f "$source"
            removed=$((removed + 1))
          done
          # An `rm` of a path that is not there succeeds silently, which looks
          # exactly like a fix until the next bad index proves it was not one.
          if [ "$removed" -eq 0 ]; then
            echo "::error::no third-party apt source was found to disable;" \
                 "the runner image changed shape and this guard is now inert" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y shellcheck dash zip
      - name: Lint shell
        run: shellcheck -S warning scripts/*.sh
      - name: Installer behaviour
        run: ./scripts/test-install.sh
      - name: Packaging scripts
        run: ./scripts/test-packaging.sh

  # The commands a person actually runs, in the order they run them, against a
  # mock provider. Every integration bug found in this project so far was found
  # this way and none of them were visible from inside a unit test.
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin ironwire
      - run: ./scripts/journey.sh

  size:
    # brew/npx/apt/pip all ship this binary, so size is worth watching — but it
    # is a signal, not a gate. A feature worth its bytes should never be blocked
    # by a threshold (docs/PACKAGING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Report binary size
        run: |
          size=$(stat -c%s target/release/ironwire)
          printf 'ironwire: %s bytes (%.1f MB)\n' "$size" "$(echo "$size / 1048576" | bc -l)"
          echo "### ironwire release binary: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
