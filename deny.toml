# Dependency policy for licenses, bans, advisories, and sources.
#
# `trace-commons-server`, `-gate-api`, `-gate-enclave`, and `-ingest` are
# AGPL-3.0-or-later; every other crate and every shipped client is
# `MIT OR Apache-2.0`. Everything in the server graph must be combinable into
# an AGPL-3.0 work, and no third-party or client crate may carry AGPL-3.0-or-later
# (enforced below by scoping AGPL-3.0-or-later strictly to the four server
# crates via `[[licenses.exceptions]]`).
#
# Run: cargo deny check
#      cargo deny --all-features check

[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    # NCSA (libfuzzer-sys, via rav1e). BSD/MIT-style, FSF-listed as
    # GPL-compatible.
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    # 0BSD (recvmsg, via interprocess under local-gpu-models). Public-domain
    # equivalent.
    "0BSD",
    # webpki-roots. A data licence over the Mozilla CA root store, not code:
    # permissive, no copyleft or attribution obligation that conflicts with
    # AGPL-3.0 or proprietary client embedding.
    "CDLA-Permissive-2.0",
]
# GTK and Tauri workspaces never resolve the four AGPL server crates, and
# default-feature checks omit 0BSD/NCSA crates behind optional ML features.
unused-allowed-license = "allow"

# Only our four server/gate crates may declare AGPL-3.0-or-later. Keeping it out
# of the global `allow` list ensures a third-party AGPL dependency or an
# accidental AGPL header on a client crate fails `cargo deny check licenses`
# across all three workspaces (root, GTK, and Tauri).
[[licenses.exceptions]]
name = "trace-commons-server"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "trace-commons-gate-api"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "trace-commons-gate-enclave"
allow = ["AGPL-3.0-or-later"]

[[licenses.exceptions]]
name = "trace-commons-ingest"
allow = ["AGPL-3.0-or-later"]

[bans]
multiple-versions = "allow"
# `wildcards = "deny"` cannot be enabled because cargo-deny's
# `allow-wildcard-paths` only exempts crates with `publish = false`, flagging
# internal `path = "../..."` edges across workspace crates and git dependencies.
wildcards = "allow"
deny = [
    # PostgreSQL-only repository (CLAUDE.md "Database backend").
    { crate = "libsql" },
    # Parquet + Arrow were removed from pilot-bootstrap in favour of streaming
    # JSONL; do not reintroduce them (CLAUDE.md "Working with this codebase").
    { crate = "parquet" },
    { crate = "arrow" },
]

[advisories]
version = 2
yanked = "deny"
# hf-hub is not feature-gated, so this reaches every cargo-deny job
# (default, near-ai-scorer, local-gpu-models) alike. Also revisit if
# number_prefix itself ships a fix for RUSTSEC-2025-0119.
#
# The hickory-proto / hickory-resolver (0.25.2) and crypto-bigint (0.5.5)
# entries below are reached where noted, and each entry here is because no
# semver-compatible lockfile bump reaches a patched version from this tree
# today -- not because it was judged unimportant. RUSTSEC-2026-0118 and
# RUSTSEC-2026-0491 in particular are live remote wire-DNS DoS vulnerabilities
# we are carrying until reqwest 0.13 moves to hickory-resolver 0.26, so they
# must be the first entries dropped when reqwest moves.
ignore = [
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained with no fixed release, pulled in via indicatif 0.17 via hf-hub 0.4.3 (trace-commons-server, trace-commons-gate-enclave, mistralrs). Revisit when hf-hub 0.4.3 and mistralrs move to hf-hub >= 0.5 (which uses indicatif 0.18 without number_prefix)." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.35.0 (bundled SQLite < 3.54.0): uninitialized page-cache memory read when opening a local database alongside a crafted -wal file with a mismatched page size. Fixed in libsqlite3-sys >= 0.39.0 (rusqlite >= 0.39.0), which a lockfile update cannot reach: rusqlite 0.37.0 pins libsqlite3-sys ^0.35, and ironwire_ledger (pinned git dependency in nearai/ironwire) also depends on rusqlite 0.37 while Cargo's `links = \"sqlite3\"` forbids two libsqlite3-sys versions in one graph. Drop once nearai/ironwire and this workspace upgrade rusqlite together." },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2: NSEC3 closest-encloser proof validation enters an unbounded loop on a crafted cross-zone response. Fixed in 0.26.1+, which this tree cannot reach: hickory-proto is pinned by hickory-resolver 0.25.x, which reqwest 0.13.3 requires by semver, so the fix needs a reqwest release depending on hickory-resolver 0.26 -- not a lockfile bump. Reached under near-attestation-collateral (dcap-qvl/report enables reqwest's hickory-dns feature, unified into pilot ingest builds alongside near-ai-scorer), so a hostile or hijacked DNS response is a live attack path; drop the moment reqwest moves." },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25.2: O(n^2) name compression during message encoding, CPU exhaustion. Same crate, same >= 0.26.1 fix, same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118 -- the hickory 0.25 entries lift together." },
    { id = "RUSTSEC-2026-0487", reason = "hickory-proto 0.25.2: zone-file text parser panic on malformed input. Not reachable via HTTP client wire-DNS lookups; blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin (fixed in 0.26.2) as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0489", reason = "hickory-proto 0.25.2: zone-file text parser panic on malformed record input. Not reachable via HTTP client wire-DNS lookups; blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin (fixed in 0.26.2) as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0490", reason = "hickory-proto 0.25.2: zone-file text parser panic on malformed input. Not reachable via HTTP client wire-DNS lookups; blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin (fixed in 0.26.2) as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0491", reason = "hickory-proto 0.25.2: wire-format DNS header record-count memory amplification (Vec::with_capacity from untrusted header counts on a small crafted packet). Live remote wire-DNS DoS exposure under near-attestation-collateral, alongside RUSTSEC-2026-0118. Fixed in 0.26.2, blocked on reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin; drop the moment reqwest moves." },
    { id = "RUSTSEC-2026-0504", reason = "hickory-proto 0.25.2: DNSSEC validation flaw (unaffected >= 0.26.0-beta.1, no 0.25.x patch; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0505", reason = "hickory-proto 0.25.2: DNSSEC validation flaw (unaffected >= 0.26.0-beta.1, no 0.25.x patch; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0511", reason = "hickory-proto 0.25.2: DNSSEC NSEC/NSEC3 validation flaw (unaffected >= 0.26.0-beta.1, no 0.25.x patch; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0512", reason = "hickory-proto 0.25.2: DNSSEC validation flaw (unaffected >= 0.26.0-beta.1, no 0.25.x patch; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0514", reason = "hickory-resolver 0.25.2: Resolver::lookup / lookup_ip DNSSEC validation flaw (reqwest uses default non-DNSSEC TokioResolver). Fixed in 0.26.2, blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0530", reason = "hickory-proto 0.25.2: DNSSEC parent-side NSEC at a zone cut accepted as proof of nonexistence (fixed in hickory-net 0.26.2, no hickory-proto fix; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0531", reason = "hickory-proto 0.25.2: DNSSEC child-side NSEC/NSEC3 record accepted as proof that a delegation has no DS record (fixed in hickory-net 0.26.2, no hickory-proto fix; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0532", reason = "hickory-proto 0.25.2: DNSSEC parent-side NSEC3 at a zone cut accepted as proof of nonexistence (fixed in hickory-net 0.26.2, no hickory-proto fix; reqwest uses default non-DNSSEC TokioResolver). Blocked on the same reqwest 0.13.3 -> hickory-resolver 0.25.x semver pin as RUSTSEC-2026-0118." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5: timing variability in operations meant to be constant-time. Fixed only in 0.7.6, a new major line; 0.5.5 is pinned by elliptic-curve 0.13 via k256 0.13, so the fix needs a k256 0.14 upgrade, not a lockfile bump. Not exploitable here: production code only verifies secp256k1 signatures (EIP-191 receipt and witness signer recovery) over public data; every k256 SigningKey use is in a test module, so no secret key passes through crypto-bigint. Drop this when k256 moves to crypto-bigint 0.7." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained with no fixed release and no successor named by the advisory. A proc-macro crate that expands at compile time and ships no runtime code, reached via the ML stack under near-ai-scorer and local-gpu-models. Revisit if its dependents drop it." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained with no fixed release. A non-cryptographic hash function with no known vulnerability, reached under local-gpu-models (and -cuda) via bm25 in mistralrs-core, which pilot production does not build. Revisit if its dependents move to rustc-hash." },
    # zip 7.2.0 group: RUSTSEC-2026-0367, 0368, 0369, 0429. All four are in
    # ZipArchive::extract(), which nothing in this tree calls, and they lift
    # together once a candle-core release on zip >= 9 reaches mistralrs.
    # Caveat: these ids are ignored for every lockfile (cargo-audit.py and
    # the Tauri deny policy reuse this list), but the reachability argument
    # covers only the root Cargo.lock. Re-check them if zip ever appears in
    # tauri-desktop/Cargo.lock or crates/trace-commons-contributor-gtk/Cargo.lock.
    { id = "RUSTSEC-2026-0367", reason = "zip 7.2.0: ZipArchive::extract() and ZipStreamReader::extract() keep SUID/SGID/sticky bits from the archive. Reached only under local-gpu-models (and -cuda), via candle-core 0.10.2 via candle-nn via mistralrs (git rev 2d4ba4f) via trace-commons-gate-enclave; default, near-ai-scorer and the production set (gcs-client, gcp-kms, near-ai-scorer, near-attestation-collateral) do not build zip at all (`cargo tree -i zip`). The extraction API is not reachable: candle-core opens npz/pth archives with ZipArchive::new plus by_index/by_name and reads entries into memory, and writes npz with ZipWriter; nothing in candle-core, mistralrs or this tree calls extract(), extract_unwrapped_root_dir() or ZipStreamReader::extract(), which are the only zip 7.2.0 paths that touch the filesystem (make_symlink, make_writable_dir_all, set_permissions). Fixed in zip 9.0.0, which no candle release reaches: candle-core 0.10.2 pins zip ^7.2.0 (`cargo update -p zip` stops at 7.4.0), and candle-core 0.11.0 and candle main require zip ^8.6.0. Drop when a candle-core release on zip >= 9 reaches this tree through mistralrs; the zip 7.2.0 entries lift together." },
    { id = "RUSTSEC-2026-0368", reason = "zip 7.2.0: ZipArchive::extract() creates symlinks whose archive-supplied targets point outside the destination. Same path as RUSTSEC-2026-0367 (local-gpu-models only, candle-core 0.10.2 via mistralrs). Not reachable: ZipArchive::extract() is never called in candle-core, mistralrs or this tree, and the symlink is created only inside it (make_symlink); candle reads entries through by_index/by_name. Same zip 9.0.0 fix and same candle pin as RUSTSEC-2026-0367; the zip 7.2.0 entries lift together." },
    { id = "RUSTSEC-2026-0369", reason = "zip 7.2.0: ZipArchive::extract() and ZipStreamReader::extract() apply Unix permissions through extracted symlinks. Same path as RUSTSEC-2026-0367 (local-gpu-models only, candle-core 0.10.2 via mistralrs). Not reachable: neither extract() is called in candle-core, mistralrs or this tree, and set_permissions runs only inside them; candle reads entries through by_index/by_name. Same zip 9.0.0 fix and same candle pin as RUSTSEC-2026-0367; the zip 7.2.0 entries lift together." },
    { id = "RUSTSEC-2026-0429", reason = "zip 7.2.0: ZipArchive::extract() sizes a symlink-target buffer from the archive's declared uncompressed size and aborts the process on a huge one. Same path as RUSTSEC-2026-0367 (local-gpu-models only, candle-core 0.10.2 via mistralrs). Not reachable: ZipArchive::extract() is never called in candle-core, mistralrs or this tree, and the allocation happens only inside it; candle reads entries through by_index/by_name. Same zip 9.0.0 fix and same candle pin as RUSTSEC-2026-0367; the zip 7.2.0 entries lift together." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained; the advisory states no safe upgrade is available. Reached only under gcp-kms, via tonic 0.12.3 via google-cloud-kms 0.6.0. The migration target is rustls-pki-types' PemObject trait, which is tonic's call to make, not ours. Revisit when google-cloud-kms moves to a tonic release that has migrated." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained with no fixed release. Tauri 2.11.5 reaches it only as a build-time macro through GTK 3's glib-macros on Linux; it ships no runtime code. Revisit when Tauri's Linux stack leaves GTK 3 or glib-macros removes it." },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained as a standalone crate because zbus 6.0.0 absorbed it; the advisory names no vulnerability. zbus 5 reaches it through the Linux D-Bus stack: secret-service 5.2.0 and zbus-secret-service-keyring-store 1.0.1 (contributor keyring, every workspace), notify-rust 4.18.2 (GTK shell) and tauri-plugin-single-instance (Tauri). The latest release of each still requires zbus ^5, so no lockfile bump reaches zbus 6. Drop when they all move to zbus 6; the three zbus entries lift together." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained as a standalone crate because zbus 6.0.0 absorbed it; the advisory names no vulnerability. zbus 5 reaches it through the Linux D-Bus stack: secret-service 5.2.0 and zbus-secret-service-keyring-store 1.0.1 (contributor keyring, every workspace), notify-rust 4.18.2 (GTK shell) and tauri-plugin-single-instance (Tauri). The latest release of each still requires zbus ^5, so no lockfile bump reaches zbus 6. Drop when they all move to zbus 6; the three zbus entries lift together." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained as a standalone crate because zbus 6.0.0 absorbed it; the advisory names no vulnerability. zbus 5 reaches it through the Linux D-Bus stack: secret-service 5.2.0 and zbus-secret-service-keyring-store 1.0.1 (contributor keyring, every workspace), notify-rust 4.18.2 (GTK shell) and tauri-plugin-single-instance (Tauri). The latest release of each still requires zbus ^5, so no lockfile bump reaches zbus 6. Drop when they all move to zbus 6; the three zbus entries lift together." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only the three reviewed git repositories may appear in any workspace's
# resolved graph. `required-git-spec = "rev"` cannot be enabled yet because
# `nearai/ironwire` transitively pulls `nearai/ironclaw` with `branch = "main"`.
allow-git = [
    "https://github.com/nearai/ironwire",
    "https://github.com/nearai/ironclaw",
    "https://github.com/EricLBuehler/mistral.rs.git",
]
