# Licence audit for the AGPL split.
#
# `trace-commons-server`, `-gate-api`, and `-gate-enclave` are AGPL-3.0-or-later.
# Everything they link must therefore be under a licence that can be combined
# into an AGPL-3.0 work. The allow list below is exactly that set; a dependency
# under GPL-2.0-only, SSPL, or a proprietary licence is a hard conflict.
#
# Run: cargo deny check licenses
#      cargo deny --all-features check licenses

[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    # NCSA (libfuzzer-sys, via rav1e). BSD/MIT-style, FSF-listed as
    # GPL-compatible.
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    # 0BSD (recvmsg, via interprocess under local-gpu-models). Public-domain
    # equivalent.
    "0BSD",
    # Our own server and gate crates. Spelled `-or-later` because that is what
    # they declare, and cargo-deny does not treat it as a synonym for
    # "AGPL-3.0".
    "AGPL-3.0-or-later",
    # webpki-roots. A data licence over the Mozilla CA root store, not code:
    # permissive, no copyleft or attribution obligation that conflicts with
    # AGPL-3.0. Combinable into an AGPL work.
    "CDLA-Permissive-2.0",
]
# Our own crates are not published, so an allowed licence with no match in the
# graph is expected while the split is in progress.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[advisories]
version = 2
# hf-hub is not feature-gated, so this reaches every cargo-deny job
# (default, near-ai-scorer, local-gpu-models) alike. Also revisit if
# number_prefix itself ships a fix for RUSTSEC-2025-0119.
ignore = [
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained with no fixed release, pulled in via indicatif via hf-hub, a direct unconditional dependency of trace-commons-server. Revisit when hf-hub is upgraded past 0.4.x -- hf-hub 1.0 has no indicatif/number_prefix dependency at all (verified via `cargo tree`) -- but that is a breaking rewrite, not a lockfile bump, so it is out of scope here." },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
