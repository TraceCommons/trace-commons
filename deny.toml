# Licence audit for the AGPL split.
#
# `trace-commons-server`, `-gate-api`, `-gate-enclave`, and `-ingest` are
# AGPL-3.0-or-later.
# Everything they link must therefore be under a licence that can be combined
# into an AGPL-3.0 work. The allow list below is exactly that set; a dependency
# under GPL-2.0-only, SSPL, or a proprietary licence is a hard conflict.
#
# Run: cargo deny check licenses
#      cargo deny --all-features check licenses

[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    # NCSA (libfuzzer-sys, via rav1e). BSD/MIT-style, FSF-listed as
    # GPL-compatible.
    "NCSA",
    "Unicode-3.0",
    "Zlib",
    # 0BSD (recvmsg, via interprocess under local-gpu-models). Public-domain
    # equivalent.
    "0BSD",
    # Our own server and gate crates. Spelled `-or-later` because that is what
    # they declare, and cargo-deny does not treat it as a synonym for
    # "AGPL-3.0".
    "AGPL-3.0-or-later",
    # webpki-roots. A data licence over the Mozilla CA root store, not code:
    # permissive, no copyleft or attribution obligation that conflicts with
    # AGPL-3.0. Combinable into an AGPL work.
    "CDLA-Permissive-2.0",
]
# Our own crates are not published, so an allowed licence with no match in the
# graph is expected while the split is in progress.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[advisories]
version = 2
# hf-hub is not feature-gated, so this reaches every cargo-deny job
# (default, near-ai-scorer, local-gpu-models) alike. Also revisit if
# number_prefix itself ships a fix for RUSTSEC-2025-0119.
#
# The four below are reached only through optional features, and are what
# stands between the production-graph advisories job and a green check.
# Each is here because no upgrade reaches it from this tree today -- not
# because it was judged unimportant. RUSTSEC-2026-0118 in particular is a
# real remote-input vulnerability we are choosing to carry, so it should be
# the first thing re-checked when reqwest moves.
ignore = [
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained with no fixed release, pulled in via indicatif via hf-hub, a direct unconditional dependency of trace-commons-server. Revisit when hf-hub is upgraded past 0.4.x -- hf-hub 1.0 has no indicatif/number_prefix dependency at all (verified via `cargo tree`) -- but that is a breaking rewrite, not a lockfile bump, so it is out of scope here." },
    { id = "RUSTSEC-2026-0118", reason = "hickory-proto 0.25.2: NSEC3 closest-encloser proof validation enters an unbounded loop on a crafted cross-zone response. Fixed in 0.26.1, which this tree cannot reach: hickory-proto is pinned by hickory-resolver 0.25.x, which reqwest 0.13.3 requires by semver, so the fix needs a reqwest release depending on hickory-resolver 0.26 -- not a lockfile bump. Reached under near-attestation-collateral (dcap-qvl) and near-ai-scorer, i.e. when the ingest host resolves NEAR AI endpoints, so a hostile or hijacked DNS response is the trigger. This is the one ignore here with a live attack path; drop it the moment reqwest moves." },
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.25.2: O(n^2) name compression during message encoding, CPU exhaustion. Same crate, same 0.26.1 fix, same reqwest 0.13.3 pin as RUSTSEC-2026-0118 -- these two lift together." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5: timing variability in operations meant to be constant-time. Fixed only in 0.7.6, a new major line; 0.5.5 is pinned by elliptic-curve 0.13 via k256 0.13, so the fix needs a k256 0.14 upgrade, not a lockfile bump. Not exploitable here: production code only verifies secp256k1 signatures (EIP-191 receipt and witness signer recovery) over public data; every k256 SigningKey use is in a test module, so no secret key passes through crypto-bigint. Drop this when k256 moves to crypto-bigint 0.7." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained with no fixed release and no successor named by the advisory. A proc-macro crate that expands at compile time and ships no runtime code, reached via the ML stack under near-ai-scorer and local-gpu-models. Revisit if its dependents drop it." },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained with no fixed release. A non-cryptographic hash function with no known vulnerability, reached only under local-gpu-models-cuda via the ML stack, which production does not build. Revisit if its dependents move to rustc-hash." },
    { id = "RUSTSEC-2026-0367", reason = "zip 7.2.0: ZipArchive::extract() and ZipStreamReader::extract() keep SUID/SGID/sticky bits from the archive. Reached only under local-gpu-models (and -cuda), via candle-core 0.10.2 via candle-nn via mistralrs (git rev 2d4ba4f) via trace-commons-gate-enclave; default, near-ai-scorer and the production set (gcs-client, gcp-kms, near-ai-scorer, near-attestation-collateral) do not build zip at all (`cargo tree -i zip`). The extraction API is not reachable: candle-core opens npz/pth archives with ZipArchive::new plus by_index/by_name and reads entries into memory, and writes npz with ZipWriter; nothing in candle-core, mistralrs or this tree calls extract(), extract_unwrapped_root_dir() or ZipStreamReader::extract(), which are the only zip 7.2.0 paths that touch the filesystem (make_symlink, make_writable_dir_all, set_permissions). Fixed in zip 9.0.0, which no candle release reaches: candle-core 0.10.2 pins zip ^7.2.0 (`cargo update -p zip` stops at 7.4.0), and candle-core 0.11.0 and candle main require zip ^8.6.0. Drop when a candle-core release on zip >= 9 reaches this tree through mistralrs." },
    { id = "RUSTSEC-2026-0368", reason = "zip 7.2.0: ZipArchive::extract() creates symlinks whose archive-supplied targets point outside the destination. Same path as RUSTSEC-2026-0367 (local-gpu-models only, candle-core 0.10.2 via mistralrs). Not reachable: ZipArchive::extract() is never called in candle-core, mistralrs or this tree, and the symlink is created only inside it (make_symlink); candle reads entries through by_index/by_name. Same zip 9.0.0 fix and same candle pin as RUSTSEC-2026-0367 -- the three zip entries lift together." },
    { id = "RUSTSEC-2026-0369", reason = "zip 7.2.0: ZipArchive::extract() and ZipStreamReader::extract() apply Unix permissions through extracted symlinks. Same path as RUSTSEC-2026-0367 (local-gpu-models only, candle-core 0.10.2 via mistralrs). Not reachable: neither extract() is called in candle-core, mistralrs or this tree, and set_permissions runs only inside them; candle reads entries through by_index/by_name. Same zip 9.0.0 fix and same candle pin as RUSTSEC-2026-0367 -- the three zip entries lift together." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 is unmaintained; the advisory states no safe upgrade is available. Reached only under gcp-kms, via tonic 0.12.3 via google-cloud-kms 0.6.0. The migration target is rustls-pki-types' PemObject trait, which is tonic's call to make, not ours. Revisit when google-cloud-kms moves to a tonic release that has migrated." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained with no fixed release. Tauri 2.11.5 reaches it only as a build-time macro through GTK 3's glib-macros on Linux; it ships no runtime code. Revisit when Tauri's Linux stack leaves GTK 3 or glib-macros removes it." },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained with no fixed release. Tauri 2.11.5 reaches it through urlpattern 0.3.0 and tauri-utils 2.9.3. Revisit when tauri-utils replaces that parser stack." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained as a standalone crate because zbus 6.0.0 absorbed it; the advisory names no vulnerability. zbus 5 reaches it through the Linux D-Bus stack: secret-service 5.2.0 and zbus-secret-service-keyring-store 1.0.1 (contributor keyring, every workspace), notify-rust 4.18.2 (GTK shell) and tauri-plugin-single-instance (Tauri). The latest release of each still requires zbus ^5, so no lockfile bump reaches zbus 6. Drop when they all move to zbus 6; the three zbus entries lift together." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained as a standalone crate because zbus 6.0.0 absorbed it; the advisory names no vulnerability. zbus 5 reaches it through the Linux D-Bus stack: secret-service 5.2.0 and zbus-secret-service-keyring-store 1.0.1 (contributor keyring, every workspace), notify-rust 4.18.2 (GTK shell) and tauri-plugin-single-instance (Tauri). The latest release of each still requires zbus ^5, so no lockfile bump reaches zbus 6. Drop when they all move to zbus 6; the three zbus entries lift together." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained as a standalone crate because zbus 6.0.0 absorbed it; the advisory names no vulnerability. zbus 5 reaches it through the Linux D-Bus stack: secret-service 5.2.0 and zbus-secret-service-keyring-store 1.0.1 (contributor keyring, every workspace), notify-rust 4.18.2 (GTK shell) and tauri-plugin-single-instance (Tauri). The latest release of each still requires zbus ^5, so no lockfile bump reaches zbus 6. Drop when they all move to zbus 6; the three zbus entries lift together." },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots bundled the emSign ECC Root CA - G3, which lets distrusted emSign intermediates chain. The advisory's only patched range is >= 1.0.10, so it also flags webpki-roots 0.26.11, the last 0.26.x release. That release is a semver-trick shim with no roots of its own: its lib.rs is `pub use parent::TLS_SERVER_ROOTS` over webpki-roots ^1, which this lockfile resolves to the patched 1.0.10 -- so the roots it hands out are the fixed set. It is reached through tokio-tungstenite 0.23.1 (rig-core 0.33.0 via ironclaw_llm via ironwire, the contributor's default build), ureq 2.12.1 (hf-hub 0.4.3 via mistralrs, under near-ai-scorer and local-gpu-models) and tonic 0.12.3 (google-cloud-kms 0.6.0, under gcp-kms). Each is already the latest release of its semver line and none of those lines moves to webpki-roots 1, so no lockfile bump removes the shim. Caveat: this id-based ignore would also hide a later regression of webpki-roots 1.x below 1.0.10. Drop when those three move to webpki-roots 1." },
]

[sources]
unknown-registry = "deny"
unknown-git = "allow"
