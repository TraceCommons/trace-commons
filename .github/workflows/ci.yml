# GitHub Actions CI for trace-commons-server.
#
# Runs the default-features build path plus the non-CUDA local-gpu-models
# feature variant on every push to main and every pull request against main.
# The CUDA variant (local-gpu-models-cuda) is operator-tested on GPU hosts
# only — it requires the CUDA toolkit and is not exercised here.
#
# cargo fmt --check is enforced as of the cargo-fmt cleanup PR. Clippy is
# enforced; only the style/perf lints listed in the cargo-clippy job's `-A`
# flags are allowed (see docs/superpowers/reports/2026-05-14-clippy-baseline.md
# for the audit that selected that allow-list).
#
# Action pinning (last reviewed 2026-05-14): actions/checkout is pinned to v6
# and actions/cache to v5 because those are the first major releases that run
# on the Node.js 24 runtime. GitHub force-upgrades older v4 pins to Node 24
# starting 2026-06-02, so pinning forward now avoids a silent runtime swap.
# dtolnay/rust-toolchain is a composite action and is not affected by the
# Node.js runtime change.

name: ci

on:
  push:
    branches: [main]
  # The merge queue tests each candidate batch on a temporary branch and
  # reports the same required checks there; without this trigger a queued
  # PR never gets its checks and times out of the queue.
  merge_group:
  # Deliberately unfiltered by base branch. This repository uses stacked
  # PRs, and a `branches: [main]` filter here means a PR targeting another
  # branch gets no CI at all -- the work is only ever tested once it reaches
  # main, which is exactly when a failure is most expensive to unwind. A PR
  # should be tested against the branch it will actually merge into.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR and merge-queue runs are superseded by the next push to the same ref
  # and are cancelled. Push-to-main runs are NOT: `github.ref` is the same
  # `refs/heads/main` for every merge, so with cancellation on, each merge
  # killed the previous merge's run mid-build -- 22 of the 40 main runs on
  # 2026-09-09 ended `cancelled` -- and actions/cache only saves on a job
  # that finished. The default-branch caches every PR is meant to restore
  # from were therefore written on fewer than half the merges. A main run
  # that completes costs the same minutes a cancelled one already spent.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  cargo-fmt-check:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # Seconds, no build. The contributor crate's `test-credential-store`
      # feature swaps the OS keychain for a plaintext file and must only ever
      # be on under `cargo test`; this refuses any release/packaging workflow,
      # build script or shipped manifest that could turn it on. The self-test
      # seeds each violation and requires a refusal, so the check cannot rot
      # into one that always passes.
      - name: No shipped build enables the test credential store
        run: |
          scripts/ci/check-release-credential-store.sh check
          scripts/ci/check-release-credential-store.sh self-test
      # Seconds, no build. `near-ai-staging` switches the compiled-in NEAR AI
      # host (server, ingest and the contributor daemon) to NEAR AI staging,
      # for the payout staging run only. This refuses any release, packaging
      # or deploy file or shipped manifest that could turn it on; the
      # self-test seeds each violation and requires a refusal.
      - name: No shipped build enables the NEAR AI staging host
        run: |
          scripts/ci/check-release-staging-feature.sh check
          scripts/ci/check-release-staging-feature.sh self-test
      # Seconds, no build. The macOS Info.plist per bundle channel: a
      # production plist byte-identical to the one before the channel files,
      # a staging plist with only staging identity and feed.
      - name: macOS Info.plist per bundle channel
        run: scripts/ci/test-macos-channel-plist.sh
      # Seconds, no build. The release workflows scan the shipped dylib and
      # CLI for the staging pin verifier; the self-test seeds each marker
      # into a scratch binary and requires a refusal.
      - name: No release binary carries the staging pin verifier
        run: scripts/ci/assert-no-staging-markers.sh self-test
      # Seconds. The Sparkle appcast generator for both channels, with a
      # stub sign_update: production's appcast unchanged, staging's own
      # title and pre-release version.
      - name: Sparkle appcast for each channel
        run: scripts/ci/test-generate-appcast.sh
      # Seconds, no build, no network. The server deploy files: the pilot
      # templates and deploy.sh unchanged by the staging parameters, and the
      # staging render (deploy/staging-gcp/render-env.sh) with dummy secrets.
      - name: Pilot and staging server deploy files
        run: scripts/ci/test-deploy-render.sh
      # Seconds, no build, no network. The staging database backup and its
      # restore check against stub pg_dump, pg_restore, psql and gcloud: run
      # as postgres, dump and counts in one snapshot, mode 0600, sidecar
      # uploaded last, and a row-count mismatch fails.
      - name: Staging database backup and restore check
        run: scripts/ci/test-staging-db-backup.sh

      - name: Offline network recording privacy projections
        run: python3 -m unittest discover -s scripts/operator/tests -p test_anonymize_network_recording.py

  postgres-suites:
    name: database suites against a real PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Every database this job creates and then requires a suite to have used.
    # "Create one database per suite" and "Refuse a run that executed nothing"
    # both read this one list, so a database added for a new suite is guarded
    # the moment it is created. When the two lists were spelled out separately,
    # `admission_test_pipeline`, `admission_test_pipeline_http` and
    # `admission_test_unbound_reaper` were created but never checked.
    #
    # This is the only job-wide variable, and it is safe as one because no
    # suite reads it. The `reward_test_*` databases are not listed: each of
    # their steps proves its own run by querying the rows it must have written.
    env:
      PG_SUITE_DATABASES: >-
        admission_test_onboarding
        admission_test_ledger
        admission_test_account_ledger
        admission_test_account_trust_external
        admission_test_migration
        admission_test_ingest
        admission_test_invite
        admission_test_merge
        admission_test_rls
        admission_test_store
        admission_test_tokens
        admission_test_account_trust
        admission_test_account_trust_growth
        admission_test_upload_trust_plan_ci
        admission_test_upload_trust_scheduler_ci
        admission_test_upload_trust_upgrade_ci
        admission_test_account_trust_live
        admission_test_account_trust_route
        admission_test_witness_evidence
        admission_test_source_sessions
        admission_test_upload_ownership
        admission_test_credit_hold_ownership
        admission_test_activity_missions
        admission_test_model_training_consent
        admission_test_inference_connection
        admission_test_inference_connection_route
        admission_test_payout_rails
        admission_test_payout_pass
        admission_test_referral_rewards
        admission_test_referral_codes
        admission_test_referral_bonus
        admission_test_walletv2
        admission_test_legacy_invite_link
        admission_test_device_invite_subject
        admission_test_pipeline
        admission_test_pipeline_http
        admission_test_pipeline_compat
        admission_test_pipeline_parity
        admission_test_unbound_reaper
        admission_test_starter
        pipeline_test_upgrade
    # The tests in this repository that touch PostgreSQL do not run anywhere.
    # Each skips or is `#[ignore]`d without an environment variable, no job sets
    # one, and `cargo test` therefore reports them as passing or ignored while
    # running nothing.
    #
    # That is not theoretical. On 2026-09-08 three defects were found by hand in
    # one day, each behind one of these suites, each live on main:
    #
    #   #723  V61's constraint drop matched rendered SQL, dropped nothing, and
    #         reported success -- wallet provisioning could not insert a row.
    #   #727  one fixture wired the runtime pool and the login-resolver pool to
    #         a single role, so no returning contributor was ever recognised.
    #   #735  the only end-to-end test of an invite-free contribution had been
    #         failing since V61 added columns its fixture did not write.
    #
    # Each would have failed at the commit that introduced it if this job had
    # existed.
    #
    # `trace_corpus_pg_store` used to be excluded here for one test,
    # `pg_store_list_dedup_signals_round_trips_the_stamp`, which wanted a
    # gate-driver role the fixtures did not provision (#751). It runs below
    # now. The resolution is worth keeping, because the obvious fix was wrong:
    # the pool configures fine from TRACE_COMMONS_GATE_DRIVER_DATABASE_URL, and
    # pointing it at this job's own URL turns the test green -- but that URL is
    # the container superuser, which satisfies every column privilege, so the
    # V45/V47/V48 column grants the test exists to check go unexercised. With
    # `SELECT (dedup_signal_version)` revoked, the real `trace_gate_driver`
    # role fails with "permission denied for table trace_gate_decisions" and a
    # superuser pool passes in 0.14s.
    #
    # So the suite provisions the real role itself and refuses a privileged
    # one, and this job sets no gate-driver variable at all. Two more tests in
    # that suite skipped on the same unset variable and now run.
    #
    # Four suites used to be excluded here, at 84 failing between them, recorded
    # as pre-existing debt. Eighty-three of those 84 were a single defect in the
    # code, not stale fixtures: the migration runner took no lock, and every one
    # of these suites migrates in each test while libtest runs them in parallel,
    # so they raced each other into a system-catalog duplicate-key error. #750
    # fixed the runner and none of the four suites needed editing.
    #
    # The lesson worth keeping: a suite failing N ways with ONE error message is
    # one bug, however long it has been failing. `--test-threads=1` is the cheap
    # confirmation -- if the failures vanish, they were never N failures.
    #
    # And one that is excluded for a different and more interesting reason:
    #
    #   onboarding_retention_pg   passes on PostgreSQL 14, fails on 16
    #
    # That one is not stale test debt. It asserts a privilege boundary -- that
    # the role which runs the migration ends up WITHOUT membership of the roles
    # owning the security-definer functions -- and PostgreSQL 16's reworked
    # role membership means it keeps them. This job found that on its second
    # run; see #739. Remove the exclusion when the migration is fixed, not when
    # the test is adjusted.
    #
    # Fixing one means deleting its line here and adding a step, not editing an
    # allow-list elsewhere. Do not add a suite without running it first.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: postgres
          # These suites create their own login roles -- `tc_near_runtime`,
          # `trace_login_resolver`, `admission_ingest_runtime` -- and give them
          # no password, then connect as them by rewriting the username in the
          # URL. That is the shape they were written against, and it only works
          # where the server does not demand one. The container defaults to
          # scram-sha-256 and answers "password authentication failed for user
          # \"tc_near_runtime\"", which is what this job did on its first run.
          #
          # Trust auth is safe here and nowhere else: the server lives and dies
          # with the job, listens only on the runner's loopback, and holds
          # nothing but fixtures.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Several suites assert their database name begins `admission_test`
      # before running destructive fixtures, and every one of them requires the
      # host to be the literal 127.0.0.1 -- `localhost` fails the assertion. One
      # database each: they create roles and drop tables, and sharing one makes
      # a failure in the first look like a defect in the second.
      - name: Create one database per suite
        run: |
          set -euo pipefail
          for db in $PG_SUITE_DATABASES; do
            PGPASSWORD=trace createdb -h 127.0.0.1 -U trace "$db"
          done
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace reward_test_missions
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace reward_test_missions_upgrade
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace reward_test_participants
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace reward_test_participant_http
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace reward_test_mission_packages
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace reward_test_mission_http
      # The two versioned pipeline HTTP steps below withdraw through an
      # account session, which needs the login-resolver pool. The roles are
      # the ones the `ingest-bin-postgres` job creates, for the same reason
      # it gives there, and they are created here before any suite migrates:
      # V30 creates `trace_login_resolver` only if it is absent.
      - name: Create the login-resolver roles
        run: |
          set -euo pipefail
          PGPASSWORD=trace psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trace postgres <<'SQL'
          CREATE ROLE trace_login_resolver NOLOGIN NOBYPASSRLS;
          CREATE ROLE tc_login_resolver_login LOGIN NOBYPASSRLS;
          GRANT trace_login_resolver TO tc_login_resolver_login;
          SQL
      # Each step carries only the variables its own suite reads, NOT a job-wide
      # `env:` block (`PG_SUITE_DATABASES` above is job-wide only because no
      # suite reads it). That is not tidiness: `trace_invite_registry_pg` reads
      # `TRACE_COMMONS_PG_TEST_DATABASE_URL` as its own main URL, so setting
      # that variable job-wide for `migration_atomicity_pg` silently repoints
      # another suite at the wrong database.
      - name: account_onboarding_pg
        run: cargo test -p trace-commons-server --test account_onboarding_pg
        env:
          TRACE_COMMONS_NEAR_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_onboarding
      - name: account_trust_pg
        run: cargo test -p trace-commons-server --test account_trust_pg
        env:
          TRACE_COMMONS_ACCOUNT_TRUST_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_account_trust
      # Earned account trust (shadow): fact recording, the worker's
      # least-privilege roles and the one cross-tenant enumeration seam.
      - name: account_trust_growth_pg
        run: cargo test -p trace-commons-server --test account_trust_growth_pg
        env:
          TRACE_COMMONS_ACCOUNT_TRUST_GROWTH_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_account_trust_growth
      - name: bounded upload-trust frontier query plans
        run: cargo test -p trace-commons-server --test upload_trust_frontier_plan_pg
        env:
          TRACE_COMMONS_UPLOAD_TRUST_PLAN_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_upload_trust_plan_ci
      - name: deployed upload-trust migration upgrade
        run: cargo test -p trace-commons-server --lib v137_invalidates_already_enabled_pre_migration_applied_generations_once -- --ignored --test-threads=1
        env:
          TRACE_COMMONS_UPLOAD_TRUST_PG_UPGRADE_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_upload_trust_upgrade_ci
      - name: independent upload-trust scheduler and least privilege
        run: cargo test -p trace-commons-ingest --lib client_upload_trust_scheduler_pg_tests -- --ignored --test-threads=1
        env:
          TRACE_COMMONS_CLIENT_UPLOAD_TRUST_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_upload_trust_scheduler_ci
      # NEAR AI starter advance, first slice (V131): write-once plausibility
      # features, the account read's filters, the ingest runtime's grants,
      # and the dry-run report over the earned-trust enumeration seam.
      - name: starter_plausibility_pg
        run: cargo test -p trace-commons-server --test starter_plausibility_pg
        env:
          TRACE_COMMONS_STARTER_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_starter
      # Earned account trust, live (V126): the attested_submission fact, the
      # guard's witness column grants, and a tiered-v1 admission policy whose
      # applied evaluation raises the allowance and falls back to the base
      # when stale or invalidated. Turns external growth on, which nothing
      # turns off, so it has a database of its own.
      - name: account_trust_live_pg
        run: cargo test -p trace-commons-server --test account_trust_live_pg
        env:
          TRACE_COMMONS_ACCOUNT_TRUST_LIVE_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_account_trust_live
      # V101: the unbound-account reaper, run as a login holding only
      # trace_unbound_account_reaper, with a control that a superuser-owned
      # function would fail.
      - name: unbound_account_reaper_pg
        run: cargo test -p trace-commons-server --test unbound_account_reaper_pg
        env:
          TRACE_COMMONS_UNBOUND_REAPER_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_unbound_reaper
      - name: account invite HTTP session and authority guards
        run: cargo test -p trace-commons-ingest --lib account_invite_route_requires_session_and_rejects_cross_site_cookie -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_account_trust_route
      # V81: the legacy invite -> NEAR account link function, run as a login
      # holding only trace_account_invite_runtime, and readiness under
      # coexistence. One sequential test, because readiness is fleet-wide.
      - name: legacy_invite_link_pg
        run: cargo test -p trace-commons-server --test legacy_invite_link_pg
        env:
          TRACE_COMMONS_LEGACY_INVITE_LINK_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_legacy_invite_link
      # A device reading back its own invite subject hash from the issuer,
      # onboarded through the real /v1/onboard path, with the named refusals
      # against real rows. Feeds the legacy invite link statement.
      - name: device_invite_subject_pg
        run: cargo test -p trace-commons-server --test device_invite_subject_pg
        env:
          TRACE_COMMONS_DEVICE_INVITE_SUBJECT_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_device_invite_subject
      - name: inference_connection_pg
        run: cargo test -p trace-commons-server --test inference_connection_pg
        env:
          TRACE_COMMONS_INFERENCE_CONNECTION_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_inference_connection
      # V142: the referral tables. Forced RLS, one referrer per account, one
      # code index across tenants, the self-referral check, the resolver's
      # narrow cross-tenant read, append-only bonus and audit rows, and the
      # referral payout stream, each refusal checked as trace_ingest_runtime.
      - name: referral_rewards_pg
        run: cargo test --locked -p trace-commons-server --test referral_rewards_pg -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_referral_rewards
      # The referral code store: five live codes per account, the code index
      # across tenants, listing with referee counts and bonus totals, and
      # applying a code with every check of spec section 3 in order, the
      # refusal rate limit and the two-tenant apply, as a real LOGIN role
      # with the resolver role granted INHERIT FALSE.
      - name: referral_codes_pg
        run: cargo test --locked -p trace-commons-server --test referral_codes_pg -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_referral_codes
      # The referral bonus pass: a tenth of each referee credit written in the
      # referrer's tenant once, its window and reversals, the referrer-gone
      # void, the referral-stream holds, code scoring and suspension, the
      # dry_run trip, and voids taking back only unsent bonus, as
      # trace_ingest_runtime.
      - name: referral_bonus_pg
        run: cargo test --locked -p trace-commons-server --test referral_bonus_pg -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_referral_bonus
      # The payout rail tables (V132): forced RLS, the one-link-per-state and
      # one-pending-line indexes, NUMERIC(39,0) amounts, and the runtime,
      # enumerator and config-writer grants, each exercised as a real LOGIN
      # role the suite provisions, never this job's superuser.
      - name: payout_rails_pg
        run: cargo test -p trace-commons-server --test payout_rails_pg -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_payout_rails
      # The per-rail payout pass (payout spec sections 3, 4 and 7): exactly
      # once across a crash on the cumulative and the keyed rail, one rail's
      # stop or halt never reaching another, a credential refusal changing no
      # row, closing by reads, relinks and netting. Against a loopback mock of
      # cloud-api #1271 and the keyed test rail, as a real LOGIN role.
      - name: payout_pass_pg
        run: cargo test -p trace-commons-server --test payout_pass_pg -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_payout_pass
      - name: inference connection HTTP session selection
        run: cargo test -p trace-commons-ingest --lib inference_connection_requires_explicit_account_session_selection -- --test-threads=1
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_inference_connection_route
      - name: migration_atomicity_pg
        run: cargo test -p trace-commons-server --test migration_atomicity_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_migration
      - name: trace_invite_registry_pg
        run: cargo test -p trace-commons-server --test trace_invite_registry_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_invite
      - name: account_merge_pg
        run: cargo test -p trace-commons-server --test account_merge_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_merge
      # This suite used to have a skip INSIDE its tests, not just around them.
      # Every raw-SQL RLS assertion detected a connecting role that bypasses
      # RLS and returned early, and `trace` here is the container superuser, so
      # on every run they all did -- seven of them, not the one #752 opened
      # with -- while the suite reported `32 passed; 0 failed`. The xact_commit
      # guard below cannot see it: the suite runs and commits normally, it just
      # declines to make those assertions.
      #
      # The suite now provisions `trace_rls_assertion_runtime` for itself after
      # the migrations have run -- NOBYPASSRLS, NOINHERIT, owning nothing --
      # and connects as it for those assertions. A bypassing role fails them
      # instead of skipping them. Closes #752.
      #
      # The URL still names `trace` on purpose: the migrations need an owner,
      # and it is the assertions, not the suite, that change roles.
      - name: trace_corpus_pg_rls
        run: cargo test -p trace-commons-server --test trace_corpus_pg_rls
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_rls
      # Nothing above proves the suite took that path. The role is created the
      # first time it does, and nowhere else, so the role existing is the
      # evidence that it did -- the same argument as the xact_commit guard, one
      # level further in. A refactor that quietly goes back to asserting over
      # the admin connection fails here rather than going green.
      - name: Refuse an RLS run that never left the superuser
        run: |
          set -euo pipefail
          found=$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace postgres \
                    -c "SELECT COUNT(*) FROM pg_roles WHERE rolname='trace_rls_assertion_runtime';")
          echo "trace_rls_assertion_runtime present: ${found:-0}"
          if [ "${found:-0}" != "1" ]; then
            echo "::error::trace_corpus_pg_rls never connected as its NOBYPASSRLS role; its raw-SQL assertions did not run"
            exit 1
          fi
      # No TRACE_COMMONS_GATE_DRIVER_DATABASE_URL here on purpose: this suite
      # builds that URL itself by rewriting the username to `trace_gate_driver`
      # and asserts the role it reaches is not a superuser and holds no
      # table-wide SELECT on trace_gate_decisions. Setting the variable to this
      # job's own URL is precisely the vacuous pass #751 resolved.
      - name: synthetic token qualification matrix
        run: python3 -m unittest discover -s scripts/token-distributions
      - name: token bundle durability and withdrawal
        run: cargo test --locked -p trace-commons-server --test token_bundle_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_tokens
      - name: token bundle HTTP lost-response recovery
        run: cargo test --locked -p trace-commons-ingest --lib token_bundle_http_journey
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_tokens
          TRACE_COMMONS_BUNDLE_SERVER_ID: journey-server
      - name: trace_corpus_pg_store
        run: cargo test -p trace-commons-server --test trace_corpus_pg_store
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_store
      # V76 witness evidence: forced tenant RLS, the runtime role's column
      # grants, the owner-proof immutability trigger, and quarantine
      # remediation replacing a submission's evidence. Self-skips without a
      # URL, so the no-activity guard below covers it.
      - name: witness_evidence_pg
        run: cargo test -p trace-commons-server --test witness_evidence_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_witness_evidence
      # Source-session withdrawal: account-scoped tombstones, merge carry-over,
      # terminal-status no-ops for retention, and a least-privilege claim role.
      - name: trace_session_withdrawal_pg
        run: cargo test -p trace-commons-server --test trace_session_withdrawal_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_source_sessions
      - name: upload_principal_ownership_pg
        run: cargo test -p trace-commons-server --test upload_principal_ownership_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_upload_ownership
      - name: credit_hold_ownership_pg
        run: cargo test -p trace-commons-server --lib credit_hold_ownership::tests
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_credit_hold_ownership
      # Activity progress uses the owner URL only to migrate and seed fixtures.
      # Its account-history SELECT grants stay in this fresh test database;
      # the reader SET ROLEs to trace_ingest_runtime and asserts NOBYPASSRLS,
      # no superuser privileges, and no rows without tenant context.
      - name: activity_missions_pg
        run: cargo test --locked -p trace-commons-server --test activity_missions_pg -- --nocapture
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_activity_missions
      # V141: the model-training grant's eligibility read, add-only write and
      # withheld-award lookup, run as trace_ingest_runtime (NOBYPASSRLS) on
      # the migration's own grants.
      - name: model_training_consent_pg
        run: cargo test --locked -p trace-commons-server --test model_training_consent_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_model_training_consent
      # The R1 measurement script (scripts/operator/r1-pipeline-measurement.sql)
      # run through the real psql against a current and a pre-V76 schema. The
      # suite creates and drops databases of its own, so the xact_commit guard
      # below cannot see it; the greps refuse a run that skipped.
      - name: r1_pipeline_measurement
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --test r1_pipeline_measurement -- --nocapture 2>&1 | tee r1-measurement.log
          if grep -q '^skipping:' r1-measurement.log; then
            echo "r1_pipeline_measurement skipped its PostgreSQL tests" >&2
            exit 1
          fi
          grep -q 'test result: ok. 6 passed; 0 failed' r1-measurement.log
        env:
          TRACE_COMMONS_R1_MEASUREMENT_PG_TEST_URL: postgres://trace@127.0.0.1:5432/postgres
      # The legacy invite counts query, through the real psql, on a current
      # schema and one stopped at V80. Like r1 it creates its own databases,
      # so it is held to "did not skip" here rather than by xact_commit.
      - name: legacy_invite_counts
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --test legacy_invite_counts -- --nocapture 2>&1 | tee legacy-invite-counts.log
          if grep -q '^skipping:' legacy-invite-counts.log; then
            echo "legacy_invite_counts skipped its PostgreSQL tests" >&2
            exit 1
          fi
          grep -q 'test result: ok. 5 passed; 0 failed' legacy-invite-counts.log
        env:
          TRACE_COMMONS_LEGACY_INVITE_COUNTS_PG_TEST_URL: postgres://trace@127.0.0.1:5432/postgres
      - name: versioned pipeline storage upgrade
        run: cargo test -p trace-commons-server --lib pipeline_upgrade -- --ignored
        env:
          TRACE_COMMONS_PIPELINE_PG_UPGRADE_TEST_URL: postgres://trace@127.0.0.1:5432/pipeline_test_upgrade
      - name: versioned pipeline runtime
        run: cargo test -p trace-commons-server --test versioned_pipeline_runtime_pg
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_pipeline
      - name: Refuse a pipeline run that never used its NOBYPASSRLS role
        run: |
          set -euo pipefail
          found=$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace postgres \
                    -c "SELECT COUNT(*) FROM pg_roles WHERE rolname='trace_pipeline_runtime_test';")
          if [ "${found:-0}" != "1" ]; then
            echo "::error::versioned_pipeline_runtime_pg never provisioned its runtime role"
            exit 1
          fi
      # Each of the three steps below runs one named test in `<database>_pilot`,
      # a database each test process drops and creates beside the one its URL
      # names, so neither the xact_commit guard at the end of this job nor a
      # commit floor can prove the test ran (the harness setup alone commits
      # more than some of the tests do). A test name that matches nothing
      # passes with "0 passed", so each step requires its own "1 passed" line,
      # as the upgrade step requires its count.
      - name: versioned pipeline real HTTP
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --lib real_http_receipt_completes_and_resumes_after_restart 2>&1 | tee pipeline-real-http.log
          grep -q 'test result: ok. 1 passed; 0 failed' pipeline-real-http.log
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_pipeline_http
      - name: versioned pipeline compatibility through HTTP
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --lib compatibility_bundle_through_http_with_review_privacy_withdrawal_and_export 2>&1 | tee pipeline-compat.log
          grep -q 'test result: ok. 1 passed; 0 failed' pipeline-compat.log
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_pipeline_compat
          TRACE_COMMONS_LOGIN_RESOLVER_DATABASE_URL: postgres://tc_login_resolver_login@127.0.0.1:5432/admission_test_pipeline_compat
      - name: versioned pipeline parity with legacy
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --lib legacy_and_pipeline_tenants_match_except_pinned_differences 2>&1 | tee pipeline-parity.log
          grep -q 'test result: ok. 1 passed; 0 failed' pipeline-parity.log
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_pipeline_parity
          TRACE_COMMONS_LOGIN_RESOLVER_DATABASE_URL: postgres://tc_login_resolver_login@127.0.0.1:5432/admission_test_pipeline_parity
      - name: mission and insight reward ledger
        # Reward suites report independently: a red ledger step used to abort
        # the job before the two published-mission steps ever ran, so their
        # first green was also their first execution. `!cancelled()` keeps a
        # real cancellation stopping the job while a failure no longer hides
        # the suites behind it.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --test mission_rewards_pg -- --ignored --test-threads=1
          # Prove the full migrator and ignored award workflows executed.
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_missions \
            -c 'SELECT count(*) > 0 FROM trace_reward_awards;')" = t
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_missions \
            -c "SELECT count(*) = 1 FROM _trace_commons_migrations WHERE version = 70 AND name = 'reward_history_pagination';")" = t
        env:
          TRACE_COMMONS_REWARDS_PG_TEST_URL: postgres://trace@127.0.0.1:5432/reward_test_missions
      - name: reward ledger upgrade preserves existing awards
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --lib reward_v69_upgrade -- --ignored
          # Fail if a renamed filter silently runs zero upgrade tests.
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_missions_upgrade \
            -c "SELECT count(*) = 1 FROM _trace_commons_migrations WHERE version = 70 AND name = 'reward_history_pagination';")" = t
          # The upgrade fixture creates at least two awards before upgrading.
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_missions_upgrade \
            -c 'SELECT count(*) >= 2 FROM trace_reward_awards;')" = t
        env:
          TRACE_COMMONS_REWARDS_PG_UPGRADE_TEST_URL: postgres://trace@127.0.0.1:5432/reward_test_missions_upgrade
      - name: participant reward ownership and capacity
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --test reward_participant_pg -- --ignored --test-threads=1
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_participants \
            -c 'SELECT count(*) > 0 FROM trace_reward_participant_reservations;')" = t
        env:
          TRACE_COMMONS_REWARDS_PG_TEST_URL: postgres://trace@127.0.0.1:5432/reward_test_participants
      - name: participant reward HTTP account sessions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --lib reward_participant_http_contract -- --ignored --test-threads=1
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_participant_http \
            -c 'SELECT count(*) > 0 FROM trace_reward_participant_reservations;')" = t
        env:
          TRACE_COMMONS_REWARDS_PG_TEST_URL: postgres://trace@127.0.0.1:5432/reward_test_participant_http
      - name: published mission authorization and catalog
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --test mission_publication_pg -- --ignored --test-threads=1
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_mission_packages \
            -c 'SELECT count(*) > 0 FROM trace_reward_mission_packages;')" = t
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_mission_packages \
            -c "SELECT count(*) = 1 FROM _trace_commons_migrations WHERE version = 72 AND name = 'published_mission_packages';")" = t
        env:
          TRACE_COMMONS_REWARDS_PG_TEST_URL: postgres://trace@127.0.0.1:5432/reward_test_mission_packages
      - name: published mission HTTP contract
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --lib public_mission_catalog_http_is_bounded_anonymous_and_side_effect_free -- --ignored --test-threads=1
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_mission_http \
            -c 'SELECT count(*) = 2 FROM trace_reward_mission_packages;')" = t
          test "$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace reward_test_mission_http \
            -c 'SELECT count(*) = 0 FROM trace_reward_reservations;')" = t
        env:
          TRACE_COMMONS_REWARDS_PG_TEST_URL: postgres://trace@127.0.0.1:5432/reward_test_mission_http
      # `--ignored` is not optional for these three. Without it they report
      # `ignored`, the step passes having run nothing, and this job becomes the
      # thing it was built to replace.
      - name: admission_ledger_pg
        run: cargo test -p trace-commons-server --test admission_ledger_pg -- --ignored
        env:
          TRACE_COMMONS_ADMISSION_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_ledger
          TRACE_COMMONS_ACCOUNT_ADMISSION_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_account_ledger
      - name: account_trust_external_pg
        run: cargo test -p trace-commons-server --test account_trust_external_pg -- --ignored --test-threads=1
        env:
          TRACE_COMMONS_ACCOUNT_ADMISSION_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_account_trust_external
      - name: the invite-free path, end to end
        run: cargo test -p trace-commons-ingest --lib admission_pg_tests -- --ignored
        env:
          TRACE_COMMONS_ADMISSION_INGEST_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_ingest
      # Selected by module name, like the step above. #836 shipped as two
      # halves that had never run against each other; without `--ignored` this
      # step passes having run neither.
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install Secret Service for native enrollment fixtures
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: the NEAR AI enrolment ceremony, both halves
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p trace-commons-ingest --lib nearai_ceremony_pg_tests -- --ignored
          '
        env:
          TRACE_COMMONS_ADMISSION_INGEST_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_ingest
      - name: wallet v2 signed completion against PostgreSQL
        run: cargo test -p trace-commons-ingest --lib wallet_v2_pg_tests -- --ignored
        env:
          TRACE_COMMONS_WALLET_V2_PG_TEST_URL: postgres://trace@127.0.0.1:5432/admission_test_walletv2
      # A suite that runs nothing passes, so the steps above cannot prove
      # themselves. `trace_invite_registry_pg` reports "21 passed" in 0.00s with
      # no database configured; a pass count is not evidence that anything ran.
      #
      # Connection statistics are. A suite that skipped never opened a
      # connection, so its database sits at xact_commit = 0 exactly as createdb
      # left it. Every suite above commits between roughly 19 and 340
      # transactions when it actually runs. A renamed variable, a dropped
      # `--ignored`, or a new early return therefore fails here rather than
      # going quietly green.
      - name: Refuse a run that executed nothing
        run: |
          set -euo pipefail
          fail=0
          for db in $PG_SUITE_DATABASES; do
            n=$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace postgres \
                  -c "SELECT xact_commit FROM pg_stat_database WHERE datname='$db';")
            echo "$db committed ${n:-0} transactions"
            if [ "${n:-0}" -lt 5 ]; then
              echo "::error::$db shows no activity; its suite skipped instead of running"
              fail=1
            fi
          done
          exit $fail

  ingest-bin-postgres:
    name: trace-commons-ingest tests, whole bin, against PostgreSQL
    # A required status check on `main`, matched by the `name:` above -- the
    # string branch protection lists. Renaming it drops it from the required
    # set until protection is updated to the new name, so change both
    # together.
    #
    # The ingest service's unit tests (the `trace-commons-ingest` library
    # crate's `ingest::app` module, which was the `trace-commons-ingest` bin
    # until the service moved into a library; the job keeps its name)
    # number well over a thousand,
    # and every PostgreSQL-backed one self-skips without
    # TRACE_COMMONS_PG_TEST_DATABASE_URL. `postgres-suites` above sets that
    # variable only for a handful of named slices, so most of them had never
    # run against PostgreSQL in CI. Run locally, the whole bin had 25 of them
    # failing deterministically -- stale fixtures, one real defect shared by
    # five, and one more found while repairing the rest. This job runs all
    # of them.
    #
    # No `if:` and no path filter, the same as `postgres-suites`: it runs on
    # every push to main, every pull request, and every merge-queue batch. A
    # required check that is skipped in the queue never reports there, and
    # the queue times the entry out instead of merging it.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: postgres
          # Same reason as `postgres-suites`: fixtures create password-less
          # login roles and connect as them, and the login-resolver URL below
          # names one. Trust auth is safe on a throwaway loopback server.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # One database, named `admission_test_*` on the literal host 127.0.0.1,
      # because fixtures assert both before running destructive cleanup.
      #
      # The login-resolver role is provisioned the way
      # docs/operator/login-resolver-role.md recommends: the privilege-bearing
      # base role exactly as V30 creates it (NOLOGIN NOBYPASSRLS -- V30 creates
      # it only if absent, so creating it first changes nothing), plus a
      # separate LOGIN role that is a member of it. Without the resolver URL,
      # about 74 account, passkey and login tests fail with
      # `redeem succeeds: left 400 right 303`, because the redeem path fails
      # closed when its resolver pool cannot connect.
      - name: Create the database and the login-resolver roles
        run: |
          set -euo pipefail
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace admission_test_ingest_bin
          PGPASSWORD=trace psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trace postgres <<'SQL'
          CREATE ROLE trace_login_resolver NOLOGIN NOBYPASSRLS;
          CREATE ROLE tc_login_resolver_login LOGIN NOBYPASSRLS;
          GRANT trace_login_resolver TO tc_login_resolver_login;
          SQL
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install a Secret Service provider for credential tests
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      # Single-threaded: the tests share the `tenant-a` fixture tenant and
      # clean it up at start and end, so in parallel they delete each other's
      # rows. Every other job that runs these tests runs them without a
      # database, where they return before touching anything.
      - name: trace-commons-ingest, every test, one thread
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p trace-commons-ingest --lib -- --test-threads=1
          '
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_ingest_bin
          TRACE_COMMONS_LOGIN_RESOLVER_DATABASE_URL: postgres://tc_login_resolver_login@127.0.0.1:5432/admission_test_ingest_bin
      # The same guard as `postgres-suites`: a pass count is not evidence that
      # anything reached the database. A renamed variable or a new early
      # return leaves xact_commit where createdb left it. A full run commits
      # tens of thousands of transactions; the floor is far below that and far
      # above what a skipping run could produce.
      #
      # The pipeline HTTP tests commit to `admission_test_ingest_bin_pilot`, a
      # database their harness creates beside this one, so it is held to its
      # own floor. Their harness setup alone commits about 550 transactions
      # there and the tests about 10,000 more; 2,000 is far above the first
      # and far below the second.
      - name: Refuse a run that executed nothing
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          fail=0
          for pair in admission_test_ingest_bin:1000 admission_test_ingest_bin_pilot:2000; do
            db=${pair%%:*}
            floor=${pair##*:}
            n=$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace postgres \
                  -c "SELECT xact_commit FROM pg_stat_database WHERE datname='$db';")
            echo "$db committed ${n:-0} transactions (floor $floor)"
            if [ "${n:-0}" -lt "$floor" ]; then
              echo "::error::$db shows no real activity; the PostgreSQL tests skipped instead of running"
              fail=1
            fi
          done
          exit $fail

  ingest-bin-postgres-near-ai-scorer:
    name: trace-commons-ingest tests, whole bin, near-ai-scorer, against PostgreSQL
    # Not a required status check. The production pipeline assembly's
    # usearch index, and the near-ai-scorer arm of its end-to-end test
    # (`production_assembly_serves_a_routed_tenant_end_to_end`), compile only
    # under `near-ai-scorer`, and that test needs PostgreSQL: without it the
    # test returns early and is reported as passed. `ingest-bin-postgres`
    # builds default features only, and `cargo check (near-ai-scorer)` has no
    # database, so before this job the usearch-backed path ran nowhere in CI
    # (PR #1295 review, Minor 4). Everything else is `ingest-bin-postgres`:
    # the same service, roles, single thread and xact_commit floors, on its
    # own database and cache. No network: the tests build no NEAR AI scorer
    # and load no fastembed model.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: postgres
          # Same reason as `ingest-bin-postgres`.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-ingest-bin-near-ai-scorer-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            pg-ingest-bin-near-ai-scorer-${{ runner.os }}-
      # The same database name rule and login-resolver roles as
      # `ingest-bin-postgres`.
      - name: Create the database and the login-resolver roles
        run: |
          set -euo pipefail
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace admission_test_ingest_bin_near_ai
          PGPASSWORD=trace psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trace postgres <<'SQL'
          CREATE ROLE trace_login_resolver NOLOGIN NOBYPASSRLS;
          CREATE ROLE tc_login_resolver_login LOGIN NOBYPASSRLS;
          GRANT trace_login_resolver TO tc_login_resolver_login;
          SQL
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install a Secret Service provider for credential tests
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      # The usearch pipeline index's own tests are in the library since the
      # assembly moved there. A filter that matches nothing passes with
      # "0 passed", so the step requires at least one.
      - name: production assembly lib tests (near-ai-scorer)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo test --locked -p trace-commons-server --features near-ai-scorer --lib versioned_pipeline_production 2>&1 | tee production-assembly-lib-tests.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' production-assembly-lib-tests.log
      - name: trace-commons-ingest, every test, one thread (near-ai-scorer)
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p trace-commons-ingest --features near-ai-scorer --lib -- --test-threads=1
          '
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_ingest_bin_near_ai
          TRACE_COMMONS_LOGIN_RESOLVER_DATABASE_URL: postgres://tc_login_resolver_login@127.0.0.1:5432/admission_test_ingest_bin_near_ai
      # The guard of `ingest-bin-postgres`, with the same floors: the
      # pipeline HTTP tests, the production assembly's end-to-end test among
      # them, commit to the `_pilot` database their harness creates.
      - name: Refuse a run that executed nothing
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          fail=0
          for pair in admission_test_ingest_bin_near_ai:1000 admission_test_ingest_bin_near_ai_pilot:2000; do
            db=${pair%%:*}
            floor=${pair##*:}
            n=$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace postgres \
                  -c "SELECT xact_commit FROM pg_stat_database WHERE datname='$db';")
            echo "$db committed ${n:-0} transactions (floor $floor)"
            if [ "${n:-0}" -lt "$floor" ]; then
              echo "::error::$db shows no real activity; the PostgreSQL tests skipped instead of running"
              fail=1
            fi
          done
          exit $fail
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  ingest-bin-postgres-near-ai-staging:
    name: trace-commons-ingest tests, whole bin, near-ai-staging, against PostgreSQL
    # Not a required status check. `near-ai-staging` compiles a different
    # ingest: the refusal of the wallet ceremony, NEAR AI sign-up without the
    # admission ledger, and the boot check that refuses a production NEAR AI
    # host compile only under the feature, and the account and bind suites
    # must admit a new NEAR AI login there with no invite (staging spec S12). Every other job builds
    # the ingest without it, so before this job none of that ran anywhere in
    # CI. Everything else is
    # `ingest-bin-postgres`: the same service, roles, single thread and
    # xact_commit floors, on its own database and cache.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: postgres
          # Same reason as `ingest-bin-postgres`.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pg-ingest-bin-near-ai-staging-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            pg-ingest-bin-near-ai-staging-${{ runner.os }}-
      # The same database name rule and login-resolver roles as
      # `ingest-bin-postgres`.
      - name: Create the database and the login-resolver roles
        run: |
          set -euo pipefail
          PGPASSWORD=trace createdb -h 127.0.0.1 -U trace admission_test_ingest_bin_staging
          PGPASSWORD=trace psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U trace postgres <<'SQL'
          CREATE ROLE trace_login_resolver NOLOGIN NOBYPASSRLS;
          CREATE ROLE tc_login_resolver_login LOGIN NOBYPASSRLS;
          GRANT trace_login_resolver TO tc_login_resolver_login;
          SQL
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install a Secret Service provider for credential tests
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      # The built binary refuses a NEAR AI host from the other channel at
      # boot. A filter that matches nothing passes with "0 passed", so the
      # step requires at least one.
      - name: ingest boot channel check (near-ai-staging)
        run: |
          set -euo pipefail
          cargo test --locked -p trace-commons-ingest --features near-ai-staging --test near_ai_host_coherence_boot 2>&1 | tee staging-boot-tests.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' staging-boot-tests.log
      - name: trace-commons-ingest, every test, one thread (near-ai-staging)
        run: |
          set -euo pipefail
          # bash, not sh: the run is piped to tee, and only pipefail keeps a
          # failing cargo from reading as tee's success.
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p trace-commons-ingest --features near-ai-staging --lib -- --test-threads=1 2>&1 | tee staging-lib-tests.log
          '
          # The tests that hold the staging rules must have run, not been
          # filtered or compiled out: open sign-up, sign-up and the first
          # upload without the admission ledger, and the wallet refusal.
          grep -q 'open_sign_up::a_new_near_ai_login_gets_an_account_with_no_invite ... ok' staging-lib-tests.log
          grep -q 'open_sign_up::a_staging_build_signs_up_without_the_admission_ledger ... ok' staging-lib-tests.log
          grep -q 'open_sign_up::a_staging_build_admits_the_first_upload_without_the_admission_ledger ... ok' staging-lib-tests.log
          grep -q 'a_staging_build_never_offers_wallet_provisioning ... ok' staging-lib-tests.log
        env:
          TRACE_COMMONS_PG_TEST_DATABASE_URL: postgres://trace@127.0.0.1:5432/admission_test_ingest_bin_staging
          TRACE_COMMONS_LOGIN_RESOLVER_DATABASE_URL: postgres://tc_login_resolver_login@127.0.0.1:5432/admission_test_ingest_bin_staging
      # The guard of `ingest-bin-postgres`, with the same floors.
      - name: Refuse a run that executed nothing
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          fail=0
          for pair in admission_test_ingest_bin_staging:1000 admission_test_ingest_bin_staging_pilot:2000; do
            db=${pair%%:*}
            floor=${pair##*:}
            n=$(PGPASSWORD=trace psql -qtA -h 127.0.0.1 -U trace postgres \
                  -c "SELECT xact_commit FROM pg_stat_database WHERE datname='$db';")
            echo "$db committed ${n:-0} transactions (floor $floor)"
            if [ "${n:-0}" -lt "$floor" ]; then
              echo "::error::$db shows no real activity; the PostgreSQL tests skipped instead of running"
              fail=1
            fi
          done
          exit $fail
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  pipeline-qualification:
    # Not a required status check (owner decision P4-D17): it runs on every
    # pull request and in the merge queue, and it blocks nothing until the
    # owner promotes it. `pipeline.py` starts its own digest-pinned
    # PostgreSQL container, so this job has no `services:` block.
    #
    # The run is signed with a throwaway check key that the job makes
    # itself (`pipeline.py keygen`, then `qualify --signing-key`), so that the
    # key writer and the signing step, which an unsigned run never reaches,
    # run on every pull request. The key is trusted nowhere: no trust store
    # holds its public key, and it is gone with the runner. It is written
    # under the runner's temp directory, outside the checkout (so the code
    # revision does not see it) and outside the paths the failure step
    # uploads.
    name: pipeline qualification and restore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-pipeline-qualification-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pipeline-qualification-
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pipeline tooling self-tests
        run: python3 scripts/operator/test_pipeline_tooling.py
      - name: pipeline check key (throwaway)
        run: |
          python3 scripts/operator/pipeline.py keygen \
            --output "${RUNNER_TEMP}/pipeline-ci-check-key/ci_check_key.der" \
            --key-id ci_check_key \
            --trusted-key-output "${RUNNER_TEMP}/pipeline-ci-check-key/ci_check_key.trusted.json"
      - name: pipeline qualify
        run: |
          python3 scripts/operator/pipeline.py qualify \
            --signing-key "${RUNNER_TEMP}/pipeline-ci-check-key/ci_check_key.der" \
            --signing-key-id ci_check_key
      - name: pipeline compare self-test
        run: python3 scripts/operator/pipeline.py compare --self-test
      # A failed run prints only its label and a log path on this runner.
      # Keep the run directories `pipeline.py` writes (`Run.create`:
      # `.local/pipeline/runs/<run id>/`) -- the protected step logs, results,
      # evidence, and reports -- so the failure can be read without
      # reproducing it. The encrypted `artifacts/` are left out: their key
      # only ever reached a child process. Every value in the rest comes from
      # the synthetic fixtures and test constants.
      - name: upload the pipeline run directories on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-qualification-runs
          path: |
            .local/pipeline/runs/
            !.local/pipeline/runs/*/artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  mark-assets-drift:
    name: mark assets match the generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The committed files under assets/mark exist so a checkout is usable
    # without running Rust first. This is what stops them being authoritative:
    # hand-committed artwork nobody could regenerate is how three solid squares
    # of #315FBA shipped as the Windows tiles.
    #
    # The MSIX tiles are checked here too, and that is the point of rendering
    # them in Rust. They used to be produced by CoreGraphics on a Mac, which
    # meant this ubuntu job could not regenerate them and so could not compare
    # them to anything -- the same hole the flat squares lived in. The .icns
    # still needs macOS and still regenerates inside the release job.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/mark/check-drift.sh
      # The renderer writes its own PNGs, including a hand-rolled deflate.
      # Checking that with the encoder's own assumptions proves very little, so
      # this decodes the output with the standard library's zlib -- a different
      # implementation by different people -- and compares it to the raw pixel
      # buffer. It is what caught a maximal-run length code being emitted at the
      # wrong bit width, which small tiles hide completely.
      - name: Verify the PNGs against an independent decoder
        run: |
          cargo run -q -p trace-commons-mark --example emit-verify -- "${RUNNER_TEMP}/mark-verify"
          python3 scripts/mark/verify-png.py "${RUNNER_TEMP}/mark-verify"

  opencode-pin-drift:
    name: opencode qualification pin agrees everywhere
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The OpenCode version is pinned in three places and they have to agree:
    # the reader refuses an export that does not declare it, the qualification
    # script refuses a binary that is not it, and the report says which version
    # the "do not enable the routing catalog" decision rests on.
    #
    # This is cheap and this is the one that matters day to day. The real
    # experiment needs macOS and an installed binary and lives in
    # opencode-qualification.yml; it cannot run on every pull request, and it
    # re-proves an unchanging fact about a pinned binary when it does. What
    # actually goes wrong is somebody bumping QUALIFIED_VERSION to accept a
    # newer export without re-running the experiment -- at which point the
    # catalog decision silently rests on evidence about a different release.
    # Bumping one of these three without the others is that mistake, and it is
    # detectable without a Mac.
    steps:
      - uses: actions/checkout@v6
      - name: Pins and empty catalog, with mutation regressions
        run: |
          python3 scripts/qualification/check-opencode-qualification.py
          python3 scripts/qualification/test-opencode-qualification.py

  cargo-clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      # Allow-list rationale: see
      # docs/superpowers/reports/2026-05-14-clippy-baseline.md. These five
      # style/perf lints are the only ones suppressed from the default
      # clippy gate; everything else fails the build under -D warnings.
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::type_complexity -A clippy::collapsible_if -A clippy::manual_option_as_slice -A clippy::useless_vec -A clippy::redundant_pattern_matching
      # The staging channel (`near-ai-staging`) compiles different values and
      # tests than the default build; lint that build too.
      - run: cargo clippy -p trace-commons-contributor -p trace-commons-contributor-ffi --all-targets --features trace-commons-contributor/near-ai-staging -- -D warnings -A clippy::type_complexity -A clippy::collapsible_if -A clippy::manual_option_as_slice -A clippy::useless_vec -A clippy::redundant_pattern_matching
      # The server and ingest under the same feature: the wallet refusal,
      # sign-up without the admission ledger and the boot channel check
      # compile only there.
      - run: cargo clippy -p trace-commons-server -p trace-commons-ingest --all-targets --features trace-commons-ingest/near-ai-staging -- -D warnings -A clippy::type_complexity -A clippy::collapsible_if -A clippy::manual_option_as_slice -A clippy::useless_vec -A clippy::redundant_pattern_matching
      # The signed pin-set verifier (`staging_pins`), which only the
      # attestation crate's own `near-ai-staging` feature compiles.
      - run: cargo clippy -p trace-commons-attestation --all-targets --features near-ai-staging -- -D warnings -A clippy::type_complexity -A clippy::collapsible_if -A clippy::manual_option_as_slice -A clippy::useless_vec -A clippy::redundant_pattern_matching
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  cargo-check-default:
    name: cargo check (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-default-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-default-
      # A manifest change must not silently re-resolve reviewed Git dependencies.
      - run: cargo check --locked -p trace-commons-server -p trace-commons-ingest --bins
      - run: cargo check --locked -p trace-commons-contributor
      - run: cargo check --locked -p trace-commons-contributor -p trace-commons-contributor-ffi --features trace-commons-contributor/near-ai-staging
      - run: cargo check --locked -p trace-commons-server -p trace-commons-ingest --bins --features trace-commons-ingest/near-ai-staging
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  cargo-check-permissive-standalone:
    name: cargo check (permissive crates, standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The MIT OR Apache-2.0 crates ship inside third-party agent harnesses,
      # which depend on them one at a time and enable none of this workspace's
      # optional features. Every other job here builds the workspace or the
      # server crate, and cargo unifies features across such a build, so a
      # permissive crate can come to depend on a feature-gated module without
      # anything noticing. #481 did exactly that: a default method on the
      # public PrivacyFilterAdapter trait took a type from a module gated
      # behind near-ai-privacy-filter, and `cargo build -p
      # trace-commons-protocol` stopped compiling for an outside consumer
      # while all sixteen jobs stayed green. See #485 and #486.
      #
      # --no-default-features is the point: it is the configuration an
      # external consumer gets, and the one nothing else here exercises.
      - run: cargo check -p trace-commons-protocol --no-default-features
      - run: cargo check -p trace-commons-attestation --no-default-features
      - run: cargo check -p trace-commons-contributor --no-default-features
      - run: cargo check -p trace-commons-contributor-sources --no-default-features
      - run: cargo check -p trace-commons-contributor-insights --no-default-features
      - run: cargo check -p trace-commons-contributor-platform --no-default-features
      - run: cargo check -p trace-commons-contributor-ffi --no-default-features
      - run: cargo check -p trace-commons-operator-client --no-default-features
      - run: cargo check -p trace-commons-mark --no-default-features
      - run: cargo check -p trace-commons-build-info --no-default-features

  cargo-check-local-gpu-models:
    name: cargo check (local-gpu-models, non-CUDA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-local-gpu-models-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-local-gpu-models-
      # local-gpu-models-cuda is intentionally not exercised here: it requires
      # the CUDA toolkit and a GPU runtime, and is operator-tested on GPU
      # hosts only.
      - run: cargo check -p trace-commons-server -p trace-commons-ingest --bins --features local-gpu-models
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  cargo-check-near-ai-scorer:
    name: cargo check (near-ai-scorer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-near-ai-scorer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-near-ai-scorer-
      # Exercises the NEAR AI Cloud scorer module on its own (no local-gpu-models)
      # so a regression in the HTTP-backed scoring path can't slip through under
      # cover of the transitive build the local-gpu-models job pulls in.
      - run: cargo check -p trace-commons-server -p trace-commons-ingest --bins --features near-ai-scorer
      - run: cargo test -p trace-commons-gate-enclave --features near-ai-scorer --lib perplexity_near_ai
      # Run it, do not merely check it.
      #
      # The rustls provider ambiguity that took the pilot down on 2026-09-01
      # compiled cleanly under every job in this file and panicked at startup.
      # A feature that changes what is LINKED rather than what COMPILES is
      # invisible to `cargo check`. `--tls-selfcheck` constructs the HTTPS
      # client, which is the exact call that panicked.
      - run: cargo build -p trace-commons-ingest --bin trace-commons-ingest --features near-ai-scorer
      - run: ./target/debug/trace-commons-ingest --tls-selfcheck
      # The production Google Cloud Storage client (`ProdGcsObjectClient`) is
      # behind `gcs-client`, which the pilot builds and no other job compiles.
      # Its unit tests pin how a fetch failure is classified: a 404 (with or
      # without a JSON error body) is an integrity failure the pipeline
      # charges, every other failure is transport (PR #1283 review, finding
      # 2). A filter that matches nothing passes with "0 passed", so the step
      # requires at least one.
      - name: gcs-client lib tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo test -p trace-commons-server --features gcs-client --lib trace_artifact_gcs 2>&1 | tee gcs-client-tests.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' gcs-client-tests.log
      # The config-status surface must not leak the bucket, KMS key, credential
      # or endpoint of a gcs provider. The test is behind `gcs-client` and its
      # name does not match the filter above, so no job selected it. It builds
      # state with no database (the remote store is `remote_disabled`), so a
      # pass is not vacuous; the step still requires at least one.
      - name: gcs-client config status test
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --features gcs-client --lib ingest::app::tests::admin_config_status_reports_gcs_provider_when_feature_enabled 2>&1 | tee gcs-client-config-status.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' gcs-client-config-status.log
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  cargo-check-near-attestation-collateral:
    name: cargo check (near-attestation-collateral)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-near-attestation-collateral-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-near-attestation-collateral-
      # The Intel DCAP collateral client behind `#[cfg(feature = ...)]` in
      # near_attestation/client.rs is the only code that fetches collateral in
      # production, and no other job compiles it. Without this job that cfg arm
      # rots silently and the first sign is a red attestation drill on a pilot
      # host. It also pulls reqwest 0.13 into the tree, which nothing else in
      # this workspace builds.
      - run: cargo check -p trace-commons-server -p trace-commons-ingest --bins --features near-attestation-collateral
      # Run it, do not merely check it.
      #
      # The rustls provider ambiguity that took the pilot down on 2026-09-01
      # compiled cleanly under every job in this file and panicked at startup.
      # A feature that changes what is LINKED rather than what COMPILES is
      # invisible to `cargo check`. `--tls-selfcheck` constructs the HTTPS
      # client, which is the exact call that panicked.
      - run: cargo build -p trace-commons-ingest --bin trace-commons-ingest --features near-attestation-collateral
      - run: ./target/debug/trace-commons-ingest --tls-selfcheck
      - run: cargo test -p trace-commons-server --features near-attestation-collateral --lib near_attestation
      # `--lib near_attestation` used to sweep the whole attestation module:
      # receipt, quote and measurement verification included. All three moved
      # to the permissive `trace-commons-attestation` crate, so that filter
      # silently stopped matching them -- the filter matched 45 before the
      # measurement move and 36 today, having already lost receipt and quote
      # -- while the job's name went on claiming otherwise. `cargo test
      # --workspace` still runs them, but not in the feature configuration
      # this job exists to cover. This restores that: the 48 that now live in
      # the permissive crate, built with the feature that
      # `near-attestation-collateral` forwards to.
      #
      # Every count here is measured by running the job's own command with
      # `-- --list`, never by grepping `#[test]`: client.rs carries a test
      # behind `#[cfg(not(feature = "near-attestation-collateral"))]`, which
      # this job excludes, so the source-attribute count is always one high.
      #
      # While the ingest service was compiled into the server library
      # (`ingest::app`), the server's `--lib near_attestation` filter also
      # swept the 11 ingest tests whose names contain it. They now live in
      # the `trace-commons-ingest` crate and dropped out of that step, so the
      # step below runs them there, under the same feature, which the ingest
      # crate forwards to the server. A filter that matches nothing passes
      # with "0 passed", so the step requires at least one. The counts above
      # predate both, so re-measure with `-- --list` before relying on them.
      - name: ingest near_attestation tests (near-attestation-collateral)
        run: |
          set -euo pipefail
          cargo test -p trace-commons-ingest --features near-attestation-collateral --lib near_attestation 2>&1 | tee ingest-near-attestation.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed; 0 failed' ingest-near-attestation.log
      - run: cargo test -p trace-commons-attestation --features collateral-client
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  msrv-floor:
    name: builds at the declared MSRV floor
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Every other job in this file uses dtolnay/rust-toolchain@stable, which
    # means none of them can see an MSRV regression: stable is always at or
    # above the floor, so a dependency that raises the floor compiles fine
    # everywhere here. The only pinned toolchains in this repository live in
    # release-contributor.yml and release-apps.yml, and those workflows run
    # ONLY on a tag push. That is not a gap in one job, it is structural: the
    # declared floor was documentation, and the first thing that could ever
    # check it was a release.
    #
    # It cost a release. On 2026-09-06 the contributor-v0.10.0 tag failed all
    # four of its build jobs in 95 seconds with "rustc 1.92.0 is not supported
    # by the following packages: ironclaw_common@0.4.2 requires rustc 1.96"
    # and thirteen siblings -- an unconditional git dependency on
    # ironwire_proxy had raised the floor days earlier, with main green the
    # whole time. This job makes that a failing pull request instead.
    #
    # The floor is never written down here. It is read from `cargo metadata`
    # by scripts/ci/msrv-floor.sh, because a literal "1.96" in this file would
    # be one more copy of the floor to forget -- the exact shape of the
    # original bug, which was three pins moving out of step.
    env:
      # The workflow-level -D warnings is deliberately dropped for this job.
      # The question here is "does this compile at the floor", and an older
      # rustc's lint set is not that question: a lint that fires only on the
      # floor toolchain would fail this job for a reason that has nothing to
      # do with MSRV, while the stable jobs above already own the warnings
      # gate. The release workflows do not set -D warnings either, so this
      # matches what a tag push actually builds.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      # A stable toolchain purely to run `cargo metadata`. The checks below
      # run under the derived floor toolchain, installed once it is known.
      - uses: dtolnay/rust-toolchain@stable
      - name: Derive the declared floor
        id: floor
        run: |
          set -euo pipefail
          GTK_MANIFEST=crates/trace-commons-contributor-gtk/Cargo.toml
          ROOT_FLOOR="$(scripts/ci/msrv-floor.sh print Cargo.toml)"
          GTK_FLOOR="$(scripts/ci/msrv-floor.sh print "$GTK_MANIFEST")"
          echo "root workspace floor: $ROOT_FLOOR"
          echo "gtk workspace floor:  $GTK_FLOOR"
          echo "root=$ROOT_FLOOR" >> "$GITHUB_OUTPUT"
          echo "gtk=$GTK_FLOOR" >> "$GITHUB_OUTPUT"
      # Cheap first, because it produces the better message. This names the
      # offending crates from metadata alone -- no toolchain, no compilation --
      # so the log says "a dependency raised the MSRV floor" and lists them,
      # rather than leaving someone to decode a rustc error at the bottom of a
      # build. The compile steps below are what catch the other half: a
      # dependency that declares no rust-version at all and simply uses newer
      # syntax.
      - name: Audit the root workspace's resolved graph
        run: scripts/ci/msrv-floor.sh audit Cargo.toml
      # crates/trace-commons-contributor-gtk is a SEPARATE cargo workspace with
      # its own lockfile, so the audit above does not cover a line of it, and
      # neither would a root `--workspace` check. It also tracks its floor by
      # hand (it cannot inherit workspace.package), so this catches the two
      # floors drifting apart as well as a dependency raising either one.
      - name: Audit the GTK workspace's resolved graph
        run: scripts/ci/msrv-floor.sh audit crates/trace-commons-contributor-gtk/Cargo.toml
      # The flatpak build is network-sandboxed and bundles a pinned rust
      # tarball, so it cannot rustup its way out of a stale pin.
      # release-apps.yml checks this too -- on a tag push, which is the whole
      # problem. Its copy is deliberately left in place: that job installs no
      # rust toolchain, so pointing it at this script would make a release
      # depend on the runner image shipping cargo. Two implementations of one
      # rule, but this one runs first and the release one is the backstop.
      - name: Check the flatpak manifest's pinned toolchain against the floor
        run: |
          scripts/ci/msrv-floor.sh flatpak \
            crates/trace-commons-contributor-gtk/Cargo.toml \
            crates/trace-commons-contributor-gtk/flatpak/ai.tracecommons.Contributor.yml
      - name: Install the floor toolchain(s)
        run: |
          set -euo pipefail
          for v in "${{ steps.floor.outputs.root }}" "${{ steps.floor.outputs.gtk }}"; do
            rustup toolchain install "$v" --profile minimal --no-self-update
          done
          rustup toolchain list
      # Not a bare `apt-get update`: the runner image ships vendor apt
      # repositories this project never installs from, and one bad vendor
      # index fails the job before it compiles anything. The action removes
      # them, asserts none remain, and fails loudly if Ubuntu's own archive
      # is what is broken. A red check here that mentions apt is an
      # infrastructure failure, not an MSRV or GTK regression.
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install GTK dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libnotify-dev
      # `check`, not `build`. The failure this job exists to catch is raised by
      # cargo's resolver and by rustc's front end, both of which run under
      # `check`; codegen adds minutes and no signal. The scope is exactly what
      # the release workflows pin a toolchain for -- the contributor CLI, the C
      # ABI dylib the macOS and Windows shells link, and the GTK shell -- not
      # the whole workspace, because the server is not something an outsider
      # builds from source and is not what the floor promises.
      - name: Check the contributor CLI at the floor
        run: cargo "+${{ steps.floor.outputs.root }}" check --locked -p trace-commons-contributor --bins
      - name: Check the contributor FFI at the floor
        run: cargo "+${{ steps.floor.outputs.root }}" check --locked -p trace-commons-contributor-ffi --lib
      - name: Check the GTK shell at the floor
        run: |
          cargo "+${{ steps.floor.outputs.gtk }}" check --locked \
            --manifest-path crates/trace-commons-contributor-gtk/Cargo.toml --bins

  cargo-test-default:
    name: cargo test (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Verify native wallet browser state transitions
        run: node scripts/ci/test-near-wallet-browser.cjs
      - name: Verify the browser step-up page script
        run: node scripts/ci/test-step-up-page.cjs
      - uses: dtolnay/rust-toolchain@stable
      - id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-default-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-default-
      # Whole workspace, not a hand-maintained crate list. Naming crates
      # individually meant trace-commons-protocol (45 tests, including the
      # redaction and secret-detection suites) and trace-commons-operator-client
      # (41 tests) were never executed by CI at all, and a new crate joins the
      # workspace untested by default.
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install a Secret Service provider for credential tests
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11
      - name: Install the pinned wallet browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/trace-commons-wallet-ci" \
            --ignore-scripts --omit=optional --no-audit --no-fund --save-exact \
            playwright@1.63.0 playwright-core@1.63.0
          node "$RUNNER_TEMP/trace-commons-wallet-ci/node_modules/playwright/cli.js" \
            install --with-deps chromium
      - name: Run workspace tests with Secret Service
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --workspace
          '
      # The staging channel's half of the channel checks: its host and
      # identity scan, the production deny-list digests, its refusals of
      # production hosts, its entitlements, its IronWire key gate and its
      # refusal of a state directory override naming production's directory
      # (`config::tests::` and `channel_hosts`), with the preflight suite run
      # as staging; its URL scheme, its own IronWire home with no production
      # pointer and no declared production folder or port, its --version
      # channel, its window label (`a_staging_channel_shows_the_label`, and
      # the FFI `build_channel` suite, whose label check is the staging half
      # of a test the default build runs as production), the FFI suite as
      # staging, the daemon's signed pin source (`proof_attestor`, the status
      # pin label and its reconcile twin), the attestation crate's signed
      # pin-set verifier, whose unit tests no other crate's run reaches, and
      # the server's pin re-sign tool (`trace-commons-staging-pins`), which
      # requires the feature. None of them is compiled into the default build
      # above.
      - name: Staging channel tests
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked -p trace-commons-contributor --features near-ai-staging --test channel_hosts --test credential_store_isolation --test preflight --test version_channel
            cargo test --locked -p trace-commons-contributor --features near-ai-staging --lib -- other_channel the_config_dir_help the_default_inbox private_inference config::tests:: deep_link invite_tests ironwire_pointer discover ironwire_folder a_staging_probe_of a_staging_channel_shows_the_label proof_attestor pin_refusal reconcile_never_fetches_the_signed_pins
            cargo test --locked -p trace-commons-contributor-ffi --features trace-commons-contributor/near-ai-staging --test abi --test build_channel
            cargo test --locked -p trace-commons-attestation --features near-ai-staging
            cargo test --locked -p trace-commons-server --features near-ai-staging --bin trace-commons-staging-pins --test staging_pins_tool
          '
      - name: Verify real Secret Service storage
        run: |
          dbus-run-session -- sh -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p trace-commons-contributor-platform --lib real_os_round_trip_removes_only_its_synthetic_entry -- --ignored
            cargo test -p trace-commons-contributor-platform --lib real_commons_os_round_trip -- --ignored
          '
      - name: Verify the real wallet SDK and production CSP
        run: |
          export TC_PLAYWRIGHT_MODULE="$RUNNER_TEMP/trace-commons-wallet-ci/node_modules/playwright"
          node scripts/ci/test-near-wallet-sdk.cjs
          cargo test --locked -p trace-commons-contributor --lib \
            near_wallet_page::tests::pinned_wallet_controls_obey_production_csp \
            -- --ignored --test-threads=1
      # Last, so every step above still has its binaries; see the action for
      # what is removed and why, and for why only a push to main saves.
      - uses: ./.github/actions/trim-cargo-cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  preserve-order-guard:
    name: serde_json preserve_order guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # The end-to-end proof for crates/trace-commons-protocol/src/canonical_json.rs,
      # narrowed to the one build graph that still needs it.
      #
      # `dcap-qvl`'s mandatory `std` feature depends on
      # `serde_json/preserve_order`, so every graph containing it -- the whole
      # workspace, and anything reaching trace-commons-server, which includes
      # trace-commons-contributor through its cfg(not(windows)) dev-dependency
      # -- already resolves `serde_json::Map` to an insertion-ordered IndexMap.
      # In those graphs the ordinary `cargo test --workspace` is the proof:
      # measured by deleting the sort from `canonicalize`, that run goes red on
      # four canonical_json tests, the NEAR settle idempotency key and the
      # pinned envelope digest. Forcing the feature on there would be a no-op,
      # and the job's old expectation -- that exactly the guard test fails --
      # is now inverted, since the guard no longer fails under preserve_order.
      #
      # `cargo test -p trace-commons-protocol` is the exception: nothing in
      # that graph pulls dcap-qvl, so its map is a BTreeMap and sorting it is
      # unobservable. Measured the same way, the mutation above leaves that
      # run entirely green. That is also the graph a third-party harness gets,
      # since the protocol crate ships inside permissive clients without the
      # server. So this job forces the feature on and requires the protocol
      # crate's suite to pass unchanged.
      #
      # A green run here is the statement "a consumer of trace-commons-protocol
      # may turn preserve_order on and no digest moves". Do not weaken it to
      # compiling the module, and do not re-broaden it to the workspace: the
      # workspace already runs under preserve_order, so a second run proves
      # nothing this does not.
      - name: Force serde_json/preserve_order on
        run: |
          sed -i 's|^serde_json = "1"$|serde_json = { version = "1", features = ["preserve_order"] }|' \
            crates/trace-commons-protocol/Cargo.toml
          grep -q 'preserve_order' crates/trace-commons-protocol/Cargo.toml
      - name: The protocol crate must hold its bytes under preserve_order
        run: cargo test -p trace-commons-protocol

  pilot-bootstrap-smoke:
    name: pilot-bootstrap smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      # Build the smoke binary (and trace-commons-ingest, from its own crate,
      # which depends on the server library, so most artifacts are reused).
      # The smoke harness asserts the binary exists at
      # target/release/trace-commons-pilot-bootstrap.
      - name: Build pilot-bootstrap binary
        run: cargo build --release -p trace-commons-server -p trace-commons-ingest --bin trace-commons-pilot-bootstrap --bin trace-commons-ingest
      # Runs scripts/operator/pilot-bootstrap-smoke.sh against the checked-in
      # JSONL fixture under scripts/operator/fixtures/swival-smoke/. The smoke
      # uses a Python stdlib mock for both HF Hub and the trace-commons-ingest
      # /v1/traces endpoint, so no Postgres or HF network access is needed.
      # Success line is `SmokePilotBootstrapOK: ...`; any failure exits non-zero
      # with a `SmokePilotBootstrapFailure:<label>` diagnostic.
      - name: Run pilot-bootstrap smoke
        run: bash scripts/operator/pilot-bootstrap-smoke.sh
      # The corpus builder is the surface #204 was filed against: it built the
      # novel and duplicate slices from different source populations, so a
      # no-model measure classified the corpus the bake-off then selected a
      # model on. These stdlib-only self-tests cover the same-source pair
      # construction and the length band that keeps a truncating paraphraser
      # from reintroducing the confound. They gated nothing before.
      - name: Run corpus-builder self-tests
        run: python3 scripts/operator/test_build_agent_traces_corpus.py

  operator-binaries-smoke:
    name: operator-binaries smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Builds and exercises the four operator CLIs (review, admin, worker,
      # tenant), confirming --version + --help + per-binary subcommand counts.
      # See docs/operator/operator-binaries.md.
      - name: Run operator-binaries smoke
        run: bash scripts/operator/operator-smoke.sh

  # scripts/check-aasa.sh, the smoke test for the apple-app-site-association
  # file (Z2 S4 of #1118), against local stand-ins for the origin and Apple's
  # CDN. The file itself is built and served by
  # TraceCommons/trace-commons-community. Not a required check.
  check-aasa-script:
    name: check-aasa.sh tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # Node 24, the current LTS. curl and jq are on the image.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/ci/test-check-aasa.mjs

  privacy-filter-shim-tests:
    name: privacy-filter shim tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Only the web layer, deliberately. The shim's contract tests stub the
      # model, so this job needs neither torch nor 3 GB of weights, and stays
      # a fast gate rather than an occasionally-skipped one.
      - name: Install shim test dependencies
        run: pip install fastapi==0.115.6 pydantic==2.10.4 httpx==0.28.1 pytest==8.3.4
      # These pin the span offset convention. If the shim ever emits byte
      # offsets where the Rust decoder expects codepoints, redaction lands on
      # the wrong characters, the PII survives, and the call reports success.
      # This job is the only thing standing behind that.
      - name: Run shim contract tests
        working-directory: deploy/pilot-gcp/privacy-filter
        run: python -m pytest test_app.py -v
