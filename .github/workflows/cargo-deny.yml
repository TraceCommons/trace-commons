# deny.toml has carried the AGPL-combinability licence allow list and the
# RUSTSEC advisory ignore list since the licence split, and CONTRIBUTING.md
# / AGENTS.md instruct contributors to run `cargo deny check licenses` by
# hand before pushing -- but nothing enforced it. This workflow does.
#
# Licences and sources run under `--all-features`, not under a list of
# named feature sets. A named list has to stay in step with every
# independently deployable graph, and it did not: the server declares
# gcs-client, gcp-kms, local-gpu-models-cuda and near-attestation-collateral
# beyond the three a first draft of this file checked, and production builds
# use them -- cloudbuild.yaml builds ingest with
# `--features gcs-client,gcp-kms,near-ai-scorer`, and deploy/pilot-gcp adds
# near-attestation-collateral. `--all-features` resolves 2,272 crates, a
# superset of every named graph (the largest, local-gpu-models-cuda, is
# 2,086), so one job covers each of them conservatively and cannot drift
# when a feature is added. Measured 2026-09-01: licences and sources pass on
# every graph individually and on the union.
#
# Advisories run on the default graph only, where `arguments: ''` overrides
# cargo-deny-action's own `--all-features` default. Advisories do NOT pass
# on the union: six RUSTSEC findings sit in optional trees, none triaged --
# rustls-pemfile under gcp-kms, hickory-proto under
# near-attestation-collateral, and crossbeam-epoch / lru / paste / fxhash
# under near-ai-scorer and local-gpu-models. See
# docs/superpowers/reports/2026-09-01-cargo-deny-all-features-advisories.md.
# Gating on them today would land a permanently red required check.
#
# `check bans` is omitted: [bans] sets only `multiple-versions = "allow"`
# and configures no deny/skip list, so the check is a standing no-op today.
#
# cargo-deny-action's v2 tag pins cargo-deny 0.20.2 in its own Dockerfile,
# the version these jobs were verified with locally.

name: cargo-deny

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. This repository uses stacked
  # PRs, and a `branches: [main]` filter here means a PR targeting another
  # branch gets no CI at all -- the work is only ever tested once it reaches
  # main, which is exactly when a failure is most expensive to unwind. A PR
  # should be tested against the branch it will actually merge into.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny-all-features:
    name: cargo deny licences and sources (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: info
          arguments: --all-features
          command-arguments: licenses sources

  cargo-deny-default-advisories:
    name: cargo deny advisories (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: info
          arguments: ''
          command-arguments: advisories
