name: local routing

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: routing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  routing:
    name: Imported routing conformance and scale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            imports/ironwire/target
          key: routing-${{ runner.os }}-${{ hashFiles('imports/ironwire/Cargo.lock') }}
      - run: cargo fmt --manifest-path imports/ironwire/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path imports/ironwire/Cargo.toml --workspace --all-features
      - run: cargo clippy --locked --manifest-path imports/ironwire/Cargo.toml --workspace --all-targets --all-features -- -D warnings
