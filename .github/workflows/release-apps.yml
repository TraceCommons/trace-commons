# One-time recovery: no tag movement, rebuild, or replacement of published assets.
name: recover v0.12.1 app publication
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: recover-v0.12.1-app-publication
  cancel-in-progress: false
jobs:
  version:
    name: verify existing release artifacts
    runs-on: ubuntu-latest
    outputs:
      short: 0.12.1
      build: '3501'
    steps:
    - name: Verify source commit and completed platform jobs
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ngh run view 34501588678 --repo TraceCommons/trace-commons --json headSha,jobs > source.json\n\
        python3 - <<'CHECK'\nimport json\nr=json.load(open('source.json'))\nassert r['headSha']=='cbb27dffeacf07d3d4216be62c9b9bb203a943ab'\n\
        for name in ['macOS signed DMG','Windows signed MSIX','Windows signed binaries','Linux flatpak']:\n    jobs=[j for\
        \ j in r['jobs'] if j['name']==name]\n    assert len(jobs)==1 and jobs[0]['conclusion']=='success', name\nprint('All\
        \ source platform jobs succeeded at the immutable release commit.')\nCHECK\ngh release view app-v0.12.1 --repo TraceCommons/trace-commons\
        \ >/dev/null\n"
  publish:
    name: publish release
    needs:
    - version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        pattern: macos-dmg
        run-id: '34501588678'
        github-token: ${{ github.token }}
    - name: Add missing verified macOS assets without replacing downloads
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        cd dist/macos-dmg

        shasum -a 256 -c TraceCommons-0.12.1.dmg.sha256

        gh release upload app-v0.12.1 TraceCommons-0.12.1.dmg TraceCommons-0.12.1.dmg.sha256 --repo TraceCommons/trace-commons

        '
    - name: Open a cask bump
      env:
        GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        SHORT_VERSION: ${{ needs.version.outputs.short }}
      run: "set -euo pipefail\nV=\"$SHORT_VERSION\"\n# No -arm64 suffix: the DMG is universal now. This reads the\n# checksum\
        \ THIS run's macOS job produced, out of the artifact\n# downloaded into dist/. It is the only source of a hash anywhere\n\
        # in this step.\nSHA=\"$(awk '{print $1}' dist/macos-dmg/TraceCommons-\"$V\".dmg.sha256)\"\n# Clone with the token\
        \ IN the remote URL. `gh repo clone` leaves a\n# plain HTTPS remote, and GH_TOKEN authenticates the gh CLI but NOT\n\
        # raw `git push` -- which failed on the first real release with\n# \"could not read Username for https://github.com\"\
        .\n#\n# --single-branch --depth 1 fetches the tap's DEFAULT branch and\n# nothing else. The bump branch is never fetched,\
        \ checked out or\n# read at any point. That is what makes a stale checksum\n# structurally impossible to carry across\
        \ a re-run: the branch is\n# rebuilt from the tap's default branch plus the $SHA computed\n# above, so no previous\
        \ attempt's bytes can survive into the push.\n# app-v0.4.7 is why that matters -- the tag was re-cut, the DMG was\n\
        # rebuilt, and the branch left behind by the first run named a hash\n# (5234e018...) that no longer matched the published\
        \ asset\n# (d60ce434...).\ngit clone --depth 1 --single-branch \\\n  \"https://x-access-token:${GH_TOKEN}@github.com/TraceCommons/homebrew-tap.git\"\
        \ tap\ncd tap\nBRANCH=\"bump-cask-$V\"\ngit switch -c \"$BRANCH\"\nsed -i \"s/^  version \\\".*\\\"/  version \\\"\
        $V\\\"/\" Casks/trace-commons.rb\n# Assert exactly one sha256 line before substituting: harmless\n# today with a single\
        \ hash, but a positional sed like the\n# formula's awk would be needed the moment the cask grows an\n# arch-conditional\
        \ pair, and a silent no-op substitution would\n# leave a stale hash paired with a bumped version.\nSHA256_LINES=\"\
        $(grep -c '^  sha256 \"' Casks/trace-commons.rb)\"\nif [ \"$SHA256_LINES\" != 1 ]; then\n  echo \"expected exactly\
        \ one sha256 line in Casks/trace-commons.rb, found $SHA256_LINES\" >&2\n  exit 1\nfi\nsed -i \"s/^  sha256 \\\".*\\\
        \"/  sha256 \\\"$SHA\\\"/\" Casks/trace-commons.rb\n# Prove the hash now in the file is the one computed from this\n\
        # run's DMG. Everything up to here is a hard failure by design: it\n# runs before anything has been pushed, so refusing\
        \ costs a\n# package-manager bump, not a published release.\nif ! grep -qF \"$SHA\" Casks/trace-commons.rb; then\n\
        \  echo \"cask bump did not apply the checksum computed from this run's DMG; refusing to push a stale hash\" >&2\n\
        \  exit 1\nfi\ngit config user.name \"trace-commons-release\"\ngit config user.email \"ops@tracecommons.ai\"\nif git\
        \ diff --quiet; then\n  echo \"the tap already carries version $V with $SHA; nothing to bump.\"\n  exit 0\nfi\ngit\
        \ commit -am \"trace-commons $V\"\n# --force, not a plain push. `bump-cask-$V` already exists whenever\n# a tag is\
        \ deleted and re-cut, and the plain push was rejected with\n# \"! [rejected] (fetch first)\", failing the whole publish\
        \ job on\n# app-v0.4.7 after every artifact had already published. Forcing is\n# only safe because of the clone above:\
        \ the branch being replaced\n# cannot have contributed a single byte to what is being pushed.\ngit push --force -u\
        \ origin \"$BRANCH\"\n# A re-run finds its own pull request already open, and `gh pr\n# create` exits non-zero on\
        \ a duplicate head. The force-push has\n# already updated that pull request's contents, so reuse it.\nPR_URL=\"$(gh\
        \ pr list --repo TraceCommons/homebrew-tap --head \"$BRANCH\" --state open --json url --jq '.[0].url // empty')\"\n\
        if [ -z \"$PR_URL\" ]; then\n  # `--repo` changes gh's base repository but does not tell it which\n  # remote branch\
        \ is the PR head. Without an explicit head, the real\n  # tag run aborts here even though the branch was pushed successfully.\n\
        \  PR_URL=\"$(gh pr create --fill --repo TraceCommons/homebrew-tap --head \"$BRANCH\")\"\nfi\necho \"cask bump: $PR_URL\"\
        \n# Deliberately NOT merged here. Auto-merge is disabled on\n# TraceCommons/homebrew-tap, the default branch carries\
        \ no branch\n# protection, and the tap has no CI at all -- so `--auto` would\n# fail outright and any fallback would\
        \ be an immediate, ungated\n# merge straight to what `brew upgrade` serves. That is the direct\n# push this step exists\
        \ to avoid, wearing a pull request as a\n# disguise.\n#\n# Automating the merge is wanted, but it needs something\
        \ to gate\n# on first: a cask/formula audit workflow on the tap, auto-merge\n# enabled, and that check required. Until\
        \ then the merge stays a\n# human step, and tap-bump-staleness.yml is what stops the queue\n# growing unnoticed the\
        \ way it did through 0.4.1-0.4.6.\necho \"::notice::cask bump open at $PR_URL -- merge it, or brew upgrade keeps serving\
        \ the previous version\"\n{\n  echo \"### cask bump ready to merge\"\n  echo\n  echo \"[$PR_URL]($PR_URL)\"\n  echo\n\
        \  echo \"Homebrew serves the previous version until this is merged.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
  publish-updates:
    name: publish update manifests
    needs:
    - version
    - publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: macos-26
    environment: release
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: cbb27dffeacf07d3d4216be62c9b9bb203a943ab
    - name: Resolve a real OpenSSL (not LibreSSL)
      run: "set -euo pipefail\nOPENSSL_DIR=\"$(brew --prefix openssl@3)/bin\"\nif [ ! -x \"$OPENSSL_DIR/openssl\" ]; then\n\
        \  echo \"openssl@3 not found via Homebrew at $OPENSSL_DIR -- refusing to sign with whatever /usr/bin/openssl resolves\
        \ to (LibreSSL on macOS runners).\" >&2\n  exit 1\nfi\nVERSION_STRING=\"$(\"$OPENSSL_DIR/openssl\" version)\"\ncase\
        \ \"$VERSION_STRING\" in\n  OpenSSL\\ *) ;;\n  *)\n    echo \"resolved binary at $OPENSSL_DIR/openssl is not OpenSSL:\
        \ $VERSION_STRING\" >&2\n    exit 1\n    ;;\nesac\necho \"using $VERSION_STRING at $OPENSSL_DIR/openssl\"\necho \"\
        $OPENSSL_DIR\" >> \"$GITHUB_PATH\"\n"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: dist
        pattern: '{macos-dmg,windows-zip}'
        run-id: '34501588678'
        github-token: ${{ github.token }}
    - name: Authenticate to GCP (workload identity federation; no key on the runner)
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_FLATPAK_PUBLISHER_SA }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - name: Fetch the signing keys from Secret Manager
      env:
        GCP_PROJECT: tracecommons-pilot-2026
      run: "set -euo pipefail\ngcloud secrets versions access latest \\\n  --secret=update-manifest-signing-key --project\
        \ \"$GCP_PROJECT\" \\\n  > \"$RUNNER_TEMP/update-signing.pem\"\nchmod 600 \"$RUNNER_TEMP/update-signing.pem\"\n"
    - name: Build the manifest from the platforms that actually succeeded
      env:
        SHORT_VERSION: ${{ needs.version.outputs.short }}
        MACOS_RESULT: success
        WINDOWS_RESULT: success
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\nV=\"$SHORT_VERSION\"\nBASE=\"https://github.com/$REPO/releases/download/app-v$V\"\nARGS=()\n\
        \nif [ \"$MACOS_RESULT\" = success ]; then\n  F=\"dist/macos-dmg/TraceCommons-$V.dmg\"\n  SHA=\"$(shasum -a 256 \"\
        $F\" | awk '{print $1}')\"\n  SIZE=\"$(wc -c < \"$F\" | tr -d ' ')\"\n  ARGS+=(--platform \"macos-universal=$BASE/TraceCommons-$V.dmg=$SHA=$SIZE\"\
        )\nfi\n\nif [ \"$WINDOWS_RESULT\" = success ]; then\n  F=\"dist/windows-zip/trace-commons-windows-x86_64-$V.zip\"\n\
        \  SHA=\"$(shasum -a 256 \"$F\" | awk '{print $1}')\"\n  SIZE=\"$(wc -c < \"$F\" | tr -d ' ')\"\n  ARGS+=(--platform\
        \ \"windows-x86_64=$BASE/trace-commons-windows-x86_64-$V.zip=$SHA=$SIZE\")\nfi\n\n# The CLI's own assets. These are\
        \ published on the contributor-v*\n# tag stream, not app-v*, and are downloaded here so their digests\n# come from\
        \ the bytes clients will actually receive rather than\n# from a value copied by hand.\nCLI_BASE=\"https://github.com/$REPO/releases/download/contributor-v$V\"\
        \nfor pair in \\\n  \"windows-x86_64-cli:trace-commons-contributor-x86_64-pc-windows-msvc.exe\" \\\n  \"linux-x86_64-cli:trace-commons-contributor-x86_64-unknown-linux-gnu\"\
        \ \\\n  \"macos-aarch64-cli:trace-commons-contributor-aarch64-apple-darwin\" \\\n  \"macos-x86_64-cli:trace-commons-contributor-x86_64-apple-darwin\"\
        \ndo\n  SLUG=\"${pair%%:*}\"\n  NAME=\"${pair#*:}\"\n  if curl -fsSL --proto '=https' --tlsv1.2 \"$CLI_BASE/$NAME\"\
        \ -o \"dist/$NAME\"; then\n    SHA=\"$(shasum -a 256 \"dist/$NAME\" | awk '{print $1}')\"\n    SIZE=\"$(wc -c < \"\
        dist/$NAME\" | tr -d ' ')\"\n    ARGS+=(--platform \"$SLUG=$CLI_BASE/$NAME=$SHA=$SIZE\")\n  fi\n  # A missing asset\
        \ is skipped, not fatal: the CLI tag stream is\n  # independent of the app tag stream, so a release that cut only\n\
        \  # the desktop apps legitimately has none of these. An absent slug\n  # means \"no update for you\"; a present-but-wrong\
        \ one would point\n  # every client of that platform at a 404.\ndone\n\n./scripts/updates/generate-manifest.sh \\\n\
        \  --version \"$V\" \\\n  --key \"$RUNNER_TEMP/update-signing.pem\" \\\n  --out dist/updates \\\n  \"${ARGS[@]}\"\n"
    - name: Verify the manifest we are about to publish
      run: "set -euo pipefail\n# Publishing an unverifiable manifest breaks every installed client\n# at once, and the failure\
        \ would only surface on contributors'\n# machines. Verify here, against the same public key clients pin.\nopenssl\
        \ pkey -in \"$RUNNER_TEMP/update-signing.pem\" -pubout \\\n  -out \"$RUNNER_TEMP/update-signing.pub.pem\"\nopenssl\
        \ base64 -d -A -in dist/updates/latest.json.sig \\\n  -out \"$RUNNER_TEMP/latest.sig.bin\"\nopenssl pkeyutl -verify\
        \ -rawin \\\n  -pubin -inkey \"$RUNNER_TEMP/update-signing.pub.pem\" \\\n  -sigfile \"$RUNNER_TEMP/latest.sig.bin\"\
        \ \\\n  -in dist/updates/latest.json\ncat dist/updates/latest.json\n"
    - name: Resolve Sparkle so sign_update exists
      run: swift package --package-path macos resolve
    - name: Import the Sparkle signing key
      env:
        GCP_PROJECT: tracecommons-pilot-2026
      run: "set -euo pipefail\ngcloud secrets versions access latest \\\n  --secret=sparkle-signing-key --project \"$GCP_PROJECT\"\
        \ \\\n  > \"$RUNNER_TEMP/sparkle-ed-key\"\nchmod 600 \"$RUNNER_TEMP/sparkle-ed-key\"\n"
    - name: Generate the signed appcast
      env:
        SHORT_VERSION: ${{ needs.version.outputs.short }}
        BUILD_VERSION: ${{ needs.version.outputs.build }}
        REPO: ${{ github.repository }}
      run: "set -euo pipefail\nV=\"$SHORT_VERSION\"\nSIGN_UPDATE=\"macos/.build/artifacts/sparkle/Sparkle/bin/sign_update\"\
        \ntest -x \"$SIGN_UPDATE\" || {\n  echo \"sign_update missing at $SIGN_UPDATE\" >&2; exit 1; }\n./scripts/updates/generate-appcast.sh\
        \ \\\n  --short-version \"$V\" \\\n  --build-version \"$BUILD_VERSION\" \\\n  --dmg-url \"https://github.com/$REPO/releases/download/app-v$V/TraceCommons-$V.dmg\"\
        \ \\\n  --dmg-path \"dist/macos-dmg/TraceCommons-$V.dmg\" \\\n  --sign-update \"$SIGN_UPDATE\" \\\n  --ed-key-file\
        \ \"$RUNNER_TEMP/sparkle-ed-key\" \\\n  --out dist/updates/appcast.xml\ncat dist/updates/appcast.xml\n"
    - name: Publish to the bucket
      env:
        BUCKET: tracecommons-flatpak
      run: "set -euo pipefail\n# Cache-Control is short: this is the file that decides whether a\n# contributor ever learns\
        \ a security fix shipped. A long edge cache\n# would silently extend that delay by hours.\ngcloud storage cp --cache-control=\"\
        public, max-age=300\" \\\n  dist/updates/latest.json dist/updates/latest.json.sig \\\n  \"gs://$BUCKET/updates/\"\n\
        # Conditional on the file rather than on a job result, so a macOS\n# failure simply leaves the previous appcast in\
        \ place rather than\n# replacing it with one pointing at a DMG that does not exist.\nif [ -f dist/updates/appcast.xml\
        \ ]; then\n  gcloud storage cp --cache-control=\"public, max-age=300\" \\\n    dist/updates/appcast.xml \"gs://$BUCKET/updates/\"\
        \nfi\n"
