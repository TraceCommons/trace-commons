name: tauri-desktop

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tauri-desktop/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  bundles:
    name: Unsigned ${{ matrix.platform }} bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bundles: appimage,deb
          - platform: windows
            os: windows-2025
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      RUSTFLAGS: -D warnings
    defaults:
      run:
        working-directory: tauri-desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config \
            wget xdg-utils
      - name: Install NSIS
        if: runner.os == 'Windows'
        working-directory: .
        run: choco install nsis --yes --no-progress
      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw 'NSIS installation did not provide makensis.exe'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
      - name: Build frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Build unsigned bundles
        run: >-
          pnpm dlx @tauri-apps/cli@2.11.5 build --ci --no-sign
          --bundles "${{ matrix.bundles }}"
          --config src-tauri/tauri.conf.json
          --config src-tauri/tauri.release.conf.json
          --config src-tauri/tauri.${{ matrix.platform }}.conf.json
          -- --locked
      - name: Upload unsigned Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-linux-unsigned
          path: |
            tauri-desktop/target/release/bundle/appimage/*.AppImage
            tauri-desktop/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-windows-unsigned
          path: |
            tauri-desktop/target/release/bundle/msi/*.msi
            tauri-desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config \
            wget
      - name: Check formatting
        run: cargo fmt --manifest-path tauri-desktop/src-tauri/Cargo.toml -- --check
      - name: Compile Tauri shell
        run: cargo check --locked --manifest-path tauri-desktop/src-tauri/Cargo.toml
      - name: Clippy Tauri shell
        if: runner.os == 'Linux'
        run: cargo clippy --locked --manifest-path tauri-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings -A clippy::type_complexity -A clippy::collapsible_if -A clippy::manual_option_as_slice -A clippy::useless_vec -A clippy::redundant_pattern_matching
      - name: Test Tauri shell
        run: cargo test --locked --manifest-path tauri-desktop/src-tauri/Cargo.toml

  cargo-deny:
    name: cargo deny Tauri dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: info
          manifest-path: tauri-desktop/src-tauri/Cargo.toml
          arguments: --all-features
          command-arguments: licenses sources
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: info
          manifest-path: tauri-desktop/src-tauri/Cargo.toml
          arguments: --all-features
          command-arguments: advisories

  msrv:
    name: Tauri builds at declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Derive Tauri MSRV
        id: floor
        run: |
          version="$(scripts/ci/msrv-floor.sh print tauri-desktop/src-tauri/Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Audit Tauri dependency MSRV
        run: scripts/ci/msrv-floor.sh audit tauri-desktop/src-tauri/Cargo.toml
      - name: Install Tauri MSRV toolchain
        run: rustup toolchain install "${{ steps.floor.outputs.version }}" --profile minimal --no-self-update
      - uses: ./.github/actions/apt-update-ubuntu-only
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config \
            wget
      - name: Check Tauri shell at the declared MSRV
        run: cargo "+${{ steps.floor.outputs.version }}" check --locked --manifest-path tauri-desktop/src-tauri/Cargo.toml
