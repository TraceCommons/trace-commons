name: Trim the cargo target directory before it is cached
description: >-
  Removes the parts of `target` that are large and worthless across runners,
  so what actions/cache saves is the compiled third-party dependency graph
  and not the linked outputs or the workspace's own crates. Run as the LAST
  step of a job that caches `target`, just before its save step.
#
# Why this exists. The repository's active caches sat at 14-16 GB against
# GitHub's 10 GB per-repository ceiling, so the LRU evictor ran continuously
# and a cache written on main was gone within minutes -- the weston job
# restored nothing on most PR runs and rebuilt two workspaces cold every
# time. Eighteen jobs cache `target`; at that count the only way under the
# ceiling is for each saved `target` to be smaller.
#
# What goes. `incremental/` is already empty on CI (CARGO_INCREMENTAL=0 at
# the workflow level) and is removed anyway so a job that sets it locally
# cannot quietly grow the cache. `examples/` and the linked executables --
# every test binary in `deps/`, every uplifted binary at the profile root,
# and on Windows the `.exe` and `.pdb` beside them -- are outputs, not
# inputs: cargo relinks them from the cached rlibs in seconds, and on a
# measured local workspace they were about 40% of `deps/`. Nothing that
# takes compile time to reproduce is touched: rlibs, rmeta, build-script
# outputs, fingerprints and the registry all stay.
#
# What it does NOT do: change any cache key. A key that nothing restores
# looks exactly like success, and this action's whole contribution is that
# the existing keys start to restore.
#
# Second pass, 2026-10-15. Trimming was not enough. On main's run at
# a0e7f9da, 12 of the 15 Linux jobs that cache `target` restored nothing:
# 22 jobs saved a cache, every pull request saved its own as well, and the
# client jobs' Windows and macOS caches held about 6 GB of the 10. Three
# changes followed:
#
# - Only a push to main saves. ci.yml splits actions/cache into
#   actions/cache/restore and actions/cache/save, and the save step runs on
#   a push to main only. A cache saved from a pull request or a merge-queue
#   ref can be restored by that ref alone, so saving one did nothing but
#   evict main's.
# - The jobs in clients.yml, none of them required, and five short Linux
#   jobs keep no cache. Nor, since a later pass the same day, do the two
#   PostgreSQL test jobs (`postgres-suites` and `ingest-bin-postgres`):
#   averaged over eight main runs, a restored cache saved them 1.7 and 0.8
#   minutes for about 2.5 GB, while `cargo check (near-ai-scorer)` saved
#   9 minutes for its 1.7 GB, and the remaining caches still overran 10 GB.
#   Cold, both jobs finish well inside `cargo test (default features)`, so
#   no pull request waits longer.
# - This action also removes the workspace's own crates (every path package
#   is named trace-commons-*). A fresh checkout gives each source file a
#   new mtime, so cargo rebuilds every workspace crate on every run whatever
#   the cache holds. Their artifacts -- the server and contributor rlibs
#   alone are about 1.1 GB in a local debug build -- were restored only to
#   be thrown away.
runs:
  using: composite
  steps:
    - name: Trim linked outputs, workspace crates and incremental state from every target directory
      shell: bash
      run: |
        set -euo pipefail
        report() {
          for t in target crates/trace-commons-contributor-gtk/target; do
            [ -d "$t" ] && du -sh "$t" 2>/dev/null || true
          done
        }
        echo "before trim:"; report
        # On Windows the runner's bash reports most files as executable, so
        # `-perm -u+x` there would select rlibs and rmeta and empty the cache
        # of exactly what it exists to keep. Windows selects by name only.
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          linked=( \( -name '*.exe' -o -name '*.pdb' \) )
        else
          linked=( -perm -u+x ! -name '*.so' ! -name '*.dylib' ! -name '*.rlib' )
        fi
        for profile in target/debug target/release \
                       crates/trace-commons-contributor-gtk/target/debug \
                       crates/trace-commons-contributor-gtk/target/release; do
          [ -d "$profile" ] || continue
          rm -rf "$profile/incremental" "$profile/examples"
          # Linked executables: every test binary in deps/ and every uplifted
          # binary at the profile root. Shared objects are excluded on unix
          # because they are executable and are real outputs of proc-macro
          # and cdylib crates that cargo would otherwise recompile.
          if [ -d "$profile/deps" ]; then
            find "$profile/deps" -maxdepth 1 -type f "${linked[@]}" -delete
          fi
          find "$profile" -maxdepth 1 -type f "${linked[@]}" ! -name '*.d' -delete
          # The workspace's own crates: cargo rebuilds them on every run
          # anyway, because checkout makes their sources newer than any
          # cached artifact. See the second pass above.
          rm -rf "$profile"/.fingerprint/trace-commons-* "$profile"/build/trace-commons-*
          for dir in "$profile/deps" "$profile"; do
            [ -d "$dir" ] || continue
            find "$dir" -maxdepth 1 -type f \( -name 'libtrace_commons*' \
              -o -name 'trace_commons*' -o -name 'trace-commons*' \) -delete
          done
        done
        echo "after trim:"; report
